# Sesión 3 · Un agente en producción
#
# Este archivo es la CABECERA y el ORDEN. El contenido de cada unidad vive en
# su propio archivo bajo `contenido/unidades/`, con el prefijo `sNN-uNN` para
# que el listado alfabético sea el orden del dictado.
#
# Los minutos van SOLO en cada ítem: la unidad suma los suyos y la sesión suma
# las unidades, de abajo hacia arriba (CONVENTIONS.md §15). La suma da 240.
#
# **El horario es nominal, y esta sesión no se dictó.** Se entregó como
# material: no hay fecha comprometida y **no lleva marcas de asistencia** —
# no hay lista que tomar en una sesión que nadie dictó. Las horas están porque
# `validar-contenido` compara la suma de los ítems contra la duración de la
# sesión, y esa comprobación es la que impide que el reparto se descuadre sin
# que nadie lo vea. Si algún día se dicta, se corrige la fecha y se decide
# entonces si hay asistencia.
#
# **La fuente de esta sesión es `texai/io-platform-engineer-ai-agent`**, no el
# laboratorio. `taller-ia-uni-lab` queda cerrado en la sesión 2: los retos 6 a
# 9 leen el agente de plataforma y reimplementan sus patrones en archivos
# propios, sin tocar el laboratorio que los alumnos ya tienen corriendo.
