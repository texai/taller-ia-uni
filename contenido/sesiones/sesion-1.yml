# Sesión 1 · El mundo y la percepción
#
# Estructura, no contenido definitivo. Los ítems están enunciados con su tipo,
# su título y sus minutos; el contenido de cada uno lo escriben los batches 15
# a 18, uno por unidad.
#
# Los minutos van SOLO en cada ítem: la unidad suma los suyos y la sesión suma
# las unidades, de abajo hacia arriba, para que ningún total pueda contradecir
# a sus partes (CONVENTIONS.md §15). El reparto sale del batch 3, cuadrado
# contra los cinco retos de `texai/taller-ia-uni-lab`. La suma da 240.

id: sesion-1
numero: 1
titulo: El mundo y la percepción
subtitulo: Sesión 1
fecha: 2026-08-08
horaInicio: "15:00"
horaFin: "19:00"

unidades:
  # ------------------------------------------------------------------ 15:00
  - id: s1-apertura
    tipo: repaso
    titulo: Dónde encaja esto
    objetivos:
      - Situar el taller dentro del programa y ver qué se junta acá
    requisitos:
      - Haber hecho el trabajo previo y llegar con las 24 comprobaciones en verde
    items:
      - id: s1-asistencia
        tipo: asistencia
        titulo: Tomar asistencia
        nota: El taller se evalúa solo por asistencia. Tomarla ahora, no al final.

      - id: s1-portada
        tipo: titulo
        titulo: Un agente que vigila 192 modelos
        entradilla: Arquitectura cognitiva para monitoreo de modelos en producción
        minutos: 2
        notas: |
          Preguntar quién hizo el trabajo previo. Si hay manos abajo, avisar que
          el rescate va en paralelo durante los próximos quince minutos, sin
          detener la clase.

      - id: s1-recap
        tipo: diagrama
        titulo: Lo que ya traen puesto
        entradilla: Cuatro cosas del programa se juntan hoy, y dejan una pregunta abierta
        clase: componentes
        minutos: 4
        contenido: |
          flowchart LR
            D["Docker<br/>empaquetar un modelo"] --> F
            G["GitHub Actions<br/>desplegarlo solo"] --> F
            K["Kubernetes<br/>operarlo"] --> F
            ML["MLflow<br/>registrar sus versiones"] --> F
            F[("la flota<br/>192 modelos<br/>en produccion")] --> Q{"y ahora,<br/>quien los mira?"}
            Q --> HOY["hoy: un Excel los lunes,<br/>5 de las 24 tiendas"]
            Q -.->|las proximas 8 horas| AG["un agente<br/>que los vigila"]
        notas: |
          **Es el repaso del programa, no del taller.** Cuatro módulos dejaron
          cada uno una pieza, y hoy están todas puestas a la vez. Nombrar cada
          caja y dejar que la sala reconozca lo suyo: casi todos hicieron el
          taller de Docker, GitHub Actions y Kubernetes, donde el último bloque
          fue "monitoreo básico y operación". **Esto empieza justo donde lo
          básico deja de alcanzar.** Y el registro de modelos que van a ver hoy
          es MLflow, el mismo del Módulo 2.

          Lo que importa del dibujo es el rombo. Todo lo de la izquierda es
          construir y desplegar; a la derecha no hay nada equivalente. La
          flecha punteada es el taller entero.

          No detenerse en las cajas: se miran y se pasan. La caja del Excel es
          la que engancha con el caso, que viene enseguida.

      - id: s1-donde-estamos
        tipo: transicion
        titulo: Dónde estamos
        vimos: >-
          Cómo se empaqueta un modelo, cómo se automatiza su despliegue, y qué
          es monitorear en producción
        viene: >-
          Los 192 modelos que ya están desplegados, y el problema de que nadie
          los mire
        minutos: 2
        notas: |
          Después del diagrama esto es media frase y el mapa de la sesión, que
          la aplicación dibuja sola: qué unidades quedan por delante y cuál
          viene ahora.

  # ------------------------------------------------------------------ 15:05
  # El caso es una unidad propia y no un ítem hundido dentro del repaso: es el
  # marco de las ocho horas, y todo lo que sigue —los cinco retos— ocurre
  # dentro de él. Que tenga su sitio en el índice es la diferencia entre un
  # ejercicio y un caso.
  - id: s1-caso
    tipo: caso
    titulo: El caso
    objetivos:
      - Entender el negocio dentro del cual ocurren los cinco retos
    items:
      - id: s1-el-caso
        tipo: caso
        archivo: casos/retail-192.yml
        minutos: 5
        notas: |
          El marco de las ocho horas. Todo lo que viene —los cinco retos— pasa
          dentro de esta empresa y sobre esta flota.

          Leer las cifras en voz alta y dejarlas respirar. No dar todavía los
          números del sesgo silencioso: eso es el reto 1, y adelantarlo le quita
          el golpe. Acá basta con que quede la imagen del Excel de los lunes.

          Este mismo caso vuelve a abrir el domingo, desde el mismo archivo,
          para quien no vino.

  # ------------------------------------------------------------------ 15:10
  - id: s1-flota
    tipo: repaso
    titulo: La flota de 192 modelos
    objetivos:
      - Entender qué es una flota de modelos desplegados y quién la vigila hoy
      - "Leer la telemetría: qué dice el MAPE, qué dice el sesgo, qué dice la cobertura"
    items:
      - id: s1-que-es-un-modelo
        tipo: markdown
        titulo: Qué es "un modelo en producción"
        minutos: 2
        contenido: |
          Acá un modelo **no es un chatbot**. Es un **artefacto entrenado**: un
          archivo con los coeficientes que quedaron de ajustar una regresión
          contra el histórico de una tienda y una categoría.

          Cada uno de los 192 es una regresión Ridge sobre features de:

          - **rezagos** de 7, 14 y 28 días
          - **medias móviles** de 7 y 28 días
          - **día de la semana**
          - si ese día hubo **promoción**

          Deliberadamente simple. El taller no trata de exprimir precisión;
          trata de vigilar modelos que ya están corriendo.
        notas: |
          Si alguien pregunta por qué Ridge y no algo mejor: porque un modelo
          más complejo no cambiaría nada de lo que vamos a hacer, y sí
          alargaría el entrenamiento de los 192.

      - id: s1-modelo-vs-contenedor
        tipo: comparacion
        titulo: Un modelo no es un contenedor
        entradilla: La relación no es 1 a 1, y en el taller anterior lo parecía
        minutos: 2
        izquierda:
          titulo: Lo que vieron desplegando
          contenido: >-
            Un modelo empaquetado en su imagen, expuesto como servicio de
            inferencia, respondiendo peticiones HTTP. Una imagen, un modelo, un
            endpoint.
        derecha:
          titulo: Lo que hay acá
          contenido: >-
            Un job batch que corre de madrugada, carga los 192 artefactos de
            disco y escribe un CSV. Nadie necesita una respuesta en 50
            milisegundos para decidir qué reponer mañana. Una imagen, 192
            modelos, ningún endpoint.
        notas: |
          Este es el punto que más se resiste. Vale la pena decirlo dos veces:
          el patrón de despliegue dominante en pronóstico de demanda es batch,
          no servicio. Y desde el lado del monitoreo cambia todo — un servicio
          se cae y alguien se entera; un job batch termina bien y entrega
          basura.

      - id: s1-arquitectura
        tipo: diagrama
        titulo: La solución completa, por componentes
        clase: componentes
        minutos: 4
        contenido: |
          flowchart LR
            V[("ventas.csv<br/>el mundo")] --> E["entrenar<br/>192 Ridge"]
            E --> M[("modelos/<br/>192 artefactos")]
            E -.->|registro| ML[("MLflow")]
            M --> J["job batch<br/>de madrugada"]
            V --> J
            J --> P[("predicciones.csv")]
            P -->|cruce contra lo vendido| TM[("metricas.csv<br/>la telemetria")]
            V --> TM
            TM --> API["API :8000"]
            API --> UI["interfaz :8501"]
            API -.->|mañana| AG["el agente"]
        notas: |
          Es el mapa al que se vuelve toda la clase. Dejarlo bien anclado.

          Dos cosas que señalar con el dedo: `ventas.csv` entra DOS veces —una
          para entrenar y otra para calcular métricas, porque un modelo no se
          degrada en abstracto sino contra la realidad— y el agente todavía no
          existe. Lo construimos nosotros.

      - id: s1-make
        tipo: tabla
        titulo: Todos los comandos del taller son atajos
        entradilla: Y hoy los abrimos. Detrás de cada make hay un docker compose que se puede teclear entero.
        minutos: 3
        columnas: [Lo que tecleas, Lo que corre de verdad]
        filas:
          - ["`make arriba`", "`docker compose build` y luego `docker compose up -d plataforma ui`"]
          - ["`make seed`", "`docker compose run --rm plataforma python -m plataforma seed`"]
          - ["`make romper ESCENARIO=x`", "`escenario --nombre x`, después `pronosticar`, después `metricas`"]
          - ["`make agente`", "`docker compose run --rm agente python -m agente run`"]
          - ["`make actuar`", "lo mismo, más `-e EJECUTAR_ACCIONES=1`"]
          - ["`make ui`", "`docker compose up -d ui` — **`up`, no `run`**"]
          - ["`make reset`", "`docker compose down -v` — la `-v` borra los volúmenes"]
        resaltar: [5]
        notas: |
          Empezar por qué es `make`: un ejecutor de recetas de 1976, anterior a
          Docker y a casi todo lo demás. Lee el archivo `Makefile` del
          directorio, busca la receta que le pediste y ejecuta sus líneas. Nada
          más. `make ayuda` las lista todas, y `cat Makefile` las muestra.

          La fila resaltada es la trampa del día: **`make ui` usa `up`, no
          `run`**, y esa palabra decide si algo queda vivo o se ejecuta y
          desaparece. Vuelve tres veces durante la clase.

          Lo que quiero que se lleven no es la tabla: es que **ningún comando
          del taller es magia**, y que el día que trabajen sin este Makefile
          sepan escribir la columna de la derecha. El propio código de la
          plataforma lo dice en su docstring — "en clase se usan los atajos del
          Makefile, pero conviene que los alumnos vean que detrás no hay
          magia".

      - id: s1-levantar
        tipo: comando-anotado
        titulo: Levantar el entorno
        entradilla: Esto es lo que hace make arriba, sin el atajo
        comando: docker compose up -d plataforma ui
        minutos: 3
        segmentos:
          - texto: docker compose
            explicacion: >-
              Lee `docker-compose.yml` y trabaja sobre los servicios declarados
              ahí. Con guion —`docker-compose`— es la versión 1, un binario
              aparte que ya no se instala; sin guion es el plugin actual. El
              Makefile detecta cuál tienes, para no obligar a nadie a
              reinstalar Docker el sábado por la mañana.
            otrosValores: ["docker-compose"]
          - texto: up
            explicacion: >-
              Levanta los servicios y los deja corriendo. Si falta la imagen,
              la construye antes. `make arriba` además fuerza un `build`
              previo, porque construye TRES imágenes y solo levanta dos: la del
              agente no es un servicio, y sin ese `build` su construcción le
              cae encima al alumno en plena clase.
            otrosValores: ["down", "ps", "logs", "build", "run"]
          - texto: "-d"
            explicacion: >-
              Detached. Devuelve la terminal en lugar de quedarse pegado a los
              logs. Sin esto, cerrar la ventana se lleva los servicios por
              delante. Para ver los logs después, `make logs`.
          - texto: plataforma ui
            explicacion: >-
              Qué servicios levantar, con el nombre que tienen en el YAML. Sin
              nombres levantaría todos los que no estén detrás de un `profile`
              — `mlflow` y `ollama` lo están, por eso hay que pedirlos aparte.
              Nombrar los dos deja claro que **`agente` no es un servicio**.
        notas: |
          Es el primer comando de Docker que muchos van a leer entero. Ir
          despacio: cada paso del recorrido es un segmento.

          Si alguien pregunta por qué el agente no es un servicio: porque no
          escucha nada. Corre una vez al día, produce un diagnóstico y termina.
          Eso es el ítem de `--rm`, dos pantallas más adelante.

      - id: s1-seed
        tipo: comando-anotado
        titulo: Poblar el mundo
        entradilla: Y esto es make seed
        comando: docker compose run --rm plataforma python -m plataforma seed
        minutos: 4
        segmentos:
          - texto: run
            explicacion: >-
              Arranca un contenedor **nuevo** del servicio, le pasa un comando,
              y termina cuando el comando termina. Es lo contrario de `up`:
              `up` deja algo vivo escuchando, `run` ejecuta una tarea y se va.
              Por eso `make estado` nunca muestra nada de esto.
            otrosValores: ["up", "exec"]
          - texto: "--rm"
            explicacion: >-
              Borra el contenedor al terminar. Sin esto cada corrida deja uno
              parado en disco, y a la décima `docker ps -a` es una lista de
              cadáveres. Se puede borrar el contenedor sin perder nada porque
              lo que se produce no vive en él: vive en el volumen `datos`.
          - texto: plataforma python
            explicacion: >-
              La costura de la línea. A la izquierda de ese espacio, el
              servicio tal como se llama en el YAML —de ahí salen la imagen,
              los volúmenes y las variables de entorno, sin repetir nada acá—;
              a la derecha, lo que se ejecuta **dentro** del contenedor. Todo
              lo que sigue ya no es de Docker.
            otrosValores: ["agente python", "ui python"]
          - texto: -m plataforma seed
            explicacion: >-
              `-m` corre un paquete de Python como si fuera un programa,
              buscando su `__main__.py`. `seed` es un subcomando de **ese**
              programa: hay también `datos`, `entrenar`, `pronosticar`,
              `metricas` y `escenario`, y cada uno tiene su atajo en el
              Makefile. `seed` encadena los cuatro primeros.
        notas: |
          El segmento de `--rm` es el que más rinde. La pregunta natural —"si
          borras el contenedor, ¿dónde quedan los 192 modelos?"— es la puerta
          de entrada a los volúmenes, y vale la pena dejar que la hagan.

          En Windows esta línea se teclea igual. El `.\taller.ps1` envuelve al
          `make`, no al `docker compose`.

      - id: s1-seed-salida
        tipo: salida-anotada
        titulo: Y esto es lo que imprime
        entradilla: Cinco minutos de espera, cinco líneas de salida, y las cuatro flechas del diagrama
        comando: docker compose run --rm plataforma python -m plataforma seed
        salida: |
          1/4 Generando historico de ventas...
          2/4 Entrenando la flota (192 modelos)...
          3/4 Corriendo el job batch de pronostico...
          4/4 Calculando metricas...

          Listo. 192 modelos con 17,472 dias-modelo de telemetria.
        minutos: 4
        anotaciones:
          - texto: "1/4 Generando historico"
            explicacion: >-
              Escribe `ventas.csv`. Es el mundo — cuatrocientos días de ventas
              inventados con una semilla fija, para que todos tengan el mismo.
              En producción esta etapa no existe: el mundo llega solo.
          - texto: "2/4 Entrenando la flota (192 modelos)"
            explicacion: >-
              Deja 192 artefactos en disco, uno por tienda y categoría. Corta
              91 días antes de hoy a propósito: lo que el modelo no llega a ver
              es exactamente contra lo que se lo va a evaluar.
          - texto: "3/4 Corriendo el job batch"
            explicacion: >-
              **Este es el job de madrugada del caso.** Carga los 192, proyecta
              los días que quedaron fuera del entrenamiento y escribe
              `predicciones.csv`. Cada corrida deja además una fila en su
              bitácora: si corrió, cuánto tardó, si falló.
          - texto: "4/4 Calculando metricas"
            explicacion: >-
              Cruza predicción contra realidad. Es la **única** etapa que
              produce telemetría, y sin ella no hay absolutamente nada que
              monitorear. Todo el taller vive de este cruce.
          - texto: "17,472"
            explicacion: >-
              192 modelos × 91 días evaluados. Un dato por modelo y por día. Si
              a alguien le sale otro número, casi seguro dejó el mundo roto de
              una prueba anterior: `make reparar` y listo.
        notas: |
          Recorrer las cuatro etapas señalando el diagrama de arquitectura de
          hace tres láminas: **son sus cuatro flechas, en el mismo orden**.

          La anotación del `3/4` es la que engancha con el caso, y la frase que
          rinde en la sesión 2 va acá: el agente también vigila el job. Un
          modelo puede estar perfectamente sano y la tubería caída desde el
          martes.

          Quien hizo el trabajo previo ya tiene todo esto y solo necesita
          `make arriba`. Tarda unos cinco minutos la primera vez.

      - id: s1-flota-pausa
        tipo: pausa-preguntas
        titulo: Pausa · ¿a alguien no le levantó?
        minutos: 2
        disparadores:
          - ¿Alguien vio un número distinto de 17,472?
          - ¿Alguna imagen se quedó construyendo?
          - ¿Quedó alguna duda de qué hace `run --rm` que no sea `up`?
        notas: |
          Dos minutos, no cinco. El sitio es este y no antes: acabamos de
          teclear los dos comandos que todo el resto del taller da por hechos,
          y si alguien se quedó atrás hay que saberlo **ahora**, no cuando
          empiece el reto 1.

          Los tres rescates vienen justo después. Si alguien levanta la mano
          con uno de ellos, la respuesta es "es la siguiente lámina".

      - id: s1-rescate-docker
        tipo: error-comun
        titulo: "Rescate · el motor no está corriendo"
        minutos: 2
        sintoma: >-
          open //./pipe/dockerDesktopLinuxEngine: The system cannot find the
          file specified
        causa: >-
          Docker Desktop está cerrado. El mensaje habla de un named pipe, que es
          el canal entre el cliente de Docker y su motor — y por eso no se
          parece en nada a "abre Docker".
        arreglo: >-
          Abrir Docker Desktop y esperar a que la ballena deje de moverse. Ojo
          con la trampa: `docker compose version` responde bien con Docker
          cerrado, porque contesta el cliente. Quien quiera comprobar de verdad
          que el motor está vivo, `docker info`.

      - id: s1-rescate-recarga
        tipo: error-comun
        titulo: "Rescate · el contenedor sirve el código con el que arrancó"
        minutos: 2
        sintoma: >-
          Un 404 en una ruta que está en el archivo. O la interfaz reventando
          por una columna que llega como texto. O un `git pull` que parece no
          haber hecho nada.
        causa: >-
          Tres síntomas distintos, un solo error: el proceso dentro del
          contenedor sigue ejecutando el código que había cuando arrancó, no el
          que hay ahora en disco.
        arreglo: >-
          Reiniciar el servicio. En este laboratorio ya está resuelto con
          `--reload` en uvicorn y con sondeo del sistema de archivos, que hace
          falta en Windows porque los avisos de cambio no cruzan el montaje.
        notas: |
          Este apareció tres veces preparando el taller, con tres caras
          distintas, y era el mismo error cada vez. Es típico de cualquier
          laboratorio con volúmenes montados, así que vale por sí solo como
          material: la pregunta a hacerse siempre es "¿el proceso vio este
          archivo?".

      - id: s1-rescate-disco
        tipo: error-comun
        titulo: "Rescate · disco lleno a mitad de la construcción"
        minutos: 2
        sintoma: La construcción de las imágenes falla por espacio.
        causa: >-
          Las imágenes de este laboratorio ocupan del orden de 6 GB, y la caché
          de construcción otro tanto.
        arreglo: "`docker builder prune -f`, y dejar 12 GB libres antes de empezar."

      - id: s1-telemetria
        tipo: modelo-datos
        titulo: Qué emite la flota
        entradilla: Una fila por modelo y por día. Esto es todo lo que el agente va a poder mirar.
        minutos: 3
        tablas:
          - nombre: metricas
            descripcion: >-
              El resultado de cruzar lo que se pronosticó contra lo que
              realmente se vendió.
            columnas:
              - { nombre: fecha, tipo: date }
              - { nombre: modelo_id, tipo: text, nota: "dem-{categoria}-{tienda}" }
              - { nombre: categoria, tipo: text }
              - { nombre: tienda, tipo: text }
              - { nombre: region, tipo: text, nota: LIMA, NORTE, SUR, CENTRO, ORIENTE }
              - { nombre: n, tipo: int, nota: días que entraron en el cálculo }
              - { nombre: mape, tipo: float, nota: cuánto se equivoca }
              - { nombre: sesgo_pct, tipo: float, nota: hacia qué lado }
              - { nombre: cobertura, tipo: float, nota: qué tanto acierta el intervalo }
              - { nombre: latencia_p95_ms, tipo: int }
              - { nombre: unidades_reales, tipo: float }
              - { nombre: unidades_pronosticadas, tipo: float }
              - { nombre: dias_en_promocion, tipo: int }
              - { nombre: dias_con_quiebre, tipo: int }
        notas: |
          Señalar que `unidades_reales` y `unidades_pronosticadas` están además
          de los porcentajes. No es redundancia: sin las unidades no se puede
          agregar bien. Por qué, es el reto 2 — no adelantarlo.

      - id: s1-metricas-definidas
        tipo: markdown
        titulo: "MAPE: cuánto se equivoca"
        minutos: 2
        contenido: |
          El error porcentual absoluto medio. Para cada día se toma la
          diferencia entre lo pronosticado y lo vendido, en valor absoluto, y se
          divide entre lo vendido. El promedio de eso.

          **Es una distancia, no una dirección.** Un modelo que se pasa por 10
          unidades y otro que se queda corto por 10 tienen exactamente el mismo
          MAPE.

          Es la métrica que todo el mundo mira, y es la única de las tres que
          casi siempre está en el tablero.
        notas: |
          Insistir en "valor absoluto". De ahí sale toda la unidad siguiente.

      - id: s1-sesgo
        tipo: comparacion
        titulo: "Sesgo: hacia qué lado se equivoca"
        entradilla: La misma resta, sin el valor absoluto
        minutos: 4
        izquierda:
          titulo: MAPE
          contenido: >-
            Promedio de |pronóstico − real| ÷ real. Siempre positivo. Dice qué
            tan lejos cae el modelo, y nada más.
        derecha:
          titulo: Sesgo
          contenido: >-
            Promedio de (pronóstico − real) ÷ real. Con signo. Positivo
            significa que el modelo pronostica de más — y pronosticar de más
            durante tres semanas es inventario que alguien compró y nadie
            vendió.
        notas: |
          Acá va la frase que sostiene el taller: el MAPE puede quedarse quieto
          mientras el sesgo se dispara. Ese es el modo de falla más caro y el
          que ningún umbral sobre el MAPE detecta. No dar todavía los números
          — son del reto 1.

      - id: s1-pregunta-cobertura
        tipo: pregunta
        titulo: Antes de verlo
        pregunta: >-
          Un modelo publica intervalos de predicción al 90%. Midiendo los
          últimos 14 días, la realidad cae dentro del intervalo el 97% de las
          veces. ¿Qué está pasando?
        visibilidad: publica
        permiteOmitir: true
        respuesta: El modelo se está cubriendo las espaldas
        minutos: 3
        opciones:
          - El modelo está muy bien calibrado
          - El modelo se está cubriendo las espaldas
          - Faltan datos para decirlo
          - El intervalo está mal calculado
        notas: |
          Es la métrica que casi todos leen mal, y por eso se pregunta **antes**
          de explicarla. Dejar que se equivoquen: la primera opción es la que
          gana casi siempre, y equivocarse acá es lo que hace que la
          explicación se quede.
        solucion:
          explicacion: |
            **97% de cobertura en un intervalo del 90% no es estar mejor: es
            estar peor.** El modelo prometió acertar 9 de cada 10 veces y
            acierta 9.7 — porque abrió el intervalo más de lo necesario.

            Un intervalo que casi nunca falla es un intervalo tan ancho que no
            sirve para decidir nada. "Entre 40 y 400 unidades" nunca se
            equivoca, y nunca ayuda a reponer.

            Lo que se busca es cobertura **cerca** del nominal, por arriba o por
            abajo. Alejarse hacia arriba es tan síntoma como alejarse hacia
            abajo, y es el que nadie mira porque suena a buena noticia.
          descartes:
            - opcion: El modelo está muy bien calibrado
              razon: >-
                Calibrado sería 90%. 97% es siete puntos de más, y en un tablero
                pintado de verde eso pasa por excelencia.
            - opcion: Faltan datos para decirlo
              razon: >-
                Catorce días de 192 modelos son 2,688 observaciones. La duda
                razonable acá no es de tamaño de muestra.
            - opcion: El intervalo está mal calculado
              razon: >-
                Puede estarlo, pero no hace falta suponerlo: un intervalo bien
                calculado sobre un modelo inseguro da exactamente esto.

      - id: s1-cobertura
        tipo: markdown
        titulo: "Cobertura: la que casi todos leen mal"
        minutos: 2
        contenido: |
          Cada predicción viene con un intervalo. La cobertura es **qué
          fracción de los días la venta real cayó dentro de ese intervalo**.

          No es el porcentaje de días con predicción disponible. No es cuántos
          modelos corrieron. Es cuántas veces el modelo dijo la verdad sobre su
          propia incertidumbre.

          Una cobertura que se desploma es un modelo que dejó de saber lo que
          no sabe — y eso suele pasar antes de que el MAPE se mueva.
        notas: |
          Preguntar qué creen que mide antes de decirlo. La confusión con "días
          con predicción disponible" es tan común que vale la pena que salga de
          ellos.

      - id: s1-demo-ui
        tipo: demo
        titulo: La flota, de un vistazo
        minutos: 4
        pasos:
          - comando: docker compose up -d ui
            esperado: "http://localhost:8501"
          - comando: docker compose ps
            esperado: plataforma y ui, corriendo. El agente no aparece.
        observar: >-
          192 filas. Ordenar por MAPE y ver que hay modelos malos que llevan
          meses siendo malos sin que nadie los toque. Ordenar por sesgo y ver
          que no es la misma lista. Esa diferencia es el taller entero.
        respaldo: >-
          Si la interfaz no levanta, la misma información sale por la API:
          `curl -s localhost:8000/v1/metricas | head`. Y si tampoco, seguir con
          el diagrama: nada de lo que viene depende de haber visto esta
          pantalla.
        notas: |
          Cinco minutos, no diez. La tentación es empezar a analizar acá, y el
          análisis es el reto 1.

          **Esto es `make ui`, y es el `up` de la tabla del principio.** Vale
          la pena hacer el segundo paso —`docker compose ps`, que es `make
          estado`— para que se vea con los ojos: la interfaz y la plataforma
          están ahí porque se levantaron con `up -d`; de los `run --rm` que
          llevamos corridos no queda ni rastro. Uno deja algo vivo; el otro
          ejecuta y desaparece.

          Se apagan con `make abajo`, que es `docker compose down`. Sin la
          `-v`: esa borraría los volúmenes, y con ellos los 192 modelos.

      - id: s1-flota-dada
        tipo: criterios
        titulo: Las reglas del laboratorio
        minutos: 2
        criterios:
          - texto: Los 192 modelos vienen dados. No se tocan.
            pista: Nadie va a entrenar nada mejor hoy. Ese no es el ejercicio.
          - texto: La plataforma y su API vienen dadas. Tampoco se tocan.
          - texto: Lo que construimos es lo que vigila. Nada más.
        notas: |
          Decirlo explícitamente ahorra media hora. Siempre hay alguien que
          quiere mejorar el modelo, y es una conversación legítima que hay que
          cortar acá.

      - id: s1-pregunta-hoy
        tipo: pregunta
        titulo: ¿Cómo se enteran hoy?
        pregunta: >-
          En donde trabajas, si un modelo en producción empieza a fallar hoy,
          ¿cómo se entera alguien?
        visibilidad: publica
        permiteOmitir: true
        minutos: 3
        opciones:
          - Un tablero con umbrales
          - Alguien revisa a mano
          - Cuando se queja el negocio
          - No nos enteramos
        notas: |
          Revelar recién cuando hayan respondido todos. "Cuando se queja el
          negocio" suele ganar, y es la mejor entrada posible al reto 1: para
          cuando el negocio se queja, el sobre-stock ya está comprado.
        solucion:
          explicacion: |
            Acá no hay respuesta correcta: es un retrato de la sala. Lo que
            importa es que casi siempre gana "cuando se queja el negocio", y esa
            es la peor de las cuatro — porque para cuando el negocio se queja,
            el sobre-stock ya está comprado y las semanas ya pasaron.
          descartes:
            - opcion: Un tablero con umbrales
              razon: >-
                Es lo que suena mejor y es lo que va a fallar hoy: un umbral
                sobre el MAPE no ve el sesgo silencioso. Lo vamos a comprobar
                en el reto 1.
            - opcion: Alguien revisa a mano
              razon: >-
                Funciona hasta que hay 192 modelos. Es exactamente lo que
                vamos a intentar en la próxima hora, para sentir dónde deja de
                escalar.
            - opcion: Cuando se queja el negocio
              razon: >-
                No es un mecanismo de detección: es la factura. Llega semanas
                después del problema.
            - opcion: No nos enteramos
              razon: >-
                La respuesta más honesta, y más común de lo que parece. Es el
                punto de partida de este taller.

      - id: s1-repaso-preguntas
        tipo: pausa-preguntas
        titulo: Pausa para preguntas
        minutos: 2
        disparadores:
          - ¿Alguien tiene hoy más de diez modelos en producción?
          - ¿Quién mira las métricas de esos modelos, y cada cuánto?
          - ¿Alguna vez se enteraron tarde de que un modelo se había degradado?

  # ------------------------------------------------------------------ 16:00
  - id: s1-reto-1
    tipo: reto
    titulo: Encontrar el problema a mano
    objetivos:
      - Sentir que revisar 192 modelos a mano no escala
      - Descubrir que la métrica que estaban mirando no era la que hablaba de plata
      - Salir con la pregunta de cuánto tardarían haciendo esto cada mañana
    requisitos:
      - Entorno levantado y con datos
      - Saber qué son el MAPE, el sesgo y la cobertura
    items:
      - id: s1-r1-titulo
        tipo: titulo
        titulo: "Reto 1 · Encuentra el problema a mano"
        entradilla: Sin agente, sin LLM. Tú, la API y pandas.
        minutos: 2
        notas: |
          Dejar claro que este reto no se "resuelve": se sufre. El segundo
          escenario está hecho para que no lo encuentren, y eso es el punto.

      - id: s1-r1-mapa
        tipo: diagrama
        titulo: Los pasos de este reto
        entradilla: Cuarenta minutos, cuatro pasos, y una pregunta al final
        clase: flujo
        minutos: 2
        contenido: |
          flowchart TD
            A["1 · romper el mundo<br/>campana_promocional"] --> B["2 · buscarlo<br/>con la API y pandas"]
            B --> C["3 · repararlo y romperlo<br/>otra vez: sesgo_silencioso"]
            C --> D["4 · buscarlo<br/>con el mismo metodo"]
            D --> E{{"lo que te llevas:<br/>cuanto tardas en encontrar<br/>lo que no suena"}}
        notas: |
          **Es el mapa del trabajo, no de la solución.** Dice qué se va a
          hacer; cómo, lo descubren ellos.

          Los cinco retos abren con un dibujo de esta misma forma —pasos
          numerados de izquierda a derecha y un hexágono al final con lo que se
          llevan— para que a partir del segundo nadie tenga que leerlo: ya sabe
          dónde mirar.

          El paso 3 es el que sorprende. Casi nadie espera que el reto sea
          hacer lo mismo dos veces, y ahí está el punto: la segunda vez el
          método no encuentra nada.
      - id: s1-r1-encargo
        tipo: markdown
        titulo: El encargo
        minutos: 2
        contenido: |
          Uno de los 192 modelos —o muchos— se está portando mal. Encuéntralo
          con las herramientas de siempre.

          Tres preguntas, en este orden:

          1. ¿Cuál es el **MAPE medio de la flota** en los últimos 14 días?
          2. ¿Qué **categoría** está peor? ¿En cuántas tiendas?
          3. ¿El problema es de esa categoría, de una **región**, o de la
             **cadena entera**?

          La tercera es la que importa. Las dos primeras son para llegar a
          ella.
        notas: |
          Insistir en el orden. Quien salta directo a mirar modelos
          individuales se pierde: con 192 series, mirar de a una no converge.
          El camino es agregar y comparar cortes.

      - id: s1-r1-api
        tipo: comando-anotado
        titulo: La telemetría, por la API
        entradilla: También está en http://localhost:8000/docs, con la interfaz de Swagger
        comando: curl -s "http://localhost:8000/v1/metricas?categoria=bebidas&desde=2026-07-01"
        minutos: 4
        segmentos:
          - texto: "-s"
            explicacion: >-
              Silencioso. Sin esto curl escupe una barra de progreso que se
              mezcla con el JSON y ensucia todo lo que venga después en la
              tubería.
            otrosValores: ["-v", "-i"]
          - texto: "categoria=bebidas"
            explicacion: >-
              Filtra por categoría. Los filtros del endpoint son
              `modelo_id`, `categoria`, `tienda`, `region`, `desde` y `hasta`,
              y se combinan entre sí.
          - texto: "desde=2026-07-01"
            explicacion: >-
              Recorta la ventana. Sin fecha vienen los 90 días de todos los
              modelos: 17,472 filas, que es exactamente lo que no se puede leer
              a ojo.
        notas: |
          Es la primera vez que ven la API. Vale la pena abrir `/docs` en vivo
          y dejar que exploren treinta segundos.

      - id: s1-r1-romper
        tipo: comando-anotado
        titulo: Romper el mundo
        entradilla: Primero el escenario visible. Esta es la primera de las tres etapas de make romper.
        comando: docker compose run --rm plataforma python -m plataforma escenario --nombre campana_promocional
        minutos: 3
        segmentos:
          - texto: escenario
            explicacion: >-
              El subcomando que degrada el mundo. Reescribe el histórico de
              ventas ya generado: no toca los modelos ni las predicciones, solo
              la realidad contra la que se van a medir.
            otrosValores: ["datos", "entrenar", "pronosticar", "metricas", "seed"]
          - texto: "--nombre campana_promocional"
            explicacion: >-
              Cuál de las cuatro degradaciones aplicar. Es obligatorio y no
              admite un valor inventado: el programa lo valida contra su lista
              y falla enumerando las opciones. Esta es una campaña de descuentos
              en bebidas, mucho más agresiva que cualquiera del entrenamiento,
              en las últimas cuatro semanas.
            otrosValores: ["sesgo_silencioso", "feed_caido", "quiebre_stock"]
        notas: |
          Hay dos parámetros más que hoy no usamos y conviene nombrar:
          `--categoria` y `--tienda` acotan el daño a un corte concreto, y
          `--desde` mueve la fecha en que empieza. Sirven para armarse
          escenarios propios después del taller.

          El comando imprime cuántas filas tocó y termina diciendo
          `ahora corre: make pronosticar && make metricas`. Esa es la pista de
          lo que viene en el ítem siguiente.

      - id: s1-r1-romper-receta
        tipo: codigo
        titulo: Por qué son tres comandos y no uno
        entradilla: La receta de make romper, tal cual está en el Makefile
        lenguaje: makefile
        ruta: Makefile
        minutos: 2
        resaltar: ["2-3"]
        contenido: |
          romper:  ## Degrada los datos, rompe el mundo
          	$(EN_PLATAFORMA) escenario --nombre $(ESCENARIO)
          	$(MAKE) pronosticar
          	$(MAKE) metricas
        notas: |
          Tres líneas, tres contenedores, en orden. Y lo que importa es **lo
          que NO está en la lista**: no hay `entrenar`.

          El mundo cambió, se volvió a correr el job con los modelos viejos, y
          se midió. Los 192 modelos siguen siendo exactamente los mismos de
          hace un minuto. Eso no es una simplificación del laboratorio: es
          literalmente lo que pasa en producción, donde el reentrenamiento es
          semanal o mensual y el mundo cambia cuando le da la gana.

          `$(EN_PLATAFORMA)` es la variable de arriba del archivo:
          `docker compose run --rm plataforma python -m plataforma`. Se define
          una vez y se reutiliza en las seis recetas de la plataforma.

      - id: s1-r1-a-mano
        tipo: demo
        titulo: Encontrarlo con pandas
        minutos: 5
        pasos:
          - comando: "# agrupar por categoría, últimos 14 días, y ordenar por MAPE"
          - comando: "# para la peor: agrupar por tienda y contar cuántas están mal"
        observar: >-
          Bebidas se despega del resto y no hay ninguna duda de cuál es. Está
          mal en las 24 tiendas a la vez, así que no es una tienda: es la
          categoría. Y el sesgo es fuertemente negativo — el modelo pronosticó
          de MENOS, porque la promoción disparó la venta real y él no la vio
          venir.
        respaldo: >-
          Si alguien se traba con pandas, la interfaz de :8501 ordena por MAPE
          con un clic. El objetivo es la lectura, no el groupby.
        notas: |
          Medido acá: el MAPE de la flota sube de 13.8% a 16.0%, el de bebidas
          pasa de 12.9% a 30.8% —más del doble de la flota— y 18 de las 24
          tiendas de bebidas cruzan el 20%. Estos números se mueven algo según
          el día en que cada uno generó su mundo; el que no se mueve es que
          bebidas se despega sola.

      - id: s1-r1-visible
        tipo: metrica
        titulo: Cinco minutos
        valor: "1"
        unidad: categoría, 24 tiendas, encontrada a ojo
        contexto: Esto es lo que un tablero con umbrales sí detecta. Ninguna gracia.
        tono: bueno
        minutos: 2
        notas: |
          Bajar las expectativas a propósito. La sensación de "esto era fácil"
          es lo que hace que el escenario siguiente duela.

      - id: s1-r1-prediccion
        tipo: pregunta
        titulo: Antes de correrlo, apuesten
        pregunta: >-
          El segundo escenario es una caída lenta y pareja de la demanda en
          TODA la cadena, sin nada específico que buscar. ¿Qué señal se va a
          mover?
        visibilidad: publica
        permiteOmitir: false
        respuesta: El sesgo, y el MAPE casi nada
        minutos: 3
        opciones:
          - El MAPE, claramente
          - El sesgo, y el MAPE casi nada
          - Las dos por igual
          - Ninguna de las dos
        notas: |
          **Que comprometan una respuesta antes de mirar.** El valor de esta
          pregunta no es acertar: es que hayan apostado. Diez minutos después,
          cuando el groupby no encuentre nada, la sala tiene algo propio contra
          lo que contrastar.

          No revelar todavía. Guardar el revelado para después del ejercicio a
          mano — la tabla de las dos degradaciones es el momento.
        solucion:
          explicacion: |
            **El sesgo, y el MAPE casi nada.** Y ese "casi nada" es el taller
            entero.

            El MAPE mide *cuánto* te equivocas, sin signo. Si la demanda cae un
            poco en todas partes, el modelo se pasa un poco en todas partes: el
            error absoluto apenas cambia. El sesgo mide *hacia qué lado*, y ahí
            todos los errores empujan en la misma dirección y se suman.

            Medido acá: el MAPE de la flota pasa de 13.8% a 14.5% —menos de lo
            que se mueve entre dos semanas cualesquiera— y el sesgo de +0.7% a
            +4.7%. Son más de 36,000 unidades de más en almacén en catorce días.

            Un tablero con umbral sobre el MAPE no suena. Nunca.
          descartes:
            - opcion: El MAPE, claramente
              razon: >-
                Es la respuesta que más se elige y la que hace daño: es la
                señal que está en todos los tableros, y es exactamente la que
                no se entera.
            - opcion: Las dos por igual
              razon: >-
                Se moverían las dos si la caída fuera brusca o concentrada. Lo
                que hace silencioso a este escenario es que es lento y parejo.
            - opcion: Ninguna de las dos
              razon: >-
                Sería cierto si el mundo no hubiera cambiado. Cambió, y hay una
                señal que sí lo dice — el problema es que nadie la mira.

      - id: s1-r1-silencioso
        tipo: terminal
        titulo: Ahora el silencioso
        comando: make reparar && make romper ESCENARIO=sesgo_silencioso
        comandoWindows: .\taller.ps1 reparar; .\taller.ps1 romper sesgo_silencioso
        duracion: 40
        minutos: 2
        notas: |
          Acá sí conviene el atajo: son seis contenedores seguidos y teclearlos
          a mano no enseña nada nuevo.

          **`reparar` es `romper` con la primera línea cambiada.** Donde uno
          pone `escenario --nombre x`, el otro pone `datos`, que regenera el
          histórico limpio desde la semilla. Las otras dos líneas son idénticas:
          `pronosticar` y `metricas`. Por eso vuelve al mundo sano sin
          reentrenar nada — los 192 modelos no se han tocado en toda la tarde.

          Sin el `reparar` los dos escenarios se apilan y las lecturas dejan de
          significar nada.

          Este segundo escenario es una caída lenta y pareja de la demanda en
          TODA la cadena. Nada específico que buscar.

      - id: s1-r1-a-mano-2
        tipo: demo
        titulo: Búscalo otra vez
        entradilla: Las mismas tres preguntas. Diez minutos.
        minutos: 4
        pasos:
          - comando: "# el mismo groupby por categoría"
          - comando: "# y por región, y por tienda"
        observar: >-
          Nada se despega. Ninguna categoría destaca, ninguna región destaca,
          ninguna tienda destaca. El MAPE de la flota se movió menos de un
          punto. Si tu criterio es "buscar lo que sobresale", acá no hay nada
          que encontrar — y sin embargo el mundo cambió.
        respaldo: >-
          Dejar que se frustren un rato es parte del ejercicio. A los diez
          minutos, cortar y pasar a la tabla.
        notas: |
          NO dar la pista del sesgo todavía. La tabla siguiente es el momento
          del golpe, y si sale antes se desarma. Si alguien lo encuentra solo
          —pasa— pedirle que se lo guarde treinta segundos.

      - id: s1-r1-tabla
        tipo: tabla
        titulo: Las dos degradaciones
        entradilla: El mismo cambio en el mundo, visto por tres señales distintas
        minutos: 3
        columnas: [Señal, Antes, Después, Lectura]
        filas:
          - ["MAPE de la flota", "13.8%", "14.5%", "Se mueve menos que entre dos semanas cualesquiera"]
          - ["Modelos sobre el umbral", "7 / 192", "14 / 192", "Se duplican, y aun así nadie levanta el teléfono"]
          - ["Sesgo de la flota", "+0.7%", "+4.7%", "Seis veces. Y el signo dice hacia dónde"]
        resaltar: [2]
        notas: |
          Acá está el taller entero. Darle tiempo.

          Sobre las cifras: el MAPE y el sesgo están medidos y se sostienen
          entre corridas al primer decimal. El conteo de modelos sobre umbral
          depende del umbral que se elija y del día en que cada uno generó su
          mundo — lo que se sostiene es que se duplican. Si alguien ve otro par
          de números en su pantalla, esa es la razón, y vale la pena decirlo.

      - id: s1-r1-metrica
        tipo: metrica
        titulo: Lo que costó
        valor: "36,000"
        unidad: unidades de más en almacén
        contexto: En catorce días. Ninguna alarma sonó.
        tono: malo
        minutos: 2
        notas: |
          El número exacto varía por corrida: medido en dos mundos generados
          con cinco días de diferencia dio 36,338 y 36,981. Por eso está
          redondeado. Si alguien pregunta, la explicación es buena: el mundo se
          genera contra la fecha del día.

      - id: s1-r1-comparacion
        tipo: comparacion
        titulo: Qué vio cada señal
        entradilla: El mismo mundo, los mismos datos, los mismos catorce días
        minutos: 2
        izquierda:
          titulo: Lo que vio el MAPE
          contenido: >-
            "La flota está igual que siempre." Y tiene razón: el error se movió
            0.7 puntos, dentro de lo que se mueve solo. El MAPE mide distancia,
            y la distancia casi no cambió.
        derecha:
          titulo: Lo que vio el sesgo
          contenido: >-
            "La flota lleva dos semanas pronosticando de más, y cada vez más."
            El sesgo mide dirección, y la dirección se disparó. Es la única de
            las dos que estaba hablando de plata.
        notas: |
          Recordarles la definición de la unidad anterior: la misma resta, con
          y sin valor absoluto. Toda la diferencia está en un par de barras.

      - id: s1-r1-pregunta
        tipo: pregunta
        titulo: ¿Cuál alertarías?
        pregunta: >-
          Si tuvieras que poner UNA alarma sobre esta flota, y solo una, ¿sobre
          qué señal la pondrías?
        visibilidad: publica
        permiteOmitir: true
        minutos: 3
        opciones:
          - El MAPE
          - El sesgo
          - Los dos
          - Ninguno de los dos solo
        respuesta: Ninguno de los dos solo
        notas: |
          La respuesta que buscamos es la cuarta, y casi nadie la elige antes
          de la discusión. Un umbral sobre el sesgo tampoco alcanza: el
          escenario de la campaña movió el sesgo en la dirección contraria, y
          una tienda muda no mueve ninguna de las dos.

          No revelar hasta que hayan respondido todos. Después de revelar, la
          frase de cierre: no falta una métrica mejor, falta algo que mire
          varias a la vez y sepa cuál importa hoy.
        solucion:
          explicacion: |
            Ninguno de los dos solo.

            Acaban de ver que el MAPE no vio el sesgo silencioso. Pero el sesgo
            tampoco alcanza: en la campaña promocional se movió en la dirección
            CONTRARIA —el modelo pronosticó de menos, no de más— y una tienda
            que deja de reportar no mueve ninguna de las dos señales.

            No falta una métrica mejor. Falta algo que mire varias a la vez y
            sepa cuál importa hoy.
          descartes:
            - opcion: El MAPE
              razon: >-
                Se movió 0.7 puntos con 36 mil unidades de sobre-stock encima.
                Mide distancia, no dirección.
            - opcion: El sesgo
              razon: >-
                Habría cazado el silencioso, sí. Pero en la campaña el sesgo se
                fue a −32%, y un umbral por arriba no lo habría visto.
            - opcion: Los dos
              razon: >-
                Mejor, y todavía insuficiente: la tienda muda no mueve ninguna
                de las dos. Dos umbrales siguen siendo umbrales.

      - id: s1-r1-cuanto-tardas
        tipo: markdown
        titulo: La pregunta que te llevas
        minutos: 2
        contenido: |
          Hiciste esto para **dos escenarios y una categoría**, con la clase
          entera acompañándote y sabiendo de antemano que algo estaba roto.

          Ahora hazlo **cada mañana**, para 192 modelos, en ocho categorías,
          veinticuatro tiendas y cinco regiones. Sin saber si hoy hay algo.

          ¿Cuánto tardas? ¿Y cuántos lunes aguantas antes de mirar solo las
          cinco tiendas más grandes y dejar los otros 152 modelos sin mirar?
        notas: |
          Es el puente al reto 2. Terminar acá y no explicar la solución: la
          respuesta empieza después del receso.

