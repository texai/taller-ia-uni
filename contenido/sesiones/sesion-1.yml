  # ------------------------------------------------------------------ 16:55
  - id: s1-reto-2
    tipo: reto
    titulo: La herramienta de percepción
    objetivos:
      - Entender que la calidad de un agente se decide antes del LLM
      - Escribir una herramienta que agregue y no vuelque filas
      - Calibrar umbrales contra la flota sana, no contra la intuición
    requisitos:
      - Haber visto que el sesgo silencioso no se detecta a ojo
      - Entorno levantado, con el mundo sano
    items:
      - id: s1-r2-titulo
        tipo: titulo
        titulo: "Reto 2 · Escribe la herramienta"
        entradilla: "Criterio: en la flota sana, cero banderas"
        minutos: 2
        notas: |
          La frase de la entradilla es todo el reto. Si la herramienta alarma
          sobre lo normal, el agente que se construya encima no tiene
          salvación: va a creerle a las banderas, y con razón — el error no es
          suyo, es de quien puso el umbral.

      - id: s1-r2-mapa
        tipo: diagrama
        titulo: Los pasos de este reto
        entradilla: Una hora. Se escribe código, y hay tres formas de escribirlo mal.
        clase: flujo
        minutos: 2
        contenido: |
          flowchart TD
            A["1 · las tres reglas<br/>de una herramienta"] --> B["2 · escribir<br/>comparar_periodos"]
            B --> C["3 · esquivar tres trampas<br/>sesgo · ventana · umbral"]
            C --> D["4 · comprobarlo<br/>verificar --reto 2"]
            D --> E{{"criterio: en la flota sana,<br/>ninguna bandera"}}
        notas: |
          El paso 3 es el que ocupa media unidad, y no está en el enunciado del
          reto: son tres errores de estadística bien calculada y mal
          planteada. Los tres salieron construyendo este laboratorio.

          El hexágono del final es literalmente el criterio de aceptación del
          verificador. Anunciarlo acá y volver a él al comprobar.
      - id: s1-r2-por-que
        tipo: markdown
        titulo: Por qué agregar, y no volcar filas
        minutos: 2
        contenido: |
          La telemetría son **17,472 filas**. Un LLM no puede leerlas, y aunque
          pudiera, no debe: se las tragaría enteras para responder "¿cómo va la
          flota?".

          Una herramienta de percepción **agrega y devuelve una lectura**, no
          datos crudos. Decenas de números, no miles de filas.

          Y no es solo por el costo. Un modelo al que le entregas diecisiete
          mil filas no razona sobre ellas: elige unas cuantas al azar y
          construye una historia alrededor.
        notas: |
          Conectar con lo de ayer: ellos tampoco pudieron leer 192 modelos a
          mano. El agente tiene exactamente el mismo problema, y la solución
          también es la misma — agregar y comparar cortes.

      - id: s1-r2-tres-reglas
        tipo: criterios
        titulo: Las tres reglas de una herramienta de percepción
        minutos: 2
        criterios:
          - texto: Devuelve agregados, no filas.
            pista: Decenas de números, no miles.
          - texto: Es de solo lectura.
            pista: En producción nadie le da escritura a un agente sobre los modelos.
          - texto: La estadística la hace Python, no el LLM.
            pista: El modelo razona sobre los números; no los calcula.
        notas: |
          La tercera es la que más se discute. Pedirle a un LLM que compute un
          Kolmogorov-Smirnov es caro y poco confiable, y además irreproducible:
          la misma pregunta dos veces puede dar dos números.

      - id: s1-r2-firma
        tipo: codigo
        titulo: La herramienta
        entradilla: Lo que hay que escribir
        lenguaje: python
        ruta: agente/herramientas.py
        minutos: 3
        contenido: |
          @tool
          def comparar_periodos(
              dias_recientes: int = 14,
              dias_base: int = 45,
              dimension: str = "categoria",
          ) -> dict:
              """Compara una ventana reciente contra una linea base anterior
              y mide si la diferencia es real."""
        notas: |
          Señalar que la docstring NO es documentación: es lo que el LLM lee
          para decidir cuándo llamarla. Es prompt, y se escribe como prompt.

      - id: s1-r2-pregunta-sesgo
        tipo: pregunta
        titulo: Una cuenta rápida
        pregunta: >-
          Bebidas son 24 modelos, uno por tienda. Doce tienen un sesgo de +10%
          y doce de −10%. ¿Cuál es el sesgo de la categoría?
        visibilidad: publica
        permiteOmitir: true
        respuesta: Depende de cuánto vende cada tienda
        minutos: 3
        opciones:
          - "0%: se cancelan"
          - Depende de cuánto vende cada tienda
          - "+10% o −10%, según cuál pese más en número"
          - No se puede calcular sin los datos crudos
        notas: |
          Treinta segundos de cuenta mental y el resto de discusión. La
          respuesta intuitiva es la primera y es la que produce el error más
          caro del reto 2.

          Si alguien contesta la segunda de entrada, pedirle que lo explique en
          voz alta: acaba de dar la clase.
        solucion:
          explicacion: |
            **Depende de cuánto vende cada tienda.** El sesgo de un grupo no es
            el promedio de los sesgos de sus partes: es la diferencia de sus
            totales.

            Si las doce tiendas con +10% son las grandes, la categoría está
            claramente sobre-pronosticada aunque el promedio de los porcentajes
            dé cero. Un porcentaje ya es un cociente, y promediar cocientes le
            da el mismo peso a una tienda de Lima que a una de provincia con la
            décima parte del volumen.

            La fórmula correcta es una sola línea, y es la del ítem siguiente:

                sesgo = (suma de predicho − suma de real) / suma de real

            Este es uno de los cuatro errores de estadística que salieron
            construyendo el laboratorio, y el más fácil de cometer sin notarlo.
          descartes:
            - opcion: "0%: se cancelan"
              razon: >-
                Solo si las 24 tiendas vendieran exactamente lo mismo. Con
                datos reales nunca pasa, y con promoción menos.
            - opcion: "+10% o −10%, según cuál pese más en número"
              razon: >-
                Está a mitad de camino: entiende que hay un peso, pero el peso
                no es cuántas tiendas hay de cada lado, es cuánto vende cada una.
            - opcion: No se puede calcular sin los datos crudos
              razon: >-
                Se calcula perfectamente con los totales, que es lo que la
                telemetría ya trae. No hace falta bajar a las filas.

      - id: s1-r2-sesgo-codigo
        tipo: codigo
        titulo: "Trampa 1 · Cómo se calcula el sesgo de un grupo"
        lenguaje: python
        ruta: agente/herramientas.py
        minutos: 4
        resaltar: ["6-8"]
        contenido: |
          def _sesgo(filas) -> float:
              reales = pronosticadas = 0.0
              for f in filas:
                  reales += float(f.get("unidades_reales") or 0.0)
                  pronosticadas += float(f.get("unidades_pronosticadas") or 0.0)
              if reales <= 0:
                  return 0.0
              return round((pronosticadas - reales) / reales * 100, 3)
        notas: |
          Lo que NO está acá es lo importante: no hay ningún `mean` sobre la
          columna `sesgo_pct`. Se suman unidades y se dividen totales.

      - id: s1-r2-sesgo
        tipo: comparacion
        titulo: El sesgo no se promedia
        entradilla: Dos cuentas sobre los mismos datos, y una está sesgada
        minutos: 2
        izquierda:
          titulo: Promedio de porcentajes
          contenido: >-
            Se toma el sesgo de cada día y se promedia. Suena razonable y está
            mal: un día de venta baja infla su propio porcentaje sin mover casi
            nada el total. El error va SIEMPRE hacia arriba.

        derecha:
          titulo: Cociente de totales
          contenido: >-
            Cuántas unidades de más se pronosticó sobre cuántas se vendieron.
            Además de ser correcto, el número significa algo en el mundo: +12%
            son 12% de unidades de más en almacén.
        notas: |
          El "siempre hacia arriba" no es retórico y la tabla siguiente lo
          muestra: las ocho categorías inflan, ninguna desinfla.

      - id: s1-r2-sesgo-tabla
        tipo: tabla
        titulo: Lo que infla, medido
        entradilla: Flota sana, últimos 14 días. Las ocho categorías, las dos cuentas.
        minutos: 2
        columnas: [Categoría, Promedio de %, Cociente de totales, Infla]
        filas:
          - ["panadería", "+9.4%", "+6.7%", "+2.8 pp"]
          - ["lácteos", "+5.8%", "+2.4%", "+3.4 pp"]
          - ["cuidado-personal", "+4.2%", "+1.2%", "+2.9 pp"]
          - ["carnes", "+3.6%", "+2.5%", "+1.1 pp"]
          - ["abarrotes", "+3.5%", "+1.2%", "+2.3 pp"]
          - ["congelados", "+1.3%", "−0.7%", "+2.0 pp"]
          - ["bebidas", "−1.8%", "−3.0%", "+1.2 pp"]
          - ["limpieza", "−2.6%", "−4.9%", "+2.3 pp"]
        resaltar: [0]
        notas: |
          Ninguna infla hacia abajo. Ese es el punto: no es ruido, es un sesgo
          sistemático de la cuenta.

          Panadería es el caso extremo. Con el umbral de 3 pp de la dimensión
          `categoria`, promediar porcentajes la pone al borde de encender una
          bandera en un mundo donde no pasa nada.

          Las cifras están medidas sobre un mundo generado el 7 de agosto. Se
          mueven un poco según el día; lo que no se mueve es el signo.

      - id: s1-r2-ventana
        tipo: error-comun
        titulo: "Trampa 2 · Medir lo normal con la ventana que auditas"
        minutos: 3
        sintoma: >-
          Los umbrales parecen razonables en el escritorio y encienden banderas
          por todos lados en cuanto corren contra datos reales.
        causa: >-
          Se calibraron mirando la ventana degradada, o peor, a ojo. "Un 20% de
          aumento de MAPE suena a mucho" no es una medición: es una intuición
          sobre una escala que nadie miró.
        arreglo: >-
          Calibrar contra la flota SANA. Correr la comparación sobre un mundo
          intacto, ver cuánto se mueve solo, y poner el umbral por encima de
          eso. Es el único número que dice qué es normal acá.
        notas: |
          Es la trampa que más silenciosamente arruina un agente, porque el
          resultado no es un error: es un agente que alarma todos los días y al
          que se deja de hacer caso.

      - id: s1-r2-significancia
        tipo: error-comun
        titulo: "Trampa 3 · Significativo no es relevante"
        minutos: 3
        sintoma: >-
          El test estadístico marca deriva en casi todos los grupos, todo el
          tiempo, incluso con el mundo sano.
        causa: >-
          Con miles de días-modelo, un Kolmogorov-Smirnov da significativo por
          diferencias que a nadie le importan. La significancia mide si la
          diferencia es real, no si vale la pena mirarla.
        arreglo: >-
          Pedir las dos cosas a la vez: `p < 0.01` **y** que el cambio supere
          un umbral apreciable. Una sola de las dos no alcanza.
        notas: |
          El p-valor responde "¿pasó algo?". El umbral responde "¿me importa?".
          Un agente que solo pregunta lo primero es un agente que grita.

      - id: s1-r2-envejecimiento
        tipo: metrica
        titulo: Lo que se mueve solo
