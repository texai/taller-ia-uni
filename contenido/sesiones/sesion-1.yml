      - id: s1-r1-comparacion
        tipo: comparacion
        titulo: Qué vio cada señal
        entradilla: El mismo mundo, los mismos datos, los mismos catorce días
        minutos: 3
        izquierda:
          titulo: Lo que vio el MAPE
          contenido: >-
            "La flota está igual que siempre." Y tiene razón: el error se movió
            0.7 puntos, dentro de lo que se mueve solo. El MAPE mide distancia,
            y la distancia casi no cambió.
        derecha:
          titulo: Lo que vio el sesgo
          contenido: >-
            "La flota lleva dos semanas pronosticando de más, y cada vez más."
            El sesgo mide dirección, y la dirección se disparó. Es la única de
            las dos que estaba hablando de plata.
        notas: |
          Recordarles la definición de la unidad anterior: la misma resta, con
          y sin valor absoluto. Toda la diferencia está en un par de barras.

      - id: s1-r1-pregunta
        tipo: pregunta
        titulo: ¿Cuál alertarías?
        pregunta: >-
          Si tuvieras que poner UNA alarma sobre esta flota, y solo una, ¿sobre
          qué señal la pondrías?
        visibilidad: publica
        permiteOmitir: true
        minutos: 3
        opciones:
          - El MAPE
          - El sesgo
          - Los dos
          - Ninguno de los dos solo
        respuesta: Ninguno de los dos solo
        notas: |
          La respuesta que buscamos es la cuarta, y casi nadie la elige antes
          de la discusión. Un umbral sobre el sesgo tampoco alcanza: el
          escenario de la campaña movió el sesgo en la dirección contraria, y
          una tienda muda no mueve ninguna de las dos.

          No revelar hasta que hayan respondido todos. Después de revelar, la
          frase de cierre: no falta una métrica mejor, falta algo que mire
          varias a la vez y sepa cuál importa hoy.
        solucion:
          explicacion: |
            Ninguno de los dos solo.

            Acaban de ver que el MAPE no vio el sesgo silencioso. Pero el sesgo
            tampoco alcanza: en la campaña promocional se movió en la dirección
            CONTRARIA —el modelo pronosticó de menos, no de más— y una tienda
            que deja de reportar no mueve ninguna de las dos señales.

            No falta una métrica mejor. Falta algo que mire varias a la vez y
            sepa cuál importa hoy.
          descartes:
            - opcion: El MAPE
              razon: >-
                Se movió 0.7 puntos con 36 mil unidades de sobre-stock encima.
                Mide distancia, no dirección.
            - opcion: El sesgo
              razon: >-
                Habría cazado el silencioso, sí. Pero en la campaña el sesgo se
                fue a −32%, y un umbral por arriba no lo habría visto.
            - opcion: Los dos
              razon: >-
                Mejor, y todavía insuficiente: la tienda muda no mueve ninguna
                de las dos. Dos umbrales siguen siendo umbrales.

      - id: s1-r1-cuanto-tardas
        tipo: markdown
        titulo: La pregunta que te llevas
        minutos: 2
        contenido: |
          Hiciste esto para **dos escenarios y una categoría**, con la clase
          entera acompañándote y sabiendo de antemano que algo estaba roto.

          Ahora hazlo **cada mañana**, para 192 modelos, en ocho categorías,
          veinticuatro tiendas y cinco regiones. Sin saber si hoy hay algo.

          ¿Cuánto tardas? ¿Y cuántos lunes aguantas antes de mirar solo las
          cinco tiendas más grandes y dejar los otros 152 modelos sin mirar?
        notas: |
          Es el puente al reto 2. Terminar acá y no explicar la solución: la
          respuesta empieza después del receso.

      - id: s1-receso
        tipo: receso
        titulo: Receso
        minutos: 15

  # ------------------------------------------------------------------ 16:55
  - id: s1-reto-2
    tipo: reto
    titulo: La herramienta de percepción
    objetivos:
      - Entender que la calidad de un agente se decide antes del LLM
      - Escribir una herramienta que agregue y no vuelque filas
      - Calibrar umbrales contra la flota sana, no contra la intuición
    requisitos:
      - Haber visto que el sesgo silencioso no se detecta a ojo
      - Entorno levantado, con el mundo sano
    items:
      - id: s1-r2-titulo
        tipo: titulo
        titulo: "Reto 2 · Escribe la herramienta"
        entradilla: "Criterio: en la flota sana, cero banderas"
        minutos: 2
        notas: |
          La frase de la entradilla es todo el reto. Si la herramienta alarma
          sobre lo normal, el agente que se construya encima no tiene
          salvación: va a creerle a las banderas, y con razón — el error no es
          suyo, es de quien puso el umbral.

      - id: s1-r2-por-que
        tipo: markdown
        titulo: Por qué agregar, y no volcar filas
        minutos: 3
        contenido: |
          La telemetría son **17,472 filas**. Un LLM no puede leerlas, y aunque
          pudiera, no debe: se las tragaría enteras para responder "¿cómo va la
          flota?".

          Una herramienta de percepción **agrega y devuelve una lectura**, no
          datos crudos. Decenas de números, no miles de filas.

          Y no es solo por el costo. Un modelo al que le entregas diecisiete
          mil filas no razona sobre ellas: elige unas cuantas al azar y
          construye una historia alrededor.
        notas: |
          Conectar con lo de ayer: ellos tampoco pudieron leer 192 modelos a
          mano. El agente tiene exactamente el mismo problema, y la solución
          también es la misma — agregar y comparar cortes.

      - id: s1-r2-tres-reglas
        tipo: criterios
        titulo: Las tres reglas de una herramienta de percepción
        minutos: 3
        criterios:
          - texto: Devuelve agregados, no filas.
            pista: Decenas de números, no miles.
          - texto: Es de solo lectura.
            pista: En producción nadie le da escritura a un agente sobre los modelos.
          - texto: La estadística la hace Python, no el LLM.
            pista: El modelo razona sobre los números; no los calcula.
        notas: |
          La tercera es la que más se discute. Pedirle a un LLM que compute un
          Kolmogorov-Smirnov es caro y poco confiable, y además irreproducible:
          la misma pregunta dos veces puede dar dos números.

      - id: s1-r2-firma
        tipo: codigo
        titulo: La herramienta
        entradilla: Lo que hay que escribir
        lenguaje: python
        ruta: agente/herramientas.py
        minutos: 3
        contenido: |
          @tool
          def comparar_periodos(
              dias_recientes: int = 14,
              dias_base: int = 45,
              dimension: str = "categoria",
          ) -> dict:
              """Compara una ventana reciente contra una linea base anterior
              y mide si la diferencia es real."""
        notas: |
          Señalar que la docstring NO es documentación: es lo que el LLM lee
          para decidir cuándo llamarla. Es prompt, y se escribe como prompt.

      - id: s1-r2-sesgo-codigo
        tipo: codigo
        titulo: "Trampa 1 · Cómo se calcula el sesgo de un grupo"
        lenguaje: python
        ruta: agente/herramientas.py
        minutos: 4
        resaltar: ["6-8"]
        contenido: |
          def _sesgo(filas) -> float:
              reales = pronosticadas = 0.0
              for f in filas:
                  reales += float(f.get("unidades_reales") or 0.0)
                  pronosticadas += float(f.get("unidades_pronosticadas") or 0.0)
              if reales <= 0:
                  return 0.0
              return round((pronosticadas - reales) / reales * 100, 3)
        notas: |
          Lo que NO está acá es lo importante: no hay ningún `mean` sobre la
          columna `sesgo_pct`. Se suman unidades y se dividen totales.

      - id: s1-r2-sesgo
        tipo: comparacion
        titulo: El sesgo no se promedia
        entradilla: Dos cuentas sobre los mismos datos, y una está sesgada
        minutos: 4
        izquierda:
          titulo: Promedio de porcentajes
          contenido: >-
            Se toma el sesgo de cada día y se promedia. Suena razonable y está
            mal: un día de venta baja infla su propio porcentaje sin mover casi
            nada el total. El error va SIEMPRE hacia arriba.

        derecha:
          titulo: Cociente de totales
          contenido: >-
            Cuántas unidades de más se pronosticó sobre cuántas se vendieron.
            Además de ser correcto, el número significa algo en el mundo: +12%
            son 12% de unidades de más en almacén.
        notas: |
          El "siempre hacia arriba" no es retórico y la tabla siguiente lo
          muestra: las ocho categorías inflan, ninguna desinfla.

      - id: s1-r2-sesgo-tabla
        tipo: tabla
        titulo: Lo que infla, medido
        entradilla: Flota sana, últimos 14 días. Las ocho categorías, las dos cuentas.
        minutos: 3
        columnas: [Categoría, Promedio de %, Cociente de totales, Infla]
        filas:
          - ["panadería", "+9.4%", "+6.7%", "+2.8 pp"]
          - ["lácteos", "+5.8%", "+2.4%", "+3.4 pp"]
          - ["cuidado-personal", "+4.2%", "+1.2%", "+2.9 pp"]
          - ["carnes", "+3.6%", "+2.5%", "+1.1 pp"]
          - ["abarrotes", "+3.5%", "+1.2%", "+2.3 pp"]
          - ["congelados", "+1.3%", "−0.7%", "+2.0 pp"]
          - ["bebidas", "−1.8%", "−3.0%", "+1.2 pp"]
          - ["limpieza", "−2.6%", "−4.9%", "+2.3 pp"]
        resaltar: [0]
        notas: |
          Ninguna infla hacia abajo. Ese es el punto: no es ruido, es un sesgo
          sistemático de la cuenta.

          Panadería es el caso extremo. Con el umbral de 3 pp de la dimensión
          `categoria`, promediar porcentajes la pone al borde de encender una
          bandera en un mundo donde no pasa nada.

          Las cifras están medidas sobre un mundo generado el 7 de agosto. Se
          mueven un poco según el día; lo que no se mueve es el signo.

      - id: s1-r2-ventana
        tipo: error-comun
        titulo: "Trampa 2 · Medir lo normal con la ventana que auditas"
        minutos: 4
        sintoma: >-
          Los umbrales parecen razonables en el escritorio y encienden banderas
          por todos lados en cuanto corren contra datos reales.
        causa: >-
          Se calibraron mirando la ventana degradada, o peor, a ojo. "Un 20% de
          aumento de MAPE suena a mucho" no es una medición: es una intuición
          sobre una escala que nadie miró.
        arreglo: >-
          Calibrar contra la flota SANA. Correr la comparación sobre un mundo
          intacto, ver cuánto se mueve solo, y poner el umbral por encima de
          eso. Es el único número que dice qué es normal acá.
        notas: |
          Es la trampa que más silenciosamente arruina un agente, porque el
          resultado no es un error: es un agente que alarma todos los días y al
          que se deja de hacer caso.

      - id: s1-r2-significancia
        tipo: error-comun
        titulo: "Trampa 3 · Significativo no es relevante"
        minutos: 4
        sintoma: >-
          El test estadístico marca deriva en casi todos los grupos, todo el
          tiempo, incluso con el mundo sano.
        causa: >-
          Con miles de días-modelo, un Kolmogorov-Smirnov da significativo por
          diferencias que a nadie le importan. La significancia mide si la
          diferencia es real, no si vale la pena mirarla.
        arreglo: >-
          Pedir las dos cosas a la vez: `p < 0.01` **y** que el cambio supere
          un umbral apreciable. Una sola de las dos no alcanza.
        notas: |
          El p-valor responde "¿pasó algo?". El umbral responde "¿me importa?".
          Un agente que solo pregunta lo primero es un agente que grita.

      - id: s1-r2-envejecimiento
        tipo: metrica
        titulo: Lo que se mueve solo
        valor: "+20%"
        unidad: de MAPE, en un mundo intacto
        contexto: >-
          Es la peor categoría de la flota sana comparando 14 días contra 45.
          Nada está roto. Es envejecimiento: toda la flota pierde precisión al
          alejarse de su fecha de entrenamiento.
        tono: neutro
        minutos: 2
        notas: |
          Medido: +20.8% en el mundo del 7 de agosto, +19.6% en la medición
          original. Es la cifra que justifica el umbral de 25% para categoría.

      - id: s1-r2-umbrales
        tipo: tabla
        titulo: El umbral depende de por dónde cortes
        entradilla: Lo peor que se mueve solo en la flota sana, por dimensión
        minutos: 4
        columnas: [Dimensión, Modelos por grupo, Máx Δ MAPE, Máx Δ sesgo]
        filas:
          - ["categoría", 24, "+20.8%", "1.06 pp"]
          - ["región", "8 a 112", "+15.0%", "2.41 pp"]
          - ["tienda", 8, "+51.3%", "3.21 pp"]
        resaltar: [2]
        notas: |
          La fila de tienda es la que sorprende: se mueve dos veces y media más
          que la de categoría sin que nada esté roto.

          Región es heterogénea a propósito y vale la pena decirlo — LIMA tiene
          14 tiendas y 112 modelos; ORIENTE tiene una y ocho. Por eso su
          columna no es un número solo.

      - id: s1-r2-por-que-tienda
        tipo: markdown
        titulo: Por qué el umbral de tienda es más alto
        minutos: 2
        contenido: |
          Una **categoría** agrupa 24 modelos, uno por tienda. Una **tienda**
          agrupa 8, uno por categoría.

          Promediar 8 números es mucho más ruidoso que promediar 24. La media
          de la tienda salta más por puro azar, y salta más **todos los días**,
          esté rota o no.

          No es una decisión de gusto: es que el mismo umbral significa cosas
          distintas según cuántas cosas estés promediando.
        notas: |
          Si alguien conoce la raíz de n, es el momento. Si no, basta con la
          intuición: menos cosas, más ruido.

      - id: s1-r2-umbrales-elegidos
        tipo: codigo
        titulo: Los umbrales, entonces
        entradilla: Cada uno por encima de lo que su dimensión se mueve sola
        lenguaje: python
        ruta: agente/herramientas.py
        minutos: 2
        contenido: |
          UMBRALES = {
              #              MAPE %   sesgo pp
              "categoria": (   25.0,      3.0),
              "region":    (   25.0,      4.0),
              "tienda":    (   60.0,      5.0),
          }
        notas: |
          Comparar contra la tabla anterior fila por fila. Cada umbral está
          justo por encima del máximo medido de su dimensión, con holgura pero
          sin exagerar. Un umbral único calibrado con categorías marca tres
          tiendas sanas como derivadas y cuatro como sesgadas.

      - id: s1-r2-banderas
        tipo: markdown
        titulo: Dos banderas, y no significan lo mismo
        minutos: 2
        contenido: |
          **`deriva_de_error`** — el MAPE empeoró de forma significativa *y*
          apreciable. Pide las dos cosas por la trampa 3.

          **`deriva_de_sesgo`** — el modelo empezó a errar hacia un lado. Es la
          señal cara y la más silenciosa: no hace ruido en el MAPE, y su línea
          base en una flota sana es prácticamente cero. Cuando se mueve, se
          movió de verdad.
        notas: |
          De ahí que el umbral de sesgo sea de un dígito y el de MAPE de dos.
          No están en la misma escala porque no parten del mismo sitio.

      - id: s1-r2-criterios
        tipo: criterios
        titulo: Cuándo terminaste
        minutos: 3
        criterios:
          - texto: Con la flota sana, cero banderas en las tres dimensiones
