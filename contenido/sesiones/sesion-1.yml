          - texto: La campaña promocional se ve, y solo en bebidas
          - texto: El sesgo silencioso aparece en las 8 categorías
            pista: Si aparece en una sola, el problema es de la agregación
          - texto: La tienda muda se detecta como anomalía, no como deriva
        notas: |
          El primero se comprueba solo: `make reparar` y correr. No hace falta
          preguntar si está bien.

      - id: s1-r2-taller
        tipo: demo
        titulo: Escribirla
