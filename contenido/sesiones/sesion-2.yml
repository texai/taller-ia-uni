# Sesión 2 · La arquitectura cognitiva
#
# Estructura, no contenido definitivo. El contenido de cada ítem lo escriben
# los batches 19 a 22, uno por unidad.
#
# Los minutos van SOLO en cada ítem: la unidad suma los suyos y la sesión suma
# las unidades, de abajo hacia arriba, para que ningún total pueda contradecir
# a sus partes (CONVENTIONS.md §15). La suma da 240.

id: sesion-2
numero: 2
titulo: La arquitectura cognitiva
subtitulo: Sesión 2
fecha: 2026-08-09
horaInicio: "09:00"
horaFin: "13:00"

unidades:
  # ------------------------------------------------------------------ 09:00
  - id: s2-repaso
    tipo: repaso
    titulo: Qué le faltaba al bucle de ayer
    objetivos:
      - Recuperar el hilo tras una noche
      - Emparejar cada patología de ayer con la capa que la resuelve
      - Ver el grafo completo una vez, antes de construirlo
    requisitos:
      - Nada. Se puede seguir sin haber estado el sábado.
    items:
      - id: s2-asistencia
        tipo: asistencia
        titulo: Tomar asistencia
        nota: Segunda sesión. Anotar también a quien no vino ayer.

      - id: s2-portada
        tipo: titulo
        titulo: La arquitectura cognitiva
        entradilla: Hoy construimos lo que le faltaba al bucle
        minutos: 2
        notas: |
          Antes de empezar: `make arriba`. Nadie necesita haber dejado nada
          levantado de ayer, y quien viene por primera vez arranca igual.

      - id: s2-para-quien-no-vino
        tipo: markdown
        titulo: El caso, en un minuto
        entradilla: Para quien no estuvo ayer — y de repaso para quien sí
        minutos: 3
        contenido: |
          Una cadena de retail con 24 tiendas y 8 categorías pronostica su
          demanda cada noche: **192 modelos en producción**. Un job de
          madrugada los carga y proyecta 14 días.

          Cuando el mundo cambia, los modelos siguen igual. Y hay una forma de
          fallar que no dispara ninguna alarma: la demanda cae despacio en toda
          la cadena, el error medio casi no se mueve, pero el modelo empieza a
          pronosticar **de más** — y eso son decenas de miles de unidades en
          almacén que nadie compró para tener paradas.

          Ayer construimos las herramientas que sí lo detectan, y encima un
          agente que las usa bien. **Funciona.** Llama las herramientas
          correctas, encuentra cosas, y suena convincente.

          El problema es que dos corridas del mismo mundo dan dos diagnósticos
          distintos.
        notas: |
          Tres minutos, cronometrados. La tentación es recontar el sábado
          entero; quien no vino no necesita la historia, necesita el caso y el
          problema. Todo lo demás lo va a recuperar sobre la marcha.

      - id: s2-donde-quedamos
        tipo: transicion
        titulo: Dónde quedamos
        vimos: >-
          Un agente que funciona, llama herramientas y aun así divaga: cuatro
          patologías, ninguna del modelo
        viene: >-
          Las capas que lo arreglan, que no son un prompt más largo sino
          sitios donde algo pueda pasar
        minutos: 3

      - id: s2-patologias
        tipo: tabla
        titulo: Las cuatro patologías, y qué las resuelve
        entradilla: Cada una tiene un sitio donde arreglarse
        minutos: 5
        columnas: [Patología, Capa que la resuelve, Cómo]
        filas:
          - ["Concluye con lo primero que encuentra", "Reflexión", "Intenta refutar la hipótesis; si le falta evidencia, devuelve el control a percepción"]
          - ["Ordena por la señal más ruidosa", "Percepción", "La herramienta entrega ordenado por la señal cara y pone el recuento primero"]
          - ["Dramatiza el impacto", "Reflexión + revisión", "Cuestionarse no basta: hace falta poder reescribir el diagnóstico"]
          - ["Mañana redescubre lo mismo", "Memoria", "Consulta el historial antes de diagnosticar y lo escribe después"]
        resaltar: [2]
        notas: |
          La fila resaltada es la que explica por qué hay dos capas y no una.
          **Cuestionarse sin poder corregirse no sirve de nada**: el
          diagnóstico saldría contradiciendo a sus propias objeciones. Esa
          frase es la tesis de la unidad siguiente.

          Falta una capa en esta tabla y vale la pena decirlo: la **acción**.
          No arregla ninguna patología — es capacidad nueva, y trae sus propios
          problemas. Es el reto 5.

      - id: s2-el-grafo
        tipo: diagrama
        titulo: El grafo completo
        entradilla: Sin explicar todavía. Solo para que lo vean entero una vez.
        clase: flujo
        minutos: 6
        contenido: |
          flowchart LR
            P["percepcion"] --> D["diagnostico"]
            D --> R["reflexion"]
            R -->|falta evidencia| P
            R -->|la critica quedo en pie| V["revision"]
            R -->|confirmado| C["recomendacion"]
            V --> C
            C --> A["accion"]
            D <-.->|lee antes, escribe despues| M[("memoria")]
        notas: |
          NO explicarlo acá. Se presenta y se pasa: la explicación es la unidad
          siguiente, y adelantarla le quita el efecto.

          Lo único que vale señalar con el dedo son las dos flechas que vuelven
          hacia atrás. Todo lo demás de este dibujo es una tubería; esas dos
          son lo que lo convierte en algo que se puede creer.

      - id: s2-que-no-es
        tipo: markdown
        titulo: Qué es realmente una "capa"
        minutos: 3
        contenido: |
          No es un prompt más largo ni una instrucción mejor. Es **un nodo con
          un solo trabajo**, que corre o no corre y deja rastro.

          La diferencia práctica: a un prompt que dice *"no dramatices"* no se
          le puede preguntar si lo cumplió. A un nodo de reflexión sí — o
          produjo objeciones o no las produjo, y están escritas.

          El mismo modelo, con las mismas herramientas, pero obligado a pasar
          por sitios donde solo puede hacer una cosa.
        notas: |
          Si alguien pregunta por qué no un solo prompt gigante: porque un
          prompt con quince reglas cumple unas y olvida otras, y cuáles olvida
          cambia en cada corrida. Un grafo no olvida un nodo.

      - id: s2-pregunta-agregar
        tipo: pregunta
        titulo: ¿Qué le agregarías?
        pregunta: >-
          Mirando el grafo: ¿cuál de estas capas creen que arregla MÁS de las
          cuatro patologías de ayer?
        visibilidad: publica
        permiteOmitir: true
        minutos: 3
        opciones:
          - Percepción
          - Reflexión
          - Revisión
          - Memoria
        respuesta: Reflexión
        notas: |
          Reflexión aparece en dos de las cuatro filas de la tabla, así que es
          la correcta — pero lo interesante es la discusión, no el acierto.

          Si gana memoria: buena señal, es la que más gente reconoce de su
          propio trabajo. Si gana revisión, es que leyeron bien la fila
          resaltada. Cualquiera de las dos abre la unidad siguiente.

  # ------------------------------------------------------------------ 09:25
  - id: s2-reto-4
    tipo: reto
    titulo: La arquitectura cognitiva
    objetivos:
      - Construir un grafo donde cada nodo hace un trabajo y solo uno
      - Entender por qué una reflexión que no puede corregir es decorativa
      - Darle memoria, para que no repita la alerta de ayer
    requisitos:
      - Herramientas de percepción funcionando
      - Haber visto divagar al ReAct pelado
    items:
      - id: s2-r4-titulo
        tipo: titulo
        titulo: "Reto 4 · La arquitectura cognitiva"
        entradilla: El corazón del taller
        minutos: 3
        notas: |
          Noventa minutos. Avisar que el receso va a mitad y que la parte
          difícil —por qué existe `revision`— viene después.

      - id: s2-r4-un-nodo
        tipo: markdown
        titulo: Un nodo, un trabajo
        minutos: 3
        contenido: |
          La diferencia entre el bucle de ayer y esto no es que haya más
          instrucciones. Es que hay **sitios**.

          Cada nodo hace una cosa y solo una, y el que percibe no concluye. Eso
          suena a purismo hasta que se ve la consecuencia: un nodo que solo
          puede hacer una cosa **o la hizo o no la hizo**, y queda escrito en
          el estado. Un prompt con quince reglas no deja ese rastro.
        notas: |
          "El que percibe no concluye" es la frase corta. Si alguien objeta que
          es el mismo modelo con otro prompt: sí, es el mismo modelo. Lo que
          cambia es que ahora hay un sitio donde comprobar qué pasó.

      - id: s2-r4-los-seis
        tipo: tabla
        titulo: Los seis nodos
        entradilla: Y lo único que hace cada uno
        minutos: 3
        columnas: [Nodo, Su único trabajo]
        filas:
          - ["percepción", "Decide qué mirar y llama herramientas. No concluye nada."]
          - ["diagnóstico", "Convierte la evidencia en una hipótesis, con alcance y severidad."]
          - ["reflexión", "Intenta refutarse. Si le falta evidencia, devuelve el control a percepción."]
          - ["revisión", "Si la crítica sigue en pie y se acabaron las vueltas, reescribe el diagnóstico."]
          - ["recomendación", "Emite acciones concretas."]
          - ["acción", "Ejecuta lo que una política de código deja pasar. Sin LLM."]
        resaltar: [5]
        notas: |
          La última fila está resaltada porque es la única sin LLM: la política
          es código Python. Es el reto 5 y conviene sembrarlo ya.

      - id: s2-r4-secuencia
        tipo: diagrama-secuencia
        titulo: Una corrida, mensaje a mensaje
        archivo: puml/grafo-agente.puml
        minutos: 12
        notas: |
          Recorrerlo de a un mensaje. Proyectarlo entero de una vez es
          exactamente lo que este tipo de ítem existe para evitar.

          Los dos que hay que dejar respirar son el 7 —la reflexión mandando de
          vuelta a percepción— y el 10, la crítica que queda en pie. Todo lo
          demás es tubería.
        mensajes:
          - texto: "comparar_periodos(14, 45, categoria)"
            explicacion: >-
              Percepción empieza por el panorama, no por un modelo suelto.
              Compara los últimos 14 días contra una base de 45: un número solo
              no dice nada sin su historia.
          - texto: "banderas por categoria"
            explicacion: >-
              La herramienta no devuelve filas: devuelve el recuento primero y
              las banderas ya evaluadas. El ruido lo descartó ella, con los
              umbrales del reto 2.
          - texto: "detectar_anomalias(21)"
            explicacion: >-
              Antes de concluir que un modelo se degradó, hay que descartar que
              el problema sea de datos. Deriva y anomalía se arreglan de formas
              opuestas.
          - texto: "sin anomalias"
            explicacion: >-
              Nada roto. Ahora sí, lo que se vea es del modelo y no del feed —
              y esa frase es la que permite recomendar reentrenar sin miedo.
          - texto: "evidencia reunida"
            explicacion: >-
              Percepción deja de llamar herramientas y resume en texto plano.
              No dice qué pasa; dice qué vio. Esa separación es todo el nodo.
          - texto: "hipotesis con alcance y severidad"
            explicacion: >-
              Diagnóstico convierte la evidencia en una hipótesis. El alcance
              —un modelo, una categoría, una tienda, la flota— importa más que
              la severidad: dice de quién es la causa.
          - texto: "falta evidencia, vuelve a mirar"
            explicacion: >-
              Acá está la primera flecha hacia atrás. La reflexión no objetó
              por objetar: dijo qué herramienta falta llamar y por qué. El
              control vuelve a percepción, con el encargo concreto.
          - texto: "evidencia ampliada"
            explicacion: >-
              La segunda pasada mira lo que la crítica pidió. Es la diferencia
              entre un agente que se corrige y uno que solo se disculpa.
          - texto: "hipotesis revisada"
            explicacion: >-
              Diagnóstico vuelve a formular, ahora con más evidencia. Puede
              cambiar el alcance, el tipo o la severidad — o sostener lo mismo
              con mejor respaldo.
          - texto: "la critica quedo en pie"
            explicacion: >-
              Segunda vuelta y la objeción sigue viva. Se acabaron las vueltas.
              Acá es donde un agente sin `revision` emitiría igual el
              diagnóstico que su propia crítica acaba de demoler.
          - texto: "diagnostico reescrito"
            explicacion: >-
              Revisión reescribe haciéndose cargo de las objeciones, sin mirar
              evidencia nueva: con la que hay alcanza, y es la misma que
              sostiene la crítica.
          - texto: "recomendaciones"
            explicacion: >-
              Recién ahora se emiten acciones. Sobre un diagnóstico que
              sobrevivió a su propia crítica, no sobre el primero que salió.
          - texto: "la politica decide que se ejecuta"
            explicacion: >-
              Y el último paso no tiene LLM. Una política de código decide qué
              se ejecuta de verdad. Es el reto 5, y es la parte que más se
              parece a producción.

      - id: s2-r4-estado
        tipo: codigo
        titulo: El estado
        entradilla: Lo que viaja de nodo a nodo
        lenguaje: python
        ruta: agente/grafo.py
        minutos: 4
        contenido: |
          class Estado(TypedDict):
              fecha: str
              mensajes: Annotated[list[AnyMessage], add_messages]
              evidencia: list[str]
              hipotesis: dict[str, Any]
              critica: dict[str, Any]
              recomendaciones: list[dict[str, Any]]
              acciones: list[dict[str, Any]]
              vueltas: int
        notas: |
          Cada campo es la salida de un nodo. Leer el estado es leer el
          expediente de la corrida: qué vio, qué concluyó, qué se objetó, qué
          recomendó y qué ejecutó.

      - id: s2-r4-estado-por-que
        tipo: markdown
        titulo: Por qué `add_messages` y no una lista
        minutos: 3
        contenido: |
          Todos los campos del estado se **reemplazan** cuando un nodo los
          devuelve. `mensajes` no: `add_messages` hace que se **acumulen**.

          Sin eso, cada nodo pisaría la conversación entera y el siguiente
          razonaría sobre un solo mensaje suelto. Con eso, la conversación
          crece y todos los nodos ven lo que pasó antes.

          Es una anotación de tres palabras y es la diferencia entre un grafo y
          seis llamadas independientes.
        notas: |
          `vueltas` es el otro campo que merece un segundo: es un entero que
          cuenta cuántas veces pasó por reflexión, y es lo que evita el bucle
          infinito.

      - id: s2-r4-percepcion
        tipo: codigo
        titulo: El nodo de percepción
        lenguaje: python
        ruta: agente/grafo.py
        minutos: 3
        contenido: |
          def percepcion(estado: Estado) -> dict:
              """Decide que mirar y llama herramientas. No concluye."""
              llm = obtener_llm().bind_tools(HERRAMIENTAS)

              if not estado["mensajes"]:
                  apertura = [SystemMessage(CONTEXTO), HumanMessage(encargo)]
              else:
                  apertura = []

              respuesta = llm.invoke(estado["mensajes"] + apertura)
              return {"mensajes": apertura + [respuesta]}
        notas: |
          Dos cosas para señalar. El `if`: la apertura se arma una sola vez, en
          la primera pasada. Y el `return`: la apertura viaja de vuelta al
          estado — eso es el arreglo de la trampa que viene en dos ítems.

      - id: s2-r4-apertura
        tipo: error-comun
        titulo: "Trampa · El estado que no se propaga"
        minutos: 4
        sintoma: >-
          El agente llama una herramienta, recibe el resultado, y a partir de
          ahí razona como si no supiera qué le pidieron. Concluye sobre una
          lista de números sueltos.
        causa: >-
          La apertura —el `SystemMessage` con quién es y el `HumanMessage` con
          el encargo— se pasaba a `invoke` pero no se devolvía en el estado. Al
          volver de la herramienta, la conversación ya no la tenía.
        arreglo: >-
          Devolver `apertura + [respuesta]`, no solo `[respuesta]`. Lo que no
          vuelve al estado, no existió.
        notas: |
          Es muda: el agente responde, suena razonable, y perdió el encargo.
          Solo se nota comparando dos corridas con atención.

      - id: s2-r4-messages-key
        tipo: error-comun
        titulo: "Trampa · ToolNode lee otra clave"
        minutos: 4
        sintoma: >-
          El agente responde perfectamente y **nunca ejecutó una herramienta**.
          Ni una. El diagnóstico está escrito sobre la nada.
        causa: >-
          `ToolNode` busca en el estado una clave llamada `messages`. Nuestro
          estado la llama `mensajes`. No encuentra nada que ejecutar y pasa de
          largo sin quejarse.
        arreglo: "`ToolNode(HERRAMIENTAS, messages_key=\"mensajes\")`."
        notas: |
          Esta es la que cuesta una hora, y las dos son mudas. Anticiparlas es
          la mitad del valor de esta unidad: quien las conoce las reconoce en
          treinta segundos.

          Si alguien escribe el estado en inglés no le pasa ninguna de las dos
          — y vale la pena decirlo, porque la conclusión no es "escriban en
          inglés" sino que un nombre distinto al que espera una librería es una
          trampa que no avisa.

      - id: s2-r4-aristas
        tipo: codigo
        titulo: El cableado
        entradilla: Dos aristas condicionales, y todas las demás fijas
        lenguaje: python
        ruta: agente/grafo.py
        minutos: 4
        contenido: |
          g.add_node("percepcion", percepcion)
          g.add_node("herramientas", ToolNode(HERRAMIENTAS, messages_key="mensajes"))
          g.add_node("diagnostico", diagnostico)
          g.add_node("reflexion", reflexion)
          g.add_node("revision", revision)
          g.add_node("recomendacion", recomendacion)
          g.add_node("accion", accion)

          g.add_edge(START, "percepcion")
          g.add_conditional_edges("percepcion", _hay_herramientas)
          g.add_edge("herramientas", "percepcion")
          g.add_edge("diagnostico", "reflexion")
          g.add_conditional_edges("reflexion", _tras_reflexion)
          g.add_edge("revision", "recomendacion")
          g.add_edge("recomendacion", "accion")
          g.add_edge("accion", END)
        notas: |
          Todo el grafo cabe en quince líneas. Señalar que `herramientas`
          siempre vuelve a `percepcion`: ese es el mini-bucle ReAct de ayer,
          ahora encerrado dentro de un solo nodo del grafo grande.

      - id: s2-r4-tras-reflexion
        tipo: codigo
        titulo: Las tres salidas de la reflexión
        entradilla: Toda la arquitectura está en esta función
        lenguaje: python
        ruta: agente/grafo.py
        minutos: 3
        contenido: |
          def _tras_reflexion(estado) -> Literal["percepcion", "revision", "recomendacion"]:
              if estado["critica"].get("veredicto") != "insuficiente":
                  return "recomendacion"
              if estado.get("vueltas", 0) < MAX_VUELTAS:
                  return "percepcion"
              return "revision"
        notas: |
          Tres ramas, y cada una es una decisión de diseño:

          El diagnóstico se sostuvo → se recomienda. La crítica pide más
          evidencia y quedan vueltas → se vuelve a mirar. Y la tercera es la
          interesante: la crítica sigue en pie y ya no quedan vueltas.

      - id: s2-r4-max-vueltas
        tipo: markdown
        titulo: Por qué hay un tope
        minutos: 2
        contenido: |
          `MAX_VUELTAS = 2`.

          Un agente que puede pedir más evidencia indefinidamente **no
          termina**: siempre hay una herramienta más que llamar y siempre se
          puede objetar algo. El tope no es una limitación técnica, es la
          decisión de que en algún momento hay que emitir.

          Y cuando el tope se agota con la crítica todavía viva, hace falta
          alguien que se haga cargo. De ahí sale el nodo siguiente.
        notas: |
          Buen momento para preguntar cuántas vueltas pondrían ellos. La
          respuesta honesta es que dos alcanzan porque la reflexión ya vio la
          evidencia; más vueltas suelen ser el agente buscando permiso.

      - id: s2-receso
        tipo: receso
        titulo: Receso
        minutos: 15
        notas: |
          A mitad de la unidad a propósito: la segunda parte es la difícil, y
          noventa minutos seguidos de grafo no los aguanta nadie.

      - id: s2-r4-diagnostico
        tipo: codigo
        titulo: Lo que el diagnóstico tiene que producir
        lenguaje: python
        ruta: agente/grafo.py
        minutos: 3
        contenido: |
          {
            "titulo": "...",
            "tipo": "deriva | anomalia | sin_hallazgos",
            "alcance": "flota | categoria:bebidas | tienda:arequipa | dem-...",
            "severidad": "alta | media | baja",
            "explicacion": "...",
            "evidencia": ["..."],
            "impacto_negocio": "..."
          }
        notas: |
          Pedir JSON y no prosa es lo que permite que los nodos siguientes
          trabajen sobre campos y no sobre párrafos. `tipo` y `alcance` son los
          dos que después deciden si se reentrena y a quién.

      - id: s2-r4-alcance
        tipo: markdown
        titulo: La forma importa más que el tamaño
        minutos: 3
        contenido: |
          La regla que el agente lleva en su contexto, y que decide el
          `alcance`:

          - Si la degradación aparece en **una categoría a lo largo de todas
            las tiendas**, la causa es del producto.
          - Si aparece en **una tienda a lo largo de todas las categorías**, la
            causa es de esa tienda.
          - Y si aparece en **todas**, la causa no es de ninguna: es de la
            cadena, y el alcance correcto es la flota entera.

          El tercer caso es el que un humano cansado lee mal. Ocho categorías
          con bandera no son ocho problemas: son uno.
        notas: |
          Esto es exactamente lo que separa el escenario de la campaña del
          sesgo silencioso, y es lo que hace que el criterio de aceptación pida
          "las 8 categorías" y no "bebidas".

      - id: s2-r4-reflexion-que-es
        tipo: markdown
        titulo: Qué le pregunta la reflexión a su propio diagnóstico
        minutos: 3
        contenido: |
          No es "revisa esto". Son cuatro preguntas concretas:

          - La evidencia que citas, ¿sostiene de verdad esta conclusión, o la
            estás forzando?
          - ¿Confundiste una anomalía de datos con una deriva del modelo?
          - El alcance que declaraste, ¿es el correcto? ¿Miraste si el patrón
            aparece también en otras categorías, tiendas o regiones?
          - ¿Hay alguna herramienta que no llamaste y que cambiaría la
            conclusión?

          Y responde con un veredicto —`confirmado` o `insuficiente`—, una
          lista de objeciones, y qué falta mirar.
        notas: |
          La instrucción termina con "usa insuficiente solo si falta evidencia
          que cambiaría la conclusión, no por prurito". Sin eso, la reflexión
          objeta siempre y el agente no termina nunca.

      - id: s2-r4-dramatizando
        tipo: cita-agente
        titulo: El agente se acusa a sí mismo
        cita: >-
          Inventé impacto de negocio. Dije "9,436 unidades de sobre-stock" pero
          eso es el error acumulado del pronóstico, no sobre-stock. Estoy
          dramatizando.
        procedencia: Reflexión, sobre su propio diagnóstico
        comentario: >-
          Ayer esta patología se veía desde afuera. Hoy la ve él. Esa es toda la
          diferencia que hace un nodo cuyo único trabajo es refutarse.
        minutos: 4
        notas: |
          Si la vieron ayer, decirlo: es la misma cita. Ayer era el síntoma;
          hoy es la prueba de que el nodo funciona.

      - id: s2-r4-por-que-revision
        tipo: markdown
        titulo: Por qué existe `revision`
        entradilla: La pregunta más importante de la unidad
        minutos: 4
        contenido: |
          Una reflexión que solo puede **objetar** es decorativa.

          Piensa qué pasa sin ese nodo. La crítica demuele el diagnóstico, se
          acaban las vueltas, y el agente emite igual la hipótesis demolida.
          El titular sale diciendo una cosa y las objeciones —escritas por él
          mismo, tres párrafos más abajo— dicen la contraria.

          Peor todavía: las recomendaciones se calculan sobre el titular. O
          sea, sobre lo que su propia crítica ya declaró insostenible.

          **Cuestionarse sin poder corregirse no sirve de nada.** Por eso hay
          dos nodos y no uno.
        notas: |
          Esto pasó de verdad construyendo el taller, y es la razón de que el
          nodo esté ahí. La cita siguiente es ese momento exacto.

      - id: s2-r4-si-hay-deriva
        tipo: cita-agente
        titulo: Sabía la respuesta, y el grafo no lo dejaba decirla
        cita: >-
          Tengo banderas de sesgo encendidas en 8/8 categorías y 4/5 regiones.
          Eso NO es ruido normal: es un patrón sistemático. SÍ hay hallazgo:
          hay DERIVA.
        procedencia: Reflexión, en el mundo del sesgo silencioso, con el titular en `sin_hallazgos`
        comentario: >-
          El diagnóstico decía "sin hallazgos". La crítica, del mismo modelo y
          con la misma evidencia, decía que sí los había y explicaba por qué.
          Sin `revision`, esa corrida se emitía con el titular equivocado y la
          respuesta correcta enterrada en las objeciones.
        minutos: 4
        notas: |
          Dejarla en pantalla. Es la mejor justificación de arquitectura del
          taller entero, y la escribió el agente.

      - id: s2-r4-revision
        tipo: comparacion
        titulo: Antes y después de la revisión
        entradilla: Misma corrida, misma evidencia, sin llamar una herramienta más
        minutos: 4
        izquierda:
          titulo: El diagnóstico que salía
          contenido: >-
            `sin_hallazgos`, severidad baja. Con ocho de ocho categorías
            marcadas por deriva de sesgo, y todo eso citado en la evidencia.
        derecha:
          titulo: El diagnóstico reescrito
          contenido: >-
            `deriva`, alcance `flota`. Se hace cargo de la objeción: el patrón
            aparece en todas las categorías, así que la causa no es de ninguna
            — es de la cadena.
        notas: |
          Insistir en la entradilla: no miró nada nuevo. La instrucción de
          `revision` dice explícitamente "ya no vas a mirar más evidencia: con
          la que tienes alcanza, y es la misma que sostiene tus objeciones".

      - id: s2-r4-memoria
        tipo: markdown
        titulo: Memoria
        minutos: 3
        contenido: |
          Un JSON en disco. Deliberadamente simple: lo que importa no es el
          motor de persistencia, sino **cuándo** se usa — el agente consulta su
          historial ANTES de diagnosticar y lo escribe DESPUÉS.

          Sin eso redescubre el mismo problema cada mañana y emite la misma
          alerta, hasta que alguien deja de leerlas.
        notas: |
          Si alguien pregunta por qué no una base de datos: porque el archivo
          no cambia ni una línea de la lección, y sí agregaría un contenedor
          más a un laboratorio que ya construye tres imágenes.

      - id: s2-r4-memoria-tres
        tipo: criterios
        titulo: Las tres frases que un tablero nunca dice
        minutos: 3
        criterios:
          - texto: "«Esto ya lo reporté»"
            pista: Y por eso no vuelve a alertar
          - texto: "«Esto empeoró desde ayer»"
            pista: Que es distinto de "esto está mal"
          - texto: "«Esto es nuevo»"
            pista: La única de las tres que un umbral podría dar
        notas: |
          Es el argumento más fácil de vender a alguien que ya tiene un
          dashboard: las dos primeras son imposibles sin historial, y son las
          dos que hacen que una alerta se lea.

      - id: s2-r4-feed-caido
        tipo: error-comun
        titulo: "La trampa · una tienda que dejó de reportar"
        minutos: 4
        sintoma: >-
          Las métricas de la flota se ven impecables. Mejor que ayer, incluso.
        causa: >-
          Una tienda dejó de reportar. Sus filas no llegan en cero: **no
          llegan**. Lo que desapareció del promedio fue justamente lo que
          estaba mal, y el resto se ve mejor por contraste.
        arreglo: >-
          Es `anomalia`, no `deriva`. Y sobre todo: **no reentrenar**. Un
          reentrenamiento sobre datos fantasma empeora un modelo que estaba
          sano.
        notas: |
          "Vendimos cero" y "no sabemos cuánto vendimos" son cosas distintas, y
          el agente tiene que notarlo. Es el cuarto mundo del criterio de
          aceptación y el que más gente falla.

      - id: s2-r4-criterios
        tipo: criterios
        titulo: Cuatro mundos, cuatro lecturas
        minutos: 3
        criterios:
          - texto: "Mundo sano → sin_hallazgos, severidad baja"
            pista: Una guardia tranquila es un resultado, no un fracaso
          - texto: "campana_promocional → deriva, categoria:bebidas"
          - texto: "sesgo_silencioso → deriva, flota, las 8 categorías"
            pista: Si dice "bebidas" leyó mal la forma del problema
          - texto: "feed_caido → anomalia, tienda:arequipa, y NO reentrenar"
            pista: Esta es la trampa. La flota se ve impecable.

      - id: s2-r4-correr
        tipo: demo
        titulo: Correrlo contra los cuatro mundos
        minutos: 4
        pasos:
          - comando: make romper ESCENARIO=feed_caido
          - comando: make agente ARGS="--verboso"
            esperado: "anomalia, tienda:arequipa, sin reentrenar"
          - comando: make reparar
        observar: >-
          Mirar el veredicto de la reflexión en cada corrida. Cuando dice
          `insuficiente`, seguir la vuelta: qué pidió mirar y si al volver
          cambió algo. Es la parte del grafo que no se ve en el diagrama.
        respaldo: >-
          La implementación de referencia está en la rama `reto-4-solucion`.
          Con `PROVEEDOR_LLM=mock` el grafo se recorre entero sin llave, lo que
          sirve para comprobar el cableado aunque no razone.
        notas: |
          Cuatro minutos alcanzan para uno o dos mundos, no para los cuatro.
          Correr `feed_caido` en clase —que es el que enseña— y dejar los otros
          tres para que los prueben ellos.

  # ------------------------------------------------------------------ 11:10
  - id: s2-reto-5
    tipo: reto
    titulo: De la recomendación a la acción
    objetivos:
      - Ver qué cambia cuando equivocarse deja de costar una alerta
      - Escribir un freno en código, y entender por qué no va en el prompt
      - Distinguir una acción reversible de una que no lo es
    requisitos:
      - Un grafo que diagnostique y recomiende
      - Haber visto la trampa del feed caído
    items:
      - id: s2-r5-titulo
        tipo: titulo
        titulo: "Reto 5 · De la recomendación a la acción"
        entradilla: Lo que separa a un agente de un informe
        minutos: 2
        notas: |
          Y lo que lo convierte en algo que da miedo, que es el punto de la
          unidad. Hasta ahora todo lo que hicimos era de solo lectura.

      - id: s2-r5-riesgo
        tipo: markdown
        titulo: Equivocarse deja de costar una alerta
        minutos: 3
        contenido: |
          Mientras el agente solo miraba, equivocarse costaba **una alerta de
          más**. Alguien la leía, se encogía de hombros, seguía.

          Ahora equivocarse cuesta **24 modelos reentrenados con datos malos**.
          Y un modelo contaminado no se nota hasta la semana siguiente, cuando
          ya nadie relaciona una cosa con la otra.

          El cambio no es de grado. Es de naturaleza.
        notas: |
          Dejar caer que en producción esto es la conversación completa: casi
          nadie discute si un agente puede leer telemetría. Todo el mundo
          discute si puede tocar algo.

      - id: s2-r5-apagado
        tipo: markdown
        titulo: Viene apagado
        minutos: 3
        contenido: |
          ```
          EJECUTAR_ACCIONES=1
          ```

          Sin esa variable, el agente evalúa qué haría y **no hace nada**. Deja
          escrito el veredicto de la política —qué ejecutaría, qué no, y por
          qué— y termina.

          Un agente que reentrena solo la primera vez que alguien lo corre es
          una sorpresa desagradable. Que haya que encenderlo a mano no es
          fricción de más: es parte de la lección.
        notas: |
          Este es el primer freno y el más barato. Preguntar quién dejaría esto
          encendido por omisión en su empresa — nadie levanta la mano.

      - id: s2-r5-quien-decide
        tipo: markdown
        titulo: El permiso no se le pregunta al modelo
        minutos: 3
        contenido: |
          La política de acción es **código Python**. No es una instrucción en
          el prompt, no es una herramienta que el agente pueda llamar, y no hay
          forma de convencerla.

          Se cumple aunque el LLM esté convencidísimo de lo contrario.

          **El agente propone; estas reglas disponen.**

          Es la misma idea que un ingeniero de guardia con acceso restringido:
          puede diagnosticar lo que sea, pero hay palancas que no están a su
          alcance a las tres de la mañana.
        notas: |
          Si alguien propone poner las reglas en el prompt, la respuesta es la
          del sábado: no hay forma de comprobar que las cumplió. Acá el freno o
          se aplicó o no se aplicó, y queda en el veredicto.

      - id: s2-r5-politica
        tipo: codigo
        titulo: Las dos reglas que hacen el trabajo pesado
        lenguaje: python
        ruta: agente/accion.py
        minutos: 5
        contenido: |
          es_anomalia = hipotesis.get("tipo") == "anomalia"

          for rec in recomendaciones:
              if rec["accion"] not in ACCIONES_AUTOMATIZABLES:
                  continue                      # investigar y revisar_datos van a un humano
              if es_anomalia:
                  continue                      # regla 1: naturaleza del problema
              if rec.get("urgencia") == "monitorear":
                  continue                      # el propio agente dijo que no toquemos
              objetivo = _filtro_de(rec)
              if not objetivo:
                  continue                      # regla 2: radio de daño — la flota entera
              ejecutables.append(...)
        notas: |
          Señalar que `evaluar` está separada de `ejecutar` a propósito: la
          política se puede leer, probar y discutir sin tocar la plataforma.
          Es justo lo que uno quiere de las reglas que le dan la mano a un
          agente.

      - id: s2-r5-anomalia-regla
        tipo: markdown
        titulo: "Regla 1 · La naturaleza del problema"
        minutos: 3
        contenido: |
          Si el diagnóstico es una **anomalía**, el problema está en los datos,
          no en el modelo.

          Reentrenar ahí no arregla nada: enseña ruido. El modelo estaba sano y
          sale peor.

          Es exactamente el error que el escenario `feed_caido` existe para
          provocar, y la razón de que sea una regla de código y no un consejo.
        notas: |
          Enlazar con ayer: deriva se corrige reentrenando, anomalía no. La
          distinción que parecía académica en la unidad anterior acá tiene
          consecuencias sobre 24 artefactos.

      - id: s2-r5-radio
        tipo: markdown
        titulo: "Regla 2 · El radio de daño"
        minutos: 3
        contenido: |
          Reentrenar una **categoría** toca 24 modelos, uno por tienda. Se
          revierte: se entrena de nuevo.

          Reentrenar **la flota** toca los 192 a la vez. Y si el diagnóstico
          estaba mal, no queda **ningún modelo sano contra el cual comparar**.
          Eso no tiene marcha atrás útil.

          Una acción sin vuelta atrás la firma una persona.
        notas: |
          El criterio no es "cuántos" sino "queda algo con qué comparar". Es
          la pregunta que sirve para cualquier acción automatizada, no solo
          para reentrenar.

      - id: s2-r5-urgencia
        tipo: error-comun
        titulo: "El error propio · frenar por urgencia"
        minutos: 5
        sintoma: >-
          La acción no se disparaba nunca. El agente recomendaba reentrenar, la
          política lo dejaba pasar en el papel, y no pasaba nada.
        causa: >-
          La primera versión frenaba por la **urgencia** que declaraba el
          agente. Pero la urgencia es una opinión editorial suya, no una
          propiedad de seguridad: reentrenar "esta semana" no es más peligroso
          que reentrenar "ahora".
        arreglo: >-
          Frenar por **radio de daño**. Lo peligroso no es cuándo, es
          reentrenar lo que no se debe, o demasiado de una vez.
        notas: |
          Esto pasó de verdad construyendo el taller y es de lo mejor que hay
          para enseñar. La lección general: **no des permisos contra un campo
          que el propio agente redacta.** Si el freno depende de algo que el
          modelo escribe, el modelo puede aflojarlo sin querer — o queriendo.

      - id: s2-r5-monitorear
        tipo: markdown
        titulo: La única opinión suya que sí se respeta
        minutos: 2
        contenido: |
          Hay una excepción a lo anterior, y merece explicarse: si el agente
          dice `urgencia: monitorear`, no se ejecuta.

          Porque ahí el campo no está aflojando el freno: lo está apretando.
          Es el agente diciendo *"todavía no hay que tocar nada"*, y hacerle
          caso solo puede llevar a hacer de menos.
        notas: |
          La asimetría es el punto: se acepta lo que el agente diga para
          FRENAR, nunca para avanzar. Vale para cualquier permiso.

      - id: s2-r5-objetivo
        tipo: codigo
        titulo: A qué modelos, exactamente
        entradilla: El objetivo se declara en campos, no en prosa
        lenguaje: python
        ruta: agente/accion.py
        minutos: 3
        contenido: |
          def _filtro_de(rec: dict) -> dict | None:
              tipo = (rec.get("objetivo_tipo") or "").strip()
              valor = (rec.get("objetivo_valor") or "").strip()
              if tipo == "flota":
                  return {}
              if tipo in ("categoria", "tienda", "modelo_id") and valor:
                  return {tipo: valor}
              return None
        notas: |
          Se exige `objetivo_tipo` y `objetivo_valor` como campos separados.
          Adivinar el destino parseando "los 24 modelos de panadería" sería
          pedirle a una expresión regular que decida a qué artefacto se le pasa
          por encima.

          Y fíjense en el `return None`: si el objetivo no identifica modelos
          concretos, no se ejecuta. En caso de duda, no.

      - id: s2-r5-comando
        tipo: comando-anotado
        titulo: Correrlo con permiso para actuar
        comando: docker compose run --rm -e EJECUTAR_ACCIONES=1 agente python -m agente run --verboso
        minutos: 4
        segmentos:
          - texto: "--rm"
            explicacion: >-
              Borra el contenedor al terminar. Sin esto queda uno parado por
              cada corrida, y en una clase de veinte personas eso se nota.
          - texto: "-e EJECUTAR_ACCIONES=1"
            explicacion: >-
              El interruptor. Sin él la política evalúa y no ejecuta. Está en la
              línea de comandos y no en `.env` a propósito: encenderlo es una
              decisión de esta corrida, no del entorno.
          - texto: "--verboso"
            explicacion: >-
              Imprime cada llamada a herramienta y el veredicto de la política
              recomendación por recomendación. Es la única forma de ver por qué
              NO se ejecutó algo.
        notas: |
          `make actuar` hace lo mismo. Se muestra el comando entero porque es
          el momento del taller en que conviene saber exactamente qué se está
          ejecutando.

      - id: s2-r5-deriva
        tipo: demo
        titulo: Sobre deriva, reentrena
        minutos: 6
        pasos:
          - comando: make reparar && make romper ESCENARIO=sesgo_silencioso
          - comando: make actuar ARGS="--verboso"
        observar: >-
          El diagnóstico dice `deriva`. La política deja pasar el
          reentrenamiento de una categoría: **24 modelos**, uno por tienda, en
          un par de segundos. Y queda registrado con su motivo, su duración y
          qué modelos tocó.
        respaldo: >-
          Si no hay llave, `PROVEEDOR_LLM=mock` recorre el grafo pero no
          produce una recomendación real. Para ver la política en acción sin
          LLM, `evaluar()` se puede llamar a mano con una hipótesis inventada —
          está separada de `ejecutar` justamente para eso.
        notas: |
          El número que importa es 24, y es estructural: una categoría son 24
          tiendas. Los segundos dependen de la máquina — medido en dos
          categorías dio 2.4s y 0.6s, así que no citar un cronómetro.

      - id: s2-r5-anomalia
        tipo: demo
        titulo: Sobre anomalía, se frena
        minutos: 6
        pasos:
          - comando: make reparar && make romper ESCENARIO=feed_caido
          - comando: make actuar ARGS="--verboso"
        observar: >-
          El diagnóstico dice `anomalia`. La política **no ejecuta nada**, y
          dice por qué: reentrenar acá contaminaría modelos sanos. Ese texto no
          lo escribió el LLM — es la regla explicándose.
        respaldo: >-
          Si el agente diagnostica `deriva` en vez de `anomalia`, esa es la
          conversación: significa que su percepción no distinguió una tienda
          muda de una degradación. Sirve igual, y sirve más.
        notas: |
          Demostrarlo, no describirlo. Es el criterio de aceptación de este
          batch y el momento en que la unidad entera se justifica.

          Si sale bien, la frase es: el agente quería actuar y algo se lo
          impidió. Ese algo son doce líneas de Python.

      - id: s2-r5-comparacion
        tipo: comparacion
        titulo: Los dos resultados, lado a lado
        entradilla: El mismo agente, el mismo permiso, dos mundos
        minutos: 3
        izquierda:
          titulo: sesgo_silencioso → ejecuta
          contenido: >-
            `deriva`, alcance de categoría. Reentrena 24 modelos y lo anota en
            la bitácora. Reversible: si estuvo mal, se entrena de nuevo.
        derecha:
          titulo: feed_caido → frena
          contenido: >-
            `anomalia`, una tienda muda. No ejecuta nada y deja escrito el
            motivo. El modelo sano sigue sano.
        notas: |
          La diferencia entera está en un campo del diagnóstico —`tipo`— y en
          una línea de código. Toda la unidad cabe en esa frase.

      - id: s2-r5-api-escribe
        tipo: markdown
        titulo: La única ruta que escribe
        minutos: 2
        contenido: |
          De toda la API de la plataforma, `POST /v1/reentrenar` es la única
          que **escribe**. Todo lo demás es telemetría de lectura.

          Un agente que solo observa no puede romper nada. En el momento en que
          puede actuar, el riesgo cambia de naturaleza — y por eso esa
          superficie se mantiene lo más pequeña posible.
        notas: |
          Buen principio general para llevarse: contar cuántas rutas de tu API
          escriben. Casi siempre son menos de las que uno cree, y esa lista es
          exactamente la superficie que hay que proteger.

      - id: s2-r5-bitacora
        tipo: markdown
        titulo: Y queda registrado
        minutos: 2
        contenido: |
          Cada reentrenamiento deja una entrada: cuándo, cuánto tardó, **con
          qué motivo**, y qué modelos tocó.

          El motivo lo escribe el agente. Es lo único suyo que va a la
          bitácora, y es lo que permite reconstruir después por qué existe un
          artefacto de las 3:40 de la mañana.
        notas: |
          `make reentrenamientos` lo muestra. Sin bitácora, la primera pregunta
          del lunes —"¿quién reentrenó esto?"— no tiene respuesta.

      - id: s2-r5-panel
        tipo: demo
        titulo: La interfaz, de punta a punta
        minutos: 2
        pasos:
          - comando: make ui
            esperado: "http://localhost:8501"
        observar: >-
          La corrida completa: qué herramientas llamó, el diagnóstico, la
          crítica, la corrección si la hubo, las recomendaciones y el veredicto
          de la política. Todo el razonamiento, abierto.
        notas: |
          Es la respuesta a "¿cómo sé que no divaga?": se lee. Un agente cuya
          ejecución no se puede inspeccionar es un agente en el que hay que
          creer, y creer no escala.

      - id: s2-r5-preguntas
        tipo: pausa-preguntas
        titulo: Pausa para preguntas
        minutos: 3
        disparadores:
          - ¿Qué acción de su trabajo dejarían automatizar, y cuál nunca?
          - ¿Cómo sabrían que una acción es reversible antes de ejecutarla?
          - ¿Qué campo de los que escribe su agente usarían como freno? ¿Y por qué no?

  # ------------------------------------------------------------------ 12:10
  - id: s2-cierre
    tipo: cierre
    titulo: Los errores, y dónde estaban de verdad
    objetivos:
      - Llevarse la tesis del taller
      - Saber qué hacer con esto en el trabajo del lunes
    items:
      - id: s2-c-titulo
        tipo: titulo
        titulo: Nueve errores construyendo esto
        destacado: Ninguno estaba en el modelo
        minutos: 3

      - id: s2-c-errores
        tipo: tabla
        titulo: Dónde estaban de verdad
        minutos: 10
        columnas: [Error, Dónde vivía el arreglo]
        filas:
          - ["El contexto no llegaba a la API", "Pendiente — batch 22"]
          - ["El estado no se propagaba", "Pendiente — batch 22"]
          - ["ToolNode leía otra clave", "Pendiente — batch 22"]
          - ["Un simulador que no podía fallar", "Pendiente — batch 22"]
          - ["Promediar porcentajes", "Pendiente — batch 22"]
          - ["Medir lo normal con la ventana auditada", "Pendiente — batch 22"]
          - ["Significancia confundida con relevancia", "Pendiente — batch 22"]
          - ["Ordenar por la métrica ruidosa", "Pendiente — batch 22"]
          - ["Un campo sin definir", "Pendiente — batch 22"]

      - id: s2-c-cita-1
        tipo: cita-agente
        titulo: El agente criticando un umbral mal calibrado
        cita: Pendiente — batch 22
        procedencia: Pendiente — batch 22
        minutos: 5

      - id: s2-c-cita-2
        tipo: cita-agente
        titulo: Y confundiendo significancia con causa
        cita: Pendiente — batch 22
        procedencia: Pendiente — batch 22
        minutos: 5

      - id: s2-c-incidencias
        tipo: markdown
        titulo: Y trece del entorno
        contenido: |
          Pendiente — batch 22.
        minutos: 6

      - id: s2-c-tesis
        tipo: titulo
        titulo: Cuando un agente se equivoca, la primera sospecha no debería ser el modelo
        destacado: Casi siempre es lo que le diste de comer
        minutos: 4

      - id: s2-c-mapa
