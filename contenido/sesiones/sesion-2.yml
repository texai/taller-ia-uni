# Sesión 2 · La arquitectura cognitiva
#
# Estructura, no contenido definitivo. El contenido de cada ítem lo escriben
# los batches 19 a 22, uno por unidad.
#
# Los minutos van SOLO en cada ítem: la unidad suma los suyos y la sesión suma
# las unidades, de abajo hacia arriba, para que ningún total pueda contradecir
# a sus partes (CONVENTIONS.md §15). La suma da 240.

id: sesion-2
