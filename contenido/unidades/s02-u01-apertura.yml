id: s2-apertura
tipo: repaso
titulo: Segunda sesión
objetivos:
  - Recuperar el hilo tras una noche
requisitos:
  - Nada. Se puede seguir sin haber estado el sábado.
items:
  - id: s2-caratula
    tipo: caratula
    qr: /contenido/img/qr.svg
    minutos: 1
    notas: |
      **Se abre con esto mientras entra la gente**, igual que ayer.
      - **El QR otra vez**: hoy hay gente que no vino el sábado.
      - Decir que es la sesión 2 de 2 y que se cierra a la hora.

  - id: s2-portada
    tipo: titulo
    titulo: El agente, de cero a que se pueda creer
    entradilla: Hoy se construye el bucle, y después lo que le falta
    minutos: 2
    notas: |
      Antes de empezar: `make arriba`. Nadie necesita haber dejado nada
      levantado de ayer, y quien viene por primera vez arranca igual.
      - **Decir el plan del día en una frase**: primero los ojos del agente,
        después el agente más simple que existe, y **cuando lo veamos divagar**,
        las capas que lo arreglan.

  # El sábado se llegó hasta el final del reto 1. Este dibujo decía «lo que
  # construimos ayer: 3 herramientas + un LLM + 20 líneas de ReAct», y nada de
  # eso ocurrió: se construye hoy, en las dos primeras horas. Proyectarlo tal
  # cual habría abierto el domingo con una lámina que la sala sabe falsa.
  - id: s2-recap
    tipo: diagrama
    titulo: Dónde nos quedamos ayer
    entradilla: Cuatro horas, y una pregunta que quedó sin responder
    clase: componentes
    minutos: 4
    contenido: |
      flowchart LR
        M["192 modelos<br/>en produccion"] --> T
        D["4 escenarios que<br/>degradan el mundo"] --> T
        T[("la telemetria:<br/>17,472 filas que<br/>nadie mira")] --> Q{"y quien<br/>los mira?"}
        Q --> AYER["ayer: a mano, con pandas.<br/>funciona una vez"]
        Q -.->|las proximas 4 horas| HOY["hoy: herramientas, un agente,<br/>y las capas que lo hacen creible"]
    notas: |
      **Es el dibujo del sábado con una caja más: la respuesta a mano.**
      - **Señalar el rombo**: la pregunta sigue siendo *quién los mira*. Ayer
        la contestamos con las manos y **costó lo que costó**; hoy se contesta
        con un agente.
      - **Recordar el 13.8 / +0.8**, que es contra lo que se compara todo.
      - Para quien no vino: no hace falta haber estado. Se arranca con
        `make arriba && make seed` y el reto 2 no supone nada del reto 1.

  # El reto 1 se dictó ayer entero; esto no lo repite. Son solo los dos
  # bloques de pandas que se pegaron a mano, para quien quiera reproducirlos
  # y para quien no vino. Con botón de copiar, que es lo que faltó el sábado.
  - id: s2-repaso-pandas
    tipo: demo
    titulo: Cómo lo buscamos a mano, ayer
    entradilla: Los dos bloques del reto 1, sin volver a contarlo. Para reproducirlo hoy en dos minutos.
    minutos: 4
    pasos:
      - comando: make romper ESCENARIO=campana_promocional
        esperado: "el mundo de ayer, otra vez · ⏱ ~40 s"
      - comando: make consola
        esperado: Python con pandas y /datos montado
      - comando: "# 1 · dónde está el problema: por categoría"
      - comando: |
          import pandas as pd
          m = pd.read_csv("/datos/metricas.csv", parse_dates=["fecha"])
          u = m[m["fecha"] >= m["fecha"].max() - pd.Timedelta(days=13)]
          por = u.groupby("categoria").agg(
              mape=("mape", "mean"),
              pronosticado=("unidades_pronosticadas", "sum"),
              real=("unidades_reales", "sum"),
          )
          por["sesgo_pct"] = (por.pronosticado - por.real) / por.real * 100
          por[["mape", "sesgo_pct"]].round(1).sort_values("mape", ascending=False)
        esperado: |
          bebidas   31.6  -33.7   ← se despega sola
          panaderia 15.4   +6.7
          lacteos   15.0   +2.5   … y las otras cinco, entre 11.9 y 14.8
      - comando: "# 2 · ¿es una tienda, o es la categoría entera?"
      - comando: |
          b = u[u.categoria == "bebidas"]
          b.groupby("tienda")["mape"].mean().round(1).sort_values().tail()
        esperado: |
          cusco 44.0 · huancayo 45.7 · jesus-maria 48.0
          magdalena 49.6 · chorrillos 59.9   ← están mal TODAS
      - comando: exit()
      - comando: make reparar
        esperado: "el mundo sano otra vez, antes del reto 2"
    observar: >-
      **El primer bloque contesta dónde y el segundo contesta de quién.**
      Bebidas se despega sola —31.6 contra 15.4 de la siguiente— y el sesgo es
      **negativo**: se pronosticó de MENOS, así que es venta perdida, no
      sobre-stock. Y en el segundo, las cinco peores tiendas están todas mal:
      **no es una tienda, es la categoría.** Esa distinción es la que decide
      qué se reentrena, y es la que el agente tendrá que hacer solo.
    respaldo: >-
      Si pandas se atraviesa, la interfaz de :8501 ordena por MAPE con un clic.
      Y los números están acá: no hace falta ejecutarlo para seguir el día.
    notas: |
      **No es una lámina para dictar: es para que la copien.** Dos minutos, y
      solo si alguien lo pide o si hay gente nueva.
      - **El bloque se copia entero con su botón** y se pega de una vez. El
        sábado esto no tenía botón y hubo que arrastrar el ratón — es la razón
        por la que falló.
      - **El segundo bloque necesita el `u` del primero.** Si sale
        `NameError: name 'u' is not defined`, es que se pegó solo el segundo.
      - `make reparar` al final **no es opcional**: el reto 2 empieza midiendo
        contra la flota sana.

  - id: s2-guias
    tipo: descargas
    titulo: Las seis guías, otra vez
    entradilla: Las de ayer y las de hoy. Quien llega hoy por primera vez las necesita todas.
    minutos: 2
    archivos:
      - archivo: archivos/guias/05-anatomia-del-agente.pdf
        titulo: 5 · Anatomía del agente
        descripcion: La de hoy. Del bucle plano al grafo, y por qué la diferencia importa
      - archivo: archivos/guias/04-las-siete-herramientas.pdf
        titulo: 4 · Las siete herramientas
        descripcion: Los ojos del agente. Es la primera de hoy, y se usa en dos horas
      - archivo: archivos/guias/06-si-algo-falla.pdf
        titulo: 6 · Si algo falla
        descripcion: Las trece cosas que se rompieron montando esto
      - archivo: archivos/guias/01-docker-en-siete-comandos.pdf
        titulo: 1 · Docker en siete comandos
        descripcion: Para quien no estuvo ayer y arranca hoy con `make arriba`
      - archivo: archivos/guias/02-leer-la-telemetria.pdf
        titulo: 2 · Leer la telemetría
        descripcion: MAPE, sesgo y cobertura. El vocabulario de las dos sesiones
      - archivo: archivos/guias/03-romper-el-mundo.pdf
        titulo: 3 · Romper el mundo
        descripcion: Los cuatro escenarios, que hoy se usan los cuatro
    notas: |
      **2 min** · hoy se usan **tres**: la 4 en el reto 2, la 5 en el 4 y la 3
      en los dos.
      - **Esta lámina es para quien llega hoy.** Quien vino ayer pasa de largo.
      - La 1 y la 2 son el contexto que se perdió: leerlas en el receso alcanza.
      - **Señalar la 4 primero**, que es la que se abre en una hora, y la 5
        aparte: tenerla puesta durante la lectura del grafo ahorra la mitad de
        las preguntas.
