id: s2-apertura
tipo: repaso
titulo: Segunda sesión
objetivos:
  - Recuperar el hilo tras una noche
requisitos:
  - Nada. Se puede seguir sin haber estado el sábado.
items:
  - id: s2-asistencia
    tipo: asistencia
    titulo: Tomar asistencia
    nota: Segunda sesión. Anotar también a quien no vino ayer.

  - id: s2-portada
    tipo: titulo
    titulo: La arquitectura cognitiva
    entradilla: Hoy construimos lo que le faltaba al bucle
    minutos: 2
    notas: |
      Antes de empezar: `make arriba`. Nadie necesita haber dejado nada
      levantado de ayer, y quien viene por primera vez arranca igual.

  - id: s2-recap
    tipo: diagrama
    titulo: Lo que construimos ayer
    entradilla: Cuatro horas, y la misma forma de dibujo que abrió el sábado
    clase: componentes
    minutos: 4
    contenido: |
      flowchart LR
        H["3 herramientas<br/>de percepcion"] --> B
        L["un LLM<br/>con temperatura 0"] --> B
        R["20 lineas<br/>de bucle ReAct"] --> B
        B[("el agente de ayer:<br/>diagnostica, y<br/>suena convincente")] --> Q{"y ahora,<br/>se puede confiar?"}
        Q --> NO["hoy: 4 patologias,<br/>ninguna del modelo"]
        Q -.->|las proximas 4 horas| CAP["reflexion, revision,<br/>memoria, accion"]
    notas: |
      **Decir en voz alta: es el mismo dibujo del sábado, con otras cajas.**
      - **Señalar el rombo.** Ayer la pregunta era *quién los mira*; hoy es
        **si se puede confiar en el que los mira**. Todo el domingo cuelga ahí.
      - Para quien no vino: no hace falta haber estado. El bucle de ayer está
        en `agente/plano.py` y se ejecuta con `make plano`.

  - id: s2-guias
    tipo: descargas
    titulo: Las seis guías, otra vez
    entradilla: Las de ayer y las de hoy. Quien llega hoy por primera vez las necesita todas.
    minutos: 2
    archivos:
      - archivo: archivos/guias/05-anatomia-del-agente.pdf
        titulo: 5 · Anatomía del agente
        descripcion: La de hoy. Del bucle plano al grafo, y por qué la diferencia importa
      - archivo: archivos/guias/04-las-siete-herramientas.pdf
        titulo: 4 · Las siete herramientas
        descripcion: Los ojos del agente. De ayer, y hoy se dan por sabidas
      - archivo: archivos/guias/06-si-algo-falla.pdf
        titulo: 6 · Si algo falla
        descripcion: Las trece cosas que se rompieron montando esto
      - archivo: archivos/guias/01-docker-en-siete-comandos.pdf
        titulo: 1 · Docker en siete comandos
        descripcion: Para quien no estuvo ayer y arranca hoy con `make arriba`
      - archivo: archivos/guias/02-leer-la-telemetria.pdf
        titulo: 2 · Leer la telemetría
        descripcion: MAPE, sesgo y cobertura. El vocabulario de las dos sesiones
      - archivo: archivos/guias/03-romper-el-mundo.pdf
        titulo: 3 · Romper el mundo
        descripcion: Los cuatro escenarios, que hoy se usan los cuatro
    notas: |
      **2 min** · el orden cambia: primero la 5, que es la de hoy.
      - **Esta lámina es para quien llega hoy.** Quien vino ayer pasa de largo.
      - La 1 y la 2 son el contexto que se perdió: leerlas en el receso alcanza.
      - **Señalar la 5 aparte**: es el mapa del domingo. Tenerla abierta durante
        la lectura del grafo ahorra la mitad de las preguntas.
