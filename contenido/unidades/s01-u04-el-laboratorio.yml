# El recorrido del repositorio va acá y no al principio, y esa es la decisión
# de la unidad.
#
# Un mapa antes de haber pisado nada es una lista de carpetas que nadie
# retiene. A esta altura la sala lleva una hora viendo fragmentos de siete
# archivos sin saber cómo está organizado el sitio del que salen, y dentro de
# diez minutos va a abrir uno por su cuenta con el reloj corriendo.
#
# Así que cierra y abre a la vez: «esto que llevas una hora viendo en trozos es
# un repositorio, y así está hecho», y «de acá en adelante cada reto te manda a
# un archivo, y este es el mapa».
id: s1-laboratorio
tipo: repaso
titulo: El laboratorio, entero
objetivos:
  - Saber dónde está cada cosa antes de que un reto pida abrirla
  - Reconocer el diagrama de arquitectura en la estructura de carpetas
requisitos:
  - Haber clonado el repositorio
items:
  - id: s1-lab-titulo
    tipo: titulo
    titulo: El laboratorio, entero
    entradilla: Llevas una hora viendo trozos. Este es el sitio del que salen.
    minutos: 2
    notas: |
      **10 min, y no es relleno.** Llevan una hora viendo fragmentos de siete
      archivos sin saber cómo está organizado el repositorio.
      - En un rato el reto 1 manda abrir `plataforma/api.py` con el reloj
        corriendo. Esta unidad existe para que no lo busquen a ciegas.

  - id: s1-lab-arbol
    tipo: salida-anotada
    titulo: Cuatro carpetas
    entradilla: Y ninguna sorpresa. Cada una es una caja del diagrama de hace un rato.
    comando: ls
    minutos: 4
    salida: |
      Makefile              los atajos. `make ayuda` los lista
      docker-compose.yml    los servicios: plataforma, ui, agente, mlflow, ollama
      .env.example          la plantilla del `.env`, con la llave de LLM

      plataforma/           1,177 lineas · los 192 modelos y su telemetria
      agente/               1,591 lineas · lo que vigila. El domingo entero
      ui/                     286 lineas · una sola pantalla, en Streamlit
      retos/                  285 lineas · el verificador y las incidencias

      README.md             el caso, y como arrancar
      taller-ia-uni-prework.md
      taller.ps1            los mismos atajos, para Windows
    anotaciones:
      - texto: "plataforma/           1,177 lineas"
        explicacion: >-
          **Viene dada y no se toca.** Es la cadena de retail: genera el mundo,
          entrena los 192, corre el job y calcula la telemetría. Diez archivos,
          y hoy ya se han visto trozos de cinco.
      - texto: "agente/               1,591 lineas"
        explicacion: >-
          **Es lo que construimos**, y fíjense en el número: el que vigila pesa
          más que lo vigilado. No es un accidente — mirar bien 192 modelos
          cuesta más código que hacerlos funcionar.
      - texto: "retos/                  285 lineas"
        explicacion: >-
          El verificador que van a ejecutar cinco veces, y un archivo que nadie
          ha nombrado: `incidencias.md`, la bitácora de todo lo que se rompió
          construyendo esto. Es la unidad con la que cierra el domingo.
      - texto: ".env.example"
        explicacion: >-
          Se copia a `.env` y se le pone la llave. Es el único archivo del
          repositorio que cada uno tiene que editar, y el único que **no** se
          sube a git.
    notas: |
      **Recorrer las cuatro carpetas en voz alta, sin abrir ninguna.** No es
      explicar archivos: es que sepan hacia dónde mirar en diez minutos.
      - **Dejar caer la comparación: 1,177 contra 1,591.** Vigilar cuesta más
        que producir. Sorprende a todo el mundo.
      - Si preguntan por `Dockerfile` y `requirements.txt`: uno por servicio,
        dentro de su carpeta. No se abren hoy.

  - id: s1-lab-mapa
    tipo: diagrama
    titulo: Y es el mismo dibujo de hace una hora
    entradilla: El diagrama de arquitectura, con nombres de carpeta encima
    clase: componentes
    minutos: 4
    contenido: |
      flowchart LR
        subgraph P["plataforma/"]
          D["datos.py<br/>el mundo"] --> E["entrenar.py<br/>192 Ridge"]
          E --> J["pronosticar.py<br/>el job"]
          J --> M["metricas.py<br/>la telemetria"]
          M --> API["api.py<br/>:8000"]
        end
        subgraph A["agente/"]
          H["herramientas.py<br/>los ojos"] --> G["grafo.py<br/>el domingo"]
          G --> AC["accion.py<br/>el freno"]
        end
        subgraph U["ui/"]
          APP["app.py<br/>:8501"]
        end
        API --> H
        API --> APP
        R["retos/verificar.py"] -.->|comprueba| P
        R -.->|comprueba| A
    notas: |
      **Decirlo: es el diagrama de hace una hora, con nombres de archivo.**
      - **Señalar la única flecha que cruza de carpeta a carpeta**:
        `api.py → herramientas.py`. El agente no lee el disco de la plataforma
        ni sabe dónde está `metricas.csv`. Habla por HTTP, como en producción.
      - Eso explica dos cosas ya dichas: por qué el verificador corre en el
        contenedor del agente, y por qué el agente no es un servicio.
      - Las tres cajas de `agente/` son el orden del taller: herramientas = 2,
        grafo = 4, accion = 5.

  - id: s1-lab-retos
    tipo: tabla
    titulo: Y a dónde te manda cada reto
    entradilla: Los cinco, con el archivo que abre cada uno. Antes de empezar el primero.
    minutos: 4
    columnas: [Reto, Qué se mira, Archivo]
    filas:
      - ["1 · a mano", "El endpoint de la telemetría y cómo se calcula", "`plataforma/api.py` · `metricas.py`"]
      - ["2 · percepción", "La herramienta que compara dos ventanas", "`agente/herramientas.py`"]
      - ["3 · el bucle plano", "Veinte líneas de ReAct, y lo que no tienen", "`agente/plano.py`"]
      - ["4 · la arquitectura", "Los siete nodos y las dos flechas que vuelven", "`agente/grafo.py`"]
      - ["5 · la acción", "La política que decide qué se ejecuta", "`agente/accion.py`"]
    resaltar: [2]
    notas: |
      **La lámina por la que existe la unidad.** Verlos los cinco juntos
      convierte cada referencia posterior en «ah, ese».
      - La fila resaltada es la única que se toca dos veces:
        `herramientas.py`, sábado en el reto 2 y domingo con el grafo. 514
        líneas, el archivo más largo.
      - **Decir que cuatro de los cinco están en `agente/`**: la plataforma se
        lee una vez; lo que se lee de verdad es lo que vigila.

  - id: s1-lab-ayuda
    tipo: salida-anotada
    titulo: La puerta de entrada
    entradilla: make ayuda. Es lo primero que se teclea en un repositorio ajeno.
    comando: make ayuda
    minutos: 4
    salida: |
      Taller 02 de caso aplicado de IA en industria

        arriba         Levanta la plataforma y la interfaz
        seed           Pipeline completo: datos, entrenamiento, pronostico y metricas
        entrenar       Entrena los 192 modelos
        consola        Un Python con pandas y /datos montado. Es el reto 1
        agente         Una ejecucion del agente. ARGS="--verboso --fecha 2026-08-08"
        plano          El bucle ReAct del reto 3: un LLM con herramientas y nada mas
        senales        Como esta la flota, en cuatro numeros. Correr antes y despues de romper
        actuar         Ejecucion CON permiso para reentrenar de verdad. Ojo con lo que pides
        verificar      Comprueba que todo funciona. ARGS="--con-llm" para la version completa
        romper         Degrada los datos, rompe el mundo. Uso: make romper ESCENARIO=sesgo_silencioso
        reparar        Regenera los datos limpios, vuelve al mundo sano
        reset          Boton de panico: borra todo y reconstruye desde cero
    anotaciones:
      - texto: "actuar         Ejecucion CON permiso para reentrenar de verdad"
        explicacion: >-
          **Léanla dos veces.** Es el único atajo del repositorio cuya ayuda
          trae una advertencia, y no es una broma: con eso el agente reentrena
          modelos de verdad. Es el reto 5, mañana.
      - texto: "consola        Un Python con pandas y /datos montado"
        explicacion: >-
          **Con esto se hace el reto 1.** Los datos viven en un volumen de
          Docker, no en el disco de nadie: un `pd.read_csv` desde el portátil
          no encuentra nada. Esto abre un Python que sí los ve, y no obliga a
          instalar Python ni pandas en la máquina de cada uno.
      - texto: "senales        Como esta la flota, en cuatro numeros"
        explicacion: >-
          La sonda del taller, y la que más van a usar: **antes y después de
          cada `romper`**. Casi ningún comando de acá crea archivos —reescriben
          un CSV y mueven un número dentro—, así que un `ls` no prueba nada y
          esto sí.
      - texto: "reset          Boton de panico"
        explicacion: >-
          Borra los volúmenes, y con ellos los 192 modelos. Después hay que
          volver a ejecutar `seed`, que son unos minutos. `abajo` apaga sin
          borrar, que es lo que uno quiere casi siempre.
    notas: |
      - **La lista sale del propio `Makefile`**: cada receta con su `##`, y
        `ayuda` los recorta con un `grep` y un `awk`. **Truco de cuatro líneas
        que vale la pena robar.**
      - Recortada: son 23 atajos y salen doce.
      - **La regla para cualquier repo ajeno, en este orden**: `README.md`,
        `make ayuda`, y el archivo que el README diga.

  - id: s1-lab-lectura
    tipo: lectura
    titulo: Diez minutos para dar la vuelta
    entradilla: >-
      Reconocer la forma del repositorio antes de trabajar dentro de él.
      Después ya se entra a buscar algo concreto.
    minutos: 8
    archivos:
      - ruta: README.md
        porque: >-
          El caso, cómo arrancar y los cuatro escenarios. Es el mismo relato de
          hace media hora, escrito para leerse el lunes.
      - ruta: retos/README.md
        porque: >-
          Los cinco retos con su tiempo y su criterio de aceptación. Lo que
          vamos a hacer las próximas seis horas, en dos páginas.
      - ruta: retos/incidencias.md
        porque: >-
          La bitácora: nueve errores de diseño y trece incidencias del entorno,
          todos reales. Es el material del cierre del domingo, y se puede leer
          desde ya.
    comandos:
      - make ayuda
      - make senales
    observar: >-
      Que **no hay nada escondido**: 3,339 líneas de Python en cuatro carpetas,
      y todas se abren. Si algo del taller parece magia en las próximas horas,
      el archivo está a un clic.
    notas: |
      **8 min** · la única ventana sin objetivo concreto. Las demás mandan
      buscar algo; esta, reconocer el sitio.
      - **Lanzar la pregunta sin respuesta correcta**: «¿qué archivo abrirías
        primero si esto fuera de tu equipo?». Sale `README.md` o el `Makefile`.
        **Nadie dice `grafo.py`**, que es lo que a nosotros nos interesa.
      - **Señalar `retos/incidencias.md`**: es el sorpresa. Quien lo lea ahora
        reconocerá tres o cuatro entradas a lo largo del día.

  - id: s1-lab-pregunta
    tipo: pregunta
    titulo: Una de arquitectura
    pregunta: >-
      El agente vive en `agente/` y la telemetría en `plataforma/`. ¿Cómo llega
      el agente a los datos?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    respuesta: Por HTTP, contra la API de la plataforma
    minutos: 3
    opciones:
      - Importa `plataforma.metricas` y llama a sus funciones
      - Por HTTP, contra la API de la plataforma
      - Lee `/datos/metricas.csv` del volumen compartido
      - Recibe los datos por parámetro cuando se lo ejecuta
    notas: |
      **30 s.** La tercera es la que más se elige, y es razonable.
      - Al revelar, la frase: **el agente no monta ese volumen.** No es
        descuido — es lo que hace que el lab se parezca a producción, y lo que
        obliga a que las herramientas de percepción sean como son.
    solucion:
      explicacion: |
        **Por HTTP, contra la API.** El agente no importa nada de la
        plataforma, no monta su volumen y no sabe dónde está `metricas.csv`.
        Pide `GET /v1/metricas` y trabaja con lo que le devuelvan.

        Eso no es purismo. Tiene tres consecuencias que se ven hoy y mañana:

        - **Lo que la API no exponga, el agente no lo puede mirar.** El domingo
          a las 12:30, eso va a explicar por qué la política tiene un agujero.
        - Por eso el verificador corre en el contenedor del **agente**: para
          someterse a la misma ceguera. Si corriera en la plataforma
          comprobaría cosas que el agente no puede ver.
        - Y por eso las herramientas devuelven **agregados**: si el agente
          tuviera el CSV a mano, la tentación sería pasárselo entero al modelo.

        En producción es exactamente así, y por la misma razón: quien vigila no
        debería poder tocar lo vigilado.
      descartes:
        - opcion: Importa `plataforma.metricas` y llama a sus funciones
          razon: >-
            Sería lo cómodo, y ataría el agente a la implementación de la
            plataforma: un cambio de formato del CSV lo rompería.
        - opcion: Lee `/datos/metricas.csv` del volumen compartido
          razon: >-
            El volumen existe, pero **el agente no lo monta**. Está en
            `docker-compose.yml`: su servicio solo monta `memoria`.
        - opcion: Recibe los datos por parámetro cuando se lo ejecuta
          razon: >-
            Entonces alguien tendría que decidir de antemano qué mirar, que es
            justo lo que el agente existe para decidir solo.

  - id: s1-lab-repo
    tipo: enlace
    titulo: Y queda público
    url: https://github.com/texai/taller-ia-uni-lab
    descripcion: >-
      El mismo repositorio que acaban de recorrer, en GitHub. Sigue estando el
      lunes, con los cuatro escenarios para seguir rompiendo cosas.
    minutos: 1
    notas: |
      **1 min**, se dice y se pasa.
      - Lo único que tienen que sacar: **no es un lab de clase que se apaga el
        domingo.**
      - Vuelve en el cierre, con la carpeta `guias/`.

  - id: s1-lab-transicion
    tipo: transicion
    titulo: Dónde estamos
    vimos: >-
      La flota, su telemetría, con qué se fabrica cada modelo, y el
      repositorio entero donde vive todo eso
    viene: >-
      El primer reto: encontrar un problema a mano, con la API y pandas, y
      descubrir cuánto se tarda
    minutos: 2
    notas: |
      - Media frase. El mapa lo dibuja la aplicación.
      - **La frase**: «a partir de acá se deja de mirar y se empieza a buscar».
      - El primer archivo del reto 1, `plataforma/api.py`, acaban de verlo en
        el árbol.
