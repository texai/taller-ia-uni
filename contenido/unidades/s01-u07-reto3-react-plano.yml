id: s1-reto-3
tipo: reto
titulo: El primer agente, sin arquitectura
objetivos:
  - Ver funcionar un ReAct plano, y verlo divagar
  - Nombrar las cuatro patologías de un bucle sin arquitectura
  - Salir de acá con una pregunta abierta, no con una respuesta
  - "Conceptos: ReAct, y determinismo del muestreo contra determinismo del sistema"
requisitos:
  - Tener herramientas de percepción que no alarmen sobre lo normal
  - Una llave de LLM en `.env`, o `PROVEEDOR_LLM=mock`
items:
  - id: s1-r3-titulo
    tipo: titulo
    titulo: "Reto 3 · Un LLM con herramientas, y nada más"
    entradilla: Va a funcionar. Ese es el problema.
    minutos: 2
    notas: |
      Decirlo desde el principio: este reto es de diagnóstico, no de
      construcción. No vamos a arreglar nada hoy. Lo que hay que sacar de
      acá es una pregunta bien formulada para mañana.

  - id: s1-r3-mapa
    tipo: diagrama
    titulo: Los pasos de este reto
    entradilla: Una hora, y no se construye nada. Se mira.
    clase: flujo
    minutos: 2
    contenido: |
      flowchart TD
        A["1 · leer el bucle<br/>veinte lineas de ReAct"] --> B["2 · ejecutarlo<br/>una vez"]
        B --> C["3 · ejecutarlo dos veces mas<br/>mismo mundo, temperatura 0"]
        C --> D["4 · comparar las tres<br/>salidas lado a lado"]
        D --> E{{"lo que te llevas:<br/>cuatro patologias, y ninguna<br/>se arregla con un prompt"}}
    notas: |
      **El único reto donde no se escribe una línea**: leer, ejecutar,
      ejecutar y comparar.
      - **El paso 3 parece un desperdicio hasta ver las tres salidas juntas.**
        Con temperatura 0 y el mismo mundo deberían ser idénticas. **No lo
        son.**

  - id: s1-glosario-react
    tipo: glosario
    titulo: La palabra que nombra lo que vamos a leer
    entradilla: Tres letras y un patrón de veinte líneas. Es lo que hay dentro del archivo que viene.
    minutos: 3
    terminos: [ReAct, herramienta, LLM]
    nuevos: [ReAct]
    notas: |
      **ReAct se venía usando sin definirse.** Reason + Act: **pensar, actuar,
      observar, repetir.** No es librería ni framework — es la forma de un
      bucle.
      - **Que quepa en tres palabras es la mitad del punto**: por eso el
        archivo que viene tiene veinte líneas.
      - **Señalar `herramienta`**: el bucle de ReAct es exactamente el ciclo de
        pedir y ejecutar herramientas. Quien lo entendió en el reto 2 ya tiene
        la mitad.
      - **Sembrar sin decirlo**: ReAct es una línea. Mañana, una red.

  - id: s1-r3-bucle
    tipo: codigo
    titulo: El bucle entero
    entradilla: Es corto a propósito, y es un archivo de verdad
    lenguaje: python
    ruta: agente/plano.py
    numeros: ["43-44", "47-52", "56-59"]
    minutos: 3
    contenido: |2
          llm = obtener_llm().bind_tools(HERRAMIENTAS)
          mensajes = [SystemMessage(content=CONTEXTO), HumanMessage(content=encargo)]

          for _ in range(MAX_VUELTAS):
              respuesta = llm.invoke(mensajes)
              mensajes.append(respuesta)
              if not respuesta.tool_calls:
                  break
              for llamada in respuesta.tool_calls:
                  resultado = POR_NOMBRE[llamada["name"]].invoke(llamada["args"])
                  mensajes.append(
                      ToolMessage(str(resultado), tool_call_id=llamada["id"])
                  )
    notas: |
      **ReAct entero. No hay más.**
      - **Decir «plano» mirando el archivo**: una línea de ejecución, un bucle.
        Mañana, un grafo. **Plano contra grafo, una línea contra una red.**
      - `bind_tools` pasa al modelo el esquema de cada herramienta. **La
        docstring que leyeron hace un rato es lo que el modelo ve acá.**
      - **El `for` en vez de `while True` merece una frase**: no sabe cuándo
        parar, para cuando el modelo deja de pedir. **Que haga falta un número
        arbitrario ya es la primera pista de lo que le falta.**

  - id: s1-r3-llave
    tipo: salida-anotada
    titulo: ¿Tu llave responde?
    entradilla: La comprobación que hay que hacer ahora, no cuando falle la demo
    comando: make verificar ARGS="--reto 3"
    minutos: 3
    salida: |
      Reto 3 · el modelo responde
        ✓ 7 herramientas expuestas
        ✓ google responde y sabe llamar herramientas

      Las 2 comprobaciones pasaron.

      # y sin llave, con PROVEEDOR_LLM=mock:
      Reto 3 · el modelo responde
        ✓ 7 herramientas expuestas
        · proveedor mock: no se comprueba el razonamiento

      La comprobacion paso.
    anotaciones:
      - texto: "✓ google responde y sabe llamar herramientas"
        explicacion: >-
          No comprueba que la llave exista: le manda una petición de verdad y
          mira si **pide una herramienta**. Una llave con la cuota agotada
          responde; lo que no hace es funcionar, y eso solo se ve llamando.
      - texto: "Las 2 comprobaciones pasaron."
        explicacion: >-
          Las dos: que las siete herramientas del reto 2 sigan expuestas —si
          salen menos, el problema no es la llave— y que el proveedor conteste.
      - texto: "· proveedor mock: no se comprueba el razonamiento"
        explicacion: >-
          Con `PROVEEDOR_LLM=mock` esta comprobación **se salta y lo dice**. No
          finge un verde: el simulado recorre el bucle y no razona, así que
          declararlo aprobado sería mentir sobre lo único que importa acá.
    notas: |
      **Evita el peor momento del sábado**: descubrir a las 18:10, con la demo
      en pantalla, que media sala no tiene llave.
      - **La frase que se llevan a cualquier despliegue**: comprobar que una
        credencial existe no es comprobar que sirve. Cuota agotada, modelo
        retirado, región equivocada — las tres devuelven una llave válida.

  - id: s1-r3-sin-llave
    tipo: error-comun
    titulo: "Rescate · llegué sin llave de LLM"
    minutos: 3
    sintoma: >-
      El verificador dice que el proveedor no responde, o directamente no hay
      ninguna llave en el `.env`.
    causa: >-
      El trabajo previo pedía conseguir una, y no todo el mundo llega con
      ella. También pasa con una llave buena: cuota agotada, o un modelo que
      el proveedor retiró.
    arreglo: >-
      Tres caminos, en este orden. **Una llave gratuita en cinco minutos**:
      Google AI Studio o Groq la dan al instante con una cuenta y sin tarjeta,
      y se pone en `.env` con `PROVEEDOR_LLM` y la clave del proveedor.
      **`PROVEEDOR_LLM=mock`**, que recorre el bucle entero sin llamar a
      ningún modelo — sirve para comprobar el cableado y no razona. O **mirar
      la pantalla del de al lado**, que para esta unidad alcanza: hoy no se
      escribe nada, se lee y se compara.
    notas: |
      **El orden no es el de la comodidad.** La llave gratuita va primera
      porque es la única que deja ver la divergencia entre ejecuciones.
      - **`mock` no razona: con él la demo de las tres ejecuciones NO
        funciona.** Decírselo a quien lo elija, para que mire la pantalla de un
        compañero en ese momento.
      - Que exista escrita cambia cómo se siente quien levanta la mano: **es un
        caso previsto, no quedarse atrás.**

  - id: s1-r3-lectura
    tipo: lectura
    titulo: El bucle, en su archivo
    entradilla: Veinte líneas, y lo que importa es lo que no tienen
    minutos: 8
    archivos:
      - ruta: agente/plano.py
        porque: >-
          El bucle entero de la lámina anterior, con su docstring. Leerla
          completa: dice para qué existe este archivo y por qué no se usa el
          grafo hoy.
      - ruta: agente/herramientas.py
        lineas: "1-40"
        porque: >-
          Las siete herramientas y sus docstrings. Esas docstrings **son el
          prompt**: es lo único que el modelo sabe sobre qué puede pedir.
    comandos:
      - make romper ESCENARIO=sesgo_silencioso
      - make plano ARGS="--verboso"
    observar: >-
      En el archivo, lo que **no** hay: ni un paso que critique el
      diagnóstico, ni uno que lo reescriba, ni nada que sobreviva a la
      ejecución. Y en la salida, cuántas herramientas llamó y en qué orden —
      hace falta para comparar contra las dos ejecuciones siguientes.
    significa:
      negocio: >-
        El mismo sobre-stock del reto 1, ahora puesto delante de un agente. La pregunta del negocio es si se puede confiar en lo que diga.
      modelo: >-
        El bucle ve la misma telemetría que ustedes vieron a mano. Lo que cambia no es el dato: es quién lo mira y cuántas veces.
    notas: |
      **8 min** · la única ventana del sábado sobre el agente.
      - **La pregunta que rinde**: «¿en qué línea decidirías que ya tiene
        suficiente evidencia?». **No hay ninguna, y esa es la respuesta.**
      - **No saltarse la primera ejecución**: las tres de la lámina siguiente
        se comparan contra esta.
      - **Leer «qué significa» antes de ejecutar**: lo que cambia no es el dato, es quién lo mira.

  - id: s1-r3-que-hace-bien
    tipo: markdown
    titulo: Y funciona
    minutos: 2
    contenido: |
      Conviene decirlo antes de romperlo, porque es verdad y porque es la
      razón de que este patrón esté en todas partes:

      - **Llama las herramientas correctas** sin que nadie le diga cuáles.
      - **Encadena**: mira el resumen, ve algo raro, y pide el detalle de
        esa categoría.
      - **Encuentra cosas de verdad.** El escenario de la campaña lo saca
        casi siempre.
      - **Suena convincente.** Escribe un diagnóstico que cualquiera
        firmaría.

      Con veinte líneas y ninguna arquitectura.
    notas: |
      No saltarse esto. Si la clase sale creyendo que ReAct es malo, se
      llevó la lección equivocada: ReAct es un piso muy alto por muy poco
      código. El problema aparece cuando hay que confiar en él sin mirar.

  - id: s1-r3-ejecutar
    tipo: comando-anotado
    titulo: Ejecutarlo
    entradilla: make plano ARGS="--verboso", abierto. Y acá el atajo esconde algo que importa.
    comando: docker compose run --rm agente python -m agente plano --verboso
    minutos: 3
    segmentos:
      - texto: compose run
        explicacion: >-
          El `run` de Docker. Arranca un contenedor, ejecuta y termina. Es lo
          único de esta línea que Docker entiende, junto con lo que viene
          hasta el nombre del servicio.
      - texto: "--rm"
        explicacion: >-
          El agente **no es un servicio**: se ejecuta, produce un
          diagnóstico y desaparece. Es exactamente el patrón de un job de
          monitoreo — una vez al día, no escuchando en un puerto. Y sin
          embargo su memoria sobrevive a las ejecuciones, porque vive en el
          volumen `memoria` y no en el contenedor. Eso es el reto 4.
      - texto: -m agente plano
        explicacion: >-
          Acá está la frontera: **Docker dijo `run`, el agente dice
          `plano`**, y el nombre del servicio los separa. Todo lo que va
          después de `python` lo interpreta el programa de dentro; Docker no
          sabe qué significa. Los otros subcomandos son `run` —el grafo
          completo, que es mañana— y `memoria`.
        otrosValores: ["-m agente run", "-m agente memoria"]
      - texto: "--verboso"
        explicacion: >-
          Añade al final un resumen con las herramientas que llamó, en
          orden. Ojo con lo que **no** hace: las líneas `→ herramienta(...)`
          que van saliendo durante la ejecución se imprimen siempre, con o sin
          esta bandera. El otro parámetro es `--fecha`, que fija el día que
          el agente cree que es.
        otrosValores: ["--fecha 2026-08-08"]
    significa:
      negocio: >-
        Un diagnóstico por ejecución. Si cada ejecución dice algo distinto, no hay ninguna decisión de negocio que se pueda tomar con esto.
      modelo: >-
        Temperatura 0 y el mismo mundo: debería salir idéntico. Lo que varía no es el muestreo del modelo, es por dónde entró a mirar.
    notas: |
      **`plano` y NO `run`, y no es un detalle.** `run` levanta el grafo de
      mañana: verían al agente corregirse —la revelación del domingo— y
      **ninguna de las cuatro patologías aparecería**.
      - Sin llave, `PROVEEDOR_LLM=mock` recorre el bucle igual. No razona, pero
        nadie se queda mirando la pantalla.
      - `make actuar` es lo mismo con `-e EJECUTAR_ACCIONES=1`. Se ve mañana.
      - **Anticipar el «qué significa»**: temperatura 0, debería salir idéntico.

  - id: s1-r3-prediccion
    tipo: pregunta
    titulo: Antes de ejecutarlo tres veces
    pregunta: >-
      Mismo mundo, misma pregunta, temperatura 0, tres ejecuciones seguidas.
      ¿Cuánto se van a parecer los tres diagnósticos?
    visibilidad: publica
    segundos: 45
    permiteOmitir: false
    respuesta: Coincidirán en el hallazgo, no en la severidad ni en el orden
    minutos: 3
    opciones:
      - Idénticos; temperatura 0 es determinista
      - Coincidirán en el hallazgo, no en la severidad ni en el orden
      - Cada uno encontrará una cosa distinta
      - No se puede saber
    notas: |
      Que aposten antes de mirar. La primera opción es la que la mayoría de
      la sala cree, y es una creencia razonable — por eso duele.

      Revelar **después** de las tres ejecuciones, no antes.
    solucion:
      explicacion: |
        **Coinciden en el hallazgo y divergen en todo lo demás.** El
        escenario lo saca casi siempre; lo que cambia es qué herramientas
        llamó y en qué orden, qué categorías nombró, y sobre todo qué
        severidad le puso.

        Y sí, temperatura 0 es determinista **en el muestreo del siguiente
        token**. No lo es el recorrido: basta que una llamada a herramienta
        salga en otro orden para que el contexto de la siguiente sea otro,
        y a partir de ahí las dos ejecuciones son dos conversaciones distintas.

        Esa es la diferencia entre un modelo determinista y un **sistema**
        determinista. Un bucle sin arquitectura no tiene sitios donde el
        recorrido se ancle, así que hereda toda la varianza del camino.

        Es la patología más incómoda de las cuatro: no se puede firmar un
        informe cuya severidad depende de en qué orden se llamó a una API.
      descartes:
        - opcion: "Idénticos; temperatura 0 es determinista"
          razon: >-
            Determinista es el muestreo, no el recorrido. El bucle vuelve a
            llamar al modelo con un contexto que él mismo fue construyendo.
        - opcion: Cada uno encontrará una cosa distinta
          razon: >-
            Sería peor y no es lo que pasa: las herramientas de percepción
            del reto 2 hacen bien su trabajo, y el hallazgo aparece. El
            problema está una capa más arriba.
        - opcion: No se puede saber
          razon: >-
            Se puede, y es exactamente lo que vamos a hacer: ejecutarlo tres
            veces y mirar. Doce minutos.

  - id: s1-r3-tres-veces
    tipo: demo
    titulo: El mismo escenario, tres veces
    entradilla: Mismo mundo, misma pregunta, temperatura cero
    minutos: 8
    pasos:
      - comando: make romper ESCENARIO=sesgo_silencioso
      - comando: make plano ARGS="--verboso"
      - comando: make plano ARGS="--verboso"
      - comando: make plano ARGS="--verboso"
    observar: >-
      Comparar las tres salidas lado a lado. Qué herramientas llamó cada
      una y en qué orden, qué categorías nombró, y sobre todo qué severidad
      le puso. No van a coincidir — y el mundo era exactamente el mismo las
      tres veces.
    respaldo: >-
      Si las llaves se agotan, basta con dos ejecuciones. Con
      `PROVEEDOR_LLM=mock` el bucle se recorre pero no razona, así que no
      sirve para esto: lo que hay que ver es la divergencia entre dos
      razonamientos, y el simulado no razona.
    significa:
      negocio: >-
        Tres respuestas distintas al mismo problema es exactamente lo que un comité de inventario no puede usar. La inconsistencia es el hallazgo.
      modelo: >-
        Ninguna de las tres está mal: están incompletas de formas distintas. Al bucle no le falta modelo, le falta arquitectura.
    notas: |
      **Decir en voz alta: con temperatura 0.** La reacción natural es «bájale
      la temperatura» — ya está en cero.
      - **Lo que varía no es el muestreo: es por dónde entró a mirar.**
      - **10 min de comparación real.** Es lo que más rinde de la unidad y lo
        que más tienta acortar.
      - **La frase del «qué significa»**: ninguna está mal, están incompletas de formas distintas.

  - id: s1-r3-divergencia
    tipo: markdown
    titulo: Qué diverge, exactamente
    minutos: 2
    contenido: |
      No es que una ejecución acierte y otra falle. Las tres son
      **defendibles**. Lo que cambia es:

      - **Por dónde entró.** Quien empieza por `agregado_por("tienda")` ve
        un mundo distinto del que empieza por `comparar_periodos`.
      - **Dónde paró.** Ninguna sabe cuándo tiene suficiente evidencia,
        así que paran cuando encuentran algo que suena bien.
      - **Qué severidad puso.** Sin una escala anclada a nada, la
        severidad es opinión editorial.
    notas: |
      "Ninguna sabe cuándo tiene suficiente evidencia" es la frase que hay
      que dejar caer acá. Es literalmente lo que le falta al bucle, y
      mañana tiene un nombre: reflexión.

  - id: s1-r3-patologias
    tipo: tabla
    titulo: Las cuatro patologías
    entradilla: Ninguna es del modelo. Todas son de la forma del bucle.
    minutos: 3
    columnas: [Qué hace, Por qué pasa, Qué cuesta]
    filas:
      - ["Concluye con lo primero que encuentra", "Nada le dice cuándo tiene suficiente", "Diagnósticos que no contrastan contra una línea base"]
      - ["Ordena por la señal más ruidosa", "El MAPE tiene los números más grandes", "Reporta primero lo que menos importa"]
      - ["Dramatiza el impacto de negocio", "Ninguna cifra tiene que defenderse", "Números que suenan a plata y no lo son"]
      - ["Mañana redescubre lo mismo", "No hay memoria entre ejecuciones", "Alerta repetida hasta que se la ignora"]
    resaltar: [2]
    notas: |
      - **Las cuatro salieron de ejecuciones reales**, no de una lista de
        riesgos.
      - **La tercera está resaltada porque es la que menos esperan y la más
        peligrosa**: uno que se equivoca en el diagnóstico se corrige; **uno
        que infla el impacto entrena a todos a desconfiar de los números
        correctos también.**

  - id: s1-r3-cita-1
    tipo: cita-agente
    titulo: Dramatizando, en sus propias palabras
    cita: >-
      Inventé impacto de negocio. Dije "9,436 unidades de sobre-stock" pero
      eso es el error acumulado del pronóstico, no sobre-stock. Estoy
      dramatizando.
    procedencia: Reflexión del agente sobre su propio diagnóstico
    comentario: >-
      Las 9,436 unidades existían: era la suma de los errores absolutos.
      Pero un error de pronóstico que a veces sobra y a veces falta no es
      inventario de más. El número era real y la frase era falsa.
    minutos: 3
    notas: |
      Esto lo escribió el agente, y no en la ejecución pelada: lo dijo cuando
      se le agregó un nodo que lo obliga a criticarse. Ese nodo es lo
      primero que construimos mañana. Decirlo así, sin adelantar más.

  - id: s1-r3-cita-2
    tipo: cita-agente
    titulo: Y confundiendo significancia con evidencia
    cita: >-
      Usé p-valor bajo como evidencia de anomalía de datos, pero p-valor
      bajo solo significa cambio estadísticamente significativo.
    procedencia: Reflexión del agente sobre su propio diagnóstico
    comentario: >-
      Es exactamente la trampa 3 del reto anterior, cometida por el agente
      en vez de por quien escribe la herramienta. La herramienta puede estar
      bien calibrada y el razonamiento encima seguir leyendo mal lo que le
      entregan.
    minutos: 3
    notas: |
      Enlazar con el reto 2: ahí el riesgo era poner mal el umbral; acá es
      leer mal la bandera. Son dos capas distintas y las dos hay que
      cuidarlas.

  - id: s1-r3-prompt
    tipo: markdown
    titulo: Por qué no se arregla con un prompt más largo
    minutos: 3
    contenido: |
      La reacción natural es escribir instrucciones mejores: *"no
      dramatices"*, *"contrasta contra una línea base"*, *"no repitas
      alertas"*.

      Se puede probar, y se degrada:

      - Un prompt con quince reglas hace que el modelo cumpla unas y olvide
        otras, y **cuáles olvida cambia en cada ejecución**.
      - No hay forma de saber si cumplió. Un prompt no deja rastro: o
        miras la salida entera, o confías.
      - Y no arregla la memoria. Ninguna instrucción hace que la ejecución de
        mañana sepa lo que dijo la de hoy.

      El problema no es que el modelo no sepa qué hacer. Es que **no hay
      ningún sitio donde eso pueda pasar**: ni un paso que critique, ni uno
      que reescriba, ni algo que persista entre ejecuciones.
    notas: |
      Si alguien insiste con el prompt largo, esta es la pregunta que
      cierra: ¿cómo comprobarías que lo cumplió? En un grafo, el paso o
      corrió o no corrió, y queda registrado.

  - id: s1-r3-pregunta
    tipo: pregunta
    titulo: ¿Qué le falta?
    pregunta: >-
      Al bucle de hoy, ¿qué le agregarías primero para poder confiar en su
      diagnóstico?
    visibilidad: publica
    segundos: 60
    permiteOmitir: true
    minutos: 3
    opciones:
      - Un prompt más detallado
      - Que critique su propio diagnóstico antes de emitirlo
      - Memoria de lo que ya reportó
      - Más herramientas
    notas: |
      **A propósito sin respuesta correcta marcada.**
      - Las tres últimas son piezas reales de mañana; **la primera es la que
        hay que discutir**.
      - **Si gana «memoria», perfecto**: es el único que no se puede simular
        con nada más.
    solucion:
      explicacion: |
        Las tres últimas son piezas reales de lo que construimos mañana, y
        las tres hacen falta. La primera es la que hay que descartar, y es
        la que casi todo el mundo intenta primero.

        Si tuviera que ir una sola: memoria. Es la única que no se puede
        simular con nada más — ninguna instrucción hace que la ejecución de
        mañana sepa lo que dijo la de hoy.
      descartes:
        - opcion: Un prompt más detallado
          razon: >-
            Quince reglas se cumplen a medias y cuáles se olvidan cambia en
            cada ejecución. Y no hay forma de comprobar que las cumplió.
        - opcion: Que critique su propio diagnóstico antes de emitirlo
          razon: >-
            Hace falta, y es lo primero que construimos. Pero criticar sin
            poder corregir deja el diagnóstico contradiciendo a sus propias
            objeciones — por eso mañana son dos nodos, no uno.
        - opcion: Memoria de lo que ya reportó
          razon: >-
            La que más falta hace y la única que no tiene sustituto.
        - opcion: Más herramientas
          razon: >-
            El agente ya llamó las correctas. El problema no fue que le
            faltara con qué mirar; fue que no supo cuándo tenía suficiente.

  - id: s1-r3-golpe
    tipo: titulo
    titulo: Nada de esto se arregla con un prompt más largo
    destacado: ¿Qué le falta a este bucle?
    minutos: 2
    notas: |
      Dejarlo en pantalla en silencio unos segundos. Es el final del
      sábado y la pregunta con la que tienen que irse.

  - id: s1-r3-preguntas
    tipo: pausa-preguntas
    titulo: Pausa para preguntas
    minutos: 3
    disparadores:
      - ¿Alguno tiene hoy un agente en producción? ¿Cómo saben que no divaga?
      - ¿Qué harían ustedes para que dos ejecuciones del mismo día coincidieran?
      - ¿Dónde más han visto un número real usado para decir algo falso?

  # Era el cierre del sábado —«nos vemos mañana a las 09:00»— y el sábado
  # terminó en el reto 1. Ahora este tramo cae a media mañana del domingo, así
  # que la lámina pasa a ser la bisagra hacia el repaso de patologías.
  - id: s1-cierre
    tipo: transicion
    titulo: Y acá se acaba lo fácil
    vimos: >-
      Un mundo que se degrada en silencio, herramientas que sí lo detectan,
      y un agente que las usa bien y aun así divaga
    viene: >-
      Las cuatro patologías con nombre, y las capas que las arreglan:
      reflexión, revisión, memoria y acción
    minutos: 3
    notas: |
      **La bisagra del día.** Hasta acá se construyó; de acá en adelante se
      arregla.
      - **Dejar la pregunta abierta y no contestarla**: el bucle funciona y no
        se puede creer. Eso es lo que ocupa el resto de la mañana.
      - Buen momento para mirar el reloj. Si va justo, el repaso de patologías
        se lee en la mitad de tiempo. **El reto 4 no.**
