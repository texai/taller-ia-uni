id: s2-repaso
tipo: repaso
titulo: Qué le faltaba a ese bucle
objetivos:
  - Emparejar cada patología del reto 3 con la capa que la resuelve
  - Ver el grafo completo una vez, antes de construirlo
items:
  - id: s2-donde-quedamos
    tipo: transicion
    titulo: Dónde estamos
    vimos: >-
      Un agente que funciona, llama herramientas y aun así divaga: cuatro
      patologías, ninguna del modelo
    viene: >-
      Las capas que lo arreglan, que no son un prompt más largo sino
      sitios donde algo pueda pasar
    minutos: 2

  - id: s2-patologias
    tipo: tabla
    titulo: Las cuatro patologías, y qué las resuelve
    entradilla: Cada una tiene un sitio donde arreglarse
    minutos: 5
    columnas: [Patología, Capa que la resuelve, Cómo]
    filas:
      - ["Concluye con lo primero que encuentra", "Reflexión", "Intenta refutar la hipótesis; si le falta evidencia, devuelve el control a percepción"]
      - ["Ordena por la señal más ruidosa", "Percepción", "La herramienta entrega ordenado por la señal cara y pone el recuento primero"]
      - ["Dramatiza el impacto", "Reflexión + revisión", "Cuestionarse no basta: hace falta poder reescribir el diagnóstico"]
      - ["Mañana redescubre lo mismo", "Memoria", "Consulta el historial antes de diagnosticar y lo escribe después"]
    resaltar: [2]
    notas: |
      - **La fila resaltada**: por qué hay dos capas y no una. *Cuestionarse
        sin poder corregirse no sirve de nada* — es la tesis de mañana.
      - **Decir que falta una capa en la tabla: la acción.** No arregla ninguna
        patología, es capacidad nueva y trae sus propios problemas. Reto 5.

  - id: s2-el-grafo
    tipo: diagrama
    titulo: El grafo completo
    entradilla: Sin explicar todavía. Solo para que lo vean entero una vez.
    clase: flujo
    minutos: 4
    contenido: |
      flowchart LR
        P["percepcion"] --> D["diagnostico"]
        D --> R["reflexion"]
        R -->|falta evidencia| P
        R -->|la critica quedo en pie| V["revision"]
        R -->|confirmado| C["recomendacion"]
        V --> C
        C --> A["accion"]
        D <-.->|lee antes, escribe despues| M[("memoria")]
    notas: |
      - **NO explicarlo acá.** Se presenta y se pasa; adelantarlo le quita el
        efecto a la unidad siguiente.
      - **Señalar solo las dos flechas que vuelven hacia atrás.** Lo demás es
        cableado; esas dos son lo que lo hace creíble.

  - id: s2-glosario-agente
    tipo: glosario
    titulo: El vocabulario del domingo
    entradilla: Las palabras con las que se dicta el día entero
    minutos: 4
    terminos:
      [arquitectura cognitiva, grafo, nodo, estado, reflexión y revisión, memoria, herramienta]
    nuevos:
      [arquitectura cognitiva, grafo, nodo, estado, reflexión y revisión, memoria]
    notas: |
      **4 min bien gastados.** El domingo entero se dicta con estas palabras, y
      media sala nunca tocó un grafo de agentes.
      - **`arquitectura cognitiva` primero**: es el título de la sesión y se
        venía usando sin definir. Poder decir qué significa **antes** de
        construirla es la diferencia con seguir un montaje.
      - `herramienta` va apagada: es de ayer. Para quien llega hoy es la única
        que hay que leer entera.
      - `reflexión y revisión` adelanta la tesis: se enuncia acá, se demuestra
        en el reto 4.

  - id: s2-que-no-es
    tipo: markdown
    titulo: Qué es realmente una "capa"
    minutos: 3
    contenido: |
      No es un prompt más largo ni una instrucción mejor. Es **un nodo con
      un solo trabajo**, que corre o no corre y deja rastro.

      La diferencia práctica: a un prompt que dice *"no dramatices"* no se
      le puede preguntar si lo cumplió. A un nodo de reflexión sí — o
      produjo objeciones o no las produjo, y están escritas.

      El mismo modelo, con las mismas herramientas, pero obligado a pasar
      por sitios donde solo puede hacer una cosa.
    notas: |
      - Si preguntan «¿por qué no un prompt gigante?»: un prompt con quince
        reglas cumple unas y olvida otras, y **cuáles olvida cambia en cada
        ejecución**. Un grafo no olvida un nodo.

  - id: s2-pregunta-agregar
    tipo: pregunta
    titulo: ¿Qué le agregarías?
    pregunta: >-
      Mirando el grafo: ¿cuál de estas capas creen que arregla MÁS de las
      cuatro patologías de ayer?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    minutos: 3
    opciones:
      - Percepción
      - Reflexión
      - Revisión
      - Memoria
    respuesta: Reflexión
    notas: |
      Correcta: **reflexión** (sale en dos de las cuatro filas). Pero lo que
      interesa es la discusión, no el acierto.
      - Si gana **memoria**: buena señal, es la que más gente reconoce de su
        propio trabajo.
      - Si gana **revisión**: leyeron bien la fila resaltada.
      - Cualquiera de las dos abre la unidad siguiente.
    solucion:
      explicacion: |
        Reflexión, y por la tabla: aparece en dos de las cuatro filas.
        Ataca la patología de concluir con lo primero que encuentra —porque
        devuelve el control a percepción cuando le falta evidencia— y la de
        dramatizar, porque es donde el agente se pilla a sí mismo.

        Pero fíjense en lo que dice esa segunda fila: reflexión **más**
        revisión. Cuestionarse sin poder corregirse no sirve de nada, y esa
        es la unidad que viene.
      descartes:
        - opcion: Percepción
          razon: >-
            Arregla una, la de ordenar por la señal ruidosa, y eso ya lo
            hicieron ayer en la herramienta.
        - opcion: Revisión
          razon: >-
            Imprescindible, pero sola no hace nada: no hay qué reescribir
            si nadie objetó antes.
        - opcion: Memoria
          razon: >-
            Arregla una, y es la única sin sustituto. Buena respuesta si
            fue la suya — pero cubre una patología, no dos.

  - id: s2-pausa-antes-del-receso
    tipo: pausa-preguntas
    titulo: Lo que quede, antes del corte
    minutos: 3
    disparadores:
      - ¿Alguna de las cuatro patologías les suena de algo suyo?
      - ¿Qué capa del grafo les parece la más difícil de justificar?
      - ¿Hay algo del reto 2 o del 3 que quedó a medias?
    notas: |
      **Van 2h30 de mañana y viene el corte.** Es el momento de recoger lo que
      quedó suelto, no de abrir tema nuevo.
      - Si nadie dice nada, la tercera siempre saca algo: **los dos retos de la
        mañana fueron densos y alguien se quedó atrás sin decirlo.**
      - Si aparece una duda grande, **anotarla y contestarla después del
        receso**. Alargar acá se come el descanso.

  # El receso del domingo, movido acá cuando los retos 2 y 3 pasaron a esta
  # sesión. Dentro del reto 4 quedaba al 59% de la mañana; acá cae en la mitad
  # y sobre la mejor costura que hay: detrás de las cuatro patologías con
  # nombre y delante de construir lo que las arregla. La segunda mitad es la
  # difícil, y **90 min seguidos de grafo no los aguanta nadie**.
  - id: s2-receso
    tipo: receso
    titulo: Receso
    minutos: 20

  # La «después del receso» que pide el correo de coordinación. Es la última
  # que se toma en el programa: pasada esta, el acta ya no cambia.
  - id: s2-asistencia-2
    tipo: asistencia
    titulo: Asistencia, la segunda
    nota: >-
      La última de las cuatro del taller. Uno por uno y en voz alta, con
      micrófono: no vale el chat de Zoom. Si alguien no volvió del receso,
      queda ausente en esta.
