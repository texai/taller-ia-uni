# El caso es una unidad propia y no un ítem hundido dentro del repaso: es el
# marco de las ocho horas, y todo lo que sigue —los cinco retos— ocurre
# dentro de él. Que tenga su sitio en el índice es la diferencia entre un
# ejercicio y un caso.
id: s1-caso
tipo: caso
titulo: El caso
objetivos:
  - Entender el negocio dentro del cual ocurren los cinco retos
items:
  - id: s1-el-caso
    tipo: caso
    archivo: casos/retail-192.yml
    minutos: 5
    notas: |
      El marco de las ocho horas: los cinco retos pasan acá dentro.
      - Leer las cifras en voz alta y **dejarlas respirar**.
      - **NO adelantar los números del sesgo silencioso** — es el reto 1 y le
        quita el golpe. Acá basta la imagen del Excel de los lunes.
      - Vuelve a abrir el domingo, desde este mismo archivo.

  - id: s1-glosario-caso
    tipo: glosario
    titulo: Cuatro palabras del caso, antes de seguir
    entradilla: Se van a usar las ocho horas, y las cuatro significan algo preciso
    minutos: 3
    terminos: [flota, el mundo, artefacto, job batch]
    nuevos: [flota, el mundo, artefacto, job batch]
    notas: |
      - **«el mundo» es la que rinde.** No es poesía: es `ventas.csv`, lo único
        que el lab inventa y lo único que se toca para provocar cada fallo.
        **Los 192 modelos no se tocan nunca.**
      - «flota» para que nadie diga «los modelos»: el problema aparece cuando
        son demasiados para mirarlos de a uno.
      - **Decir en voz alta que el glosario está siempre ahí**, botón abajo a
        la derecha. Es la primera vez que aparece.

  - id: s1-caso-codigo
    tipo: codigo
    titulo: Y esta es la cadena, en código
    entradilla: Un archivo, 24 tiendas y 8 categorías. De acá salen los 192.
    lenguaje: python
    ruta: plataforma/config.py
    numeros: ["21-24", "37-59"]
    minutos: 5
    contenido: |2
      # (nombre, region, factor de tamano de la tienda)
      TIENDAS: list[tuple[str, str, float]] = [
          ("miraflores", "LIMA", 1.35),
          ("san-isidro", "LIMA", 1.30),
          ("trujillo", "NORTE", 1.10),
          ("chiclayo", "NORTE", 1.00),
          ("piura", "NORTE", 0.95),
          ("chimbote", "NORTE", 0.80),
          ("arequipa", "SUR", 1.15),
          ("tacna", "SUR", 0.85),
          ("juliaca", "SUR", 0.75),
          ("cusco", "SUR", 0.90),
          ("huancayo", "CENTRO", 0.90),
          ("iquitos", "ORIENTE", 0.80),
      ]

      # (nombre, demanda base diaria, amplitud de estacionalidad semanal)
      CATEGORIAS: list[tuple[str, float, float]] = [
          ("lacteos", 320, 0.18),
          ("bebidas", 410, 0.34),
          ("abarrotes", 500, 0.12),
          ("panaderia", 280, 0.22),
          ("carnes", 190, 0.30),
          ("limpieza", 150, 0.10),
          ("cuidado-personal", 130, 0.14),
          ("congelados", 160, 0.26),
      ]
    notas: |
      **Leer nombres en voz alta**: Miraflores, Chimbote, Juliaca. Después,
      `dem-bebidas-arequipa` en un JSON ya significa algo.
      - **Los dos números de cada línea son el caso entero.**
      - Tamaño de tienda: `miraflores` 1.35 · `juliaca` 0.75 → **promediar
        porcentajes está mal**. Es la trampa 1 del reto 2, sin nombrarla.
      - Estacionalidad: bebidas 0.34 · abarrotes 0.12. **Por eso bebidas es la
        categoría de la campaña del reto 1**: el pico se esconde.
      - Regiones desiguales: 14 en LIMA, 1 en ORIENTE. En el reto 2 eso decide
        un umbral.

  - id: s1-caso-estado
    tipo: salida-anotada
    titulo: Y así está la flota hoy
    entradilla: El estado inicial del caso, medido. Todo lo que viene se compara contra estos números.
    comando: make archivos  ·  y después → resumen_flota(dias=14)
    minutos: 4
    salida: |
      /datos  ·  volumen `datos` de Docker, no una carpeta del repo

        ventas.csv               76,800 filas      4.0 MB   el mundo, dos anos de historia
        modelos/                 193 archivos    266.2 KB   un .joblib por modelo, mas registro.json
        predicciones.csv         17,472 filas      1.5 MB   lo que escribio el job
        metricas.csv             17,472 filas      1.6 MB   lo unico que el agente mira
        ejecuciones_job.csv            1 fila        86 B   la bitacora del job
        mlruns/                 2,881 archivos    143.5 KB   el registro de MLflow, si se levanto

      # y lo que dicen esas metricas
      {
        "modelos_evaluados": 192,
        "entrenados_hasta": "2026-05-08",
        "mape_validacion_medio": 10.4,
        "mape_medio": 13.782,
        "sesgo_pct": 0.801,
        "cobertura_media": 0.887,
        "modelos_con_mape_sobre_25": 8
      }
    anotaciones:
      - texto: "volumen `datos` de Docker, no una carpeta del repo"
        explicacion: >-
          Por eso `ls` después de `make seed` **no muestra nada nuevo**: no hay
          carpeta que mostrar. Un volumen es almacenamiento que gestiona
          Docker, y solo se ve desde dentro de un contenedor — que es lo que
          hace `make archivos`. Sobrevive a `make abajo`; lo borra `make reset`.
      - texto: "metricas.csv             17,472 filas"
        explicacion: >-
          192 modelos por 91 días. **Es todo lo que hay para saber si algo va
          mal**, y es exactamente por lo que nadie lo mira: no hay forma de
          leer diecisiete mil filas un lunes por la mañana. Las primeras cinco,
          si alguien quiere verlas: `make archivos ARGS="--ver metricas.csv"`.
      - texto: '"entrenados_hasta": "2026-05-08"'
        explicacion: >-
          Tres meses sin reentrenar, y no es un descuido del laboratorio: es lo
          normal. El reentrenamiento es semanal o mensual, y el mundo cambia
          cuando le da la gana.
      - texto: '"mape_medio": 13.782'
        explicacion: >-
          **Este es el número contra el que se lee todo el taller.** 13.8% de
          error medio con la flota sana. Cuando dentro de una hora se mueva a
          14.5 y parezca que no pasó nada, es contra este 13.8 que hay que
          compararlo.
      - texto: '"sesgo_pct": 0.801'
        explicacion: >-
          Y este es el que casi nadie mira: ocho décimas hacia arriba, que es
          prácticamente cero. Una flota sana no tiene sesgo. Por eso cuando
          aparece, apareció de verdad.
    notas: |
      **El ancla del caso: se señala el resto del día.**
      - **Pedir que anoten 13.8 / +0.8.** Vuelve seis veces.
      - **Adelantarse a «hice `make seed` y `ls` no muestra nada»:** `/datos`
        es un **volumen** de Docker, no una carpeta. Solo se ve desde dentro,
        y eso hace este comando.
      - `mlruns/` sale ya, mucho antes de nombrar MLflow. Si lo señalan: el
        registro de experimentos, se abre en el reto 1 con `make mlflow`.
      - Si les salen otros números: el mundo se genera contra la fecha del día.
        MAPE y sesgo coinciden al primer decimal.
      - **El atajo esconde lo interesante.** La lámina siguiente lo abre.

  # `make archivos` deja la mejor pregunta sin responder: ¿y cómo se entra al
  # volumen sin el atajo? Es la misma queja que con `make seed` — se ve el
  # comando corto y no la herramienta de debajo. Acá caben los dos comandos de
  # Docker en crudo, que además son los que sirven cuando lo que hace falta es
  # mirar UN archivo y no el inventario entero.
  - id: s1-datos-sin-make
    tipo: demo
    titulo: Y lo mismo sin make, entrando al contenedor
    entradilla: El atajo por dentro. Son dos comandos de Docker, y el segundo sirve para cualquier archivo.
    minutos: 3
    pasos:
      - comando: "# listar el volumen, sin atajo:"
      - comando: docker compose run --rm plataforma ls -lh /datos
        esperado: las seis entradas, con su tamaño y su fecha
      - comando: "# y asomarse a un archivo, cualquiera:"
      - comando: docker compose run --rm plataforma head -3 /datos/metricas.csv
        esperado: la cabecera y dos filas de telemetría
      - comando: "# los mismos dos, con atajo:"
      - comando: make archivos
      - comando: make archivos ARGS="--ver metricas.csv"
    observar: >-
      Que `ls` y `head` son los de siempre — **no hay nada de MLOps acá**. Lo
      único distinto es el prefijo: `docker compose run --rm plataforma`
      levanta un contenedor con el volumen montado, ejecuta el comando dentro
      y lo borra. El `--rm` es eso último.
    notas: |
      **La idea: `/datos` no es inaccesible, solo está en otro sitio.**
      - **Señalar que `ls` y `head` son de toda la vida.** Quien sepa Linux ya
        sabe leer este volumen; lo único que había que aprender es el prefijo.
      - **`--rm` o se acumulan contenedores parados.** Es la misma línea que ya
        vieron en `make seed`, con otro comando al final.
      - `head -3` en vez de `cat`: **`cat` de `metricas.csv` son 17,472 líneas**
        y se lleva la terminal por delante. Decirlo antes de que alguien lo
        haga en vivo.
      - Los dos atajos hacen exactamente esto. Con formato más amable, y sin
        acordarse del prefijo.
