# El caso es una unidad propia y no un ítem hundido dentro del repaso: es el
# marco de las ocho horas, y todo lo que sigue —los cinco retos— ocurre
# dentro de él. Que tenga su sitio en el índice es la diferencia entre un
# ejercicio y un caso.
id: s1-caso
tipo: caso
titulo: El caso
objetivos:
  - Entender el negocio dentro del cual ocurren los cinco retos
items:
  - id: s1-el-caso
    tipo: caso
    archivo: casos/retail-192.yml
    minutos: 5
    notas: |
      El marco de las ocho horas. Todo lo que viene —los cinco retos— pasa
      dentro de esta empresa y sobre esta flota.

      Leer las cifras en voz alta y dejarlas respirar. No dar todavía los
      números del sesgo silencioso: eso es el reto 1, y adelantarlo le quita
      el golpe. Acá basta con que quede la imagen del Excel de los lunes.

      Este mismo caso vuelve a abrir el domingo, desde el mismo archivo,
      para quien no vino.

  - id: s1-glosario-caso
    tipo: glosario
    titulo: Cuatro palabras del caso, antes de seguir
    entradilla: Se van a usar las ocho horas, y las cuatro significan algo preciso
    minutos: 3
    terminos: [flota, el mundo, artefacto, job batch]
    nuevos: [flota, el mundo, artefacto, job batch]
    notas: |
      **Va acá y no al principio del todo** porque acaban de oír el caso: las
      cuatro palabras ya tienen a qué agarrarse. Explicadas antes, son
      definiciones; explicadas ahora, son nombres de cosas que la sala acaba de
      ver.

      La que más rinde es **«el mundo»**. Suena a licencia poética y es
      literal: es `ventas.csv`, es lo único que el laboratorio inventa, y es lo
      único que se toca para provocar cada uno de los fallos de esta tarde. Los
      192 modelos no se van a tocar nunca.

      **«flota»** existe para que nadie diga «los modelos»: el problema del
      taller aparece justo cuando son demasiados para mirarlos de a uno, y la
      palabra lo lleva puesto.

      Y decir en voz alta que **el glosario está siempre disponible**, con el
      botón de abajo a la derecha. Es la primera vez que aparece: de acá al
      domingo nadie va a levantar la mano para preguntar qué era un artefacto.

  - id: s1-caso-codigo
    tipo: codigo
    titulo: Y esta es la cadena, en código
    entradilla: Un archivo, 24 tiendas y 8 categorías. De acá salen los 192.
    lenguaje: python
    ruta: plataforma/config.py
    numeros: ["21-24", "37-59"]
    minutos: 5
    contenido: |2
      # (nombre, region, factor de tamano de la tienda)
      TIENDAS: list[tuple[str, str, float]] = [
          ("miraflores", "LIMA", 1.35),
          ("san-isidro", "LIMA", 1.30),
          ("trujillo", "NORTE", 1.10),
          ("chiclayo", "NORTE", 1.00),
          ("piura", "NORTE", 0.95),
          ("chimbote", "NORTE", 0.80),
          ("arequipa", "SUR", 1.15),
          ("tacna", "SUR", 0.85),
          ("juliaca", "SUR", 0.75),
          ("cusco", "SUR", 0.90),
          ("huancayo", "CENTRO", 0.90),
          ("iquitos", "ORIENTE", 0.80),
      ]

      # (nombre, demanda base diaria, amplitud de estacionalidad semanal)
      CATEGORIAS: list[tuple[str, float, float]] = [
          ("lacteos", 320, 0.18),
          ("bebidas", 410, 0.34),
          ("abarrotes", 500, 0.12),
          ("panaderia", 280, 0.22),
          ("carnes", 190, 0.30),
          ("limpieza", 150, 0.10),
          ("cuidado-personal", 130, 0.14),
          ("congelados", 160, 0.26),
      ]
    notas: |
      **La cadena deja de ser «24 tiendas en cinco regiones» y pasa a tener
      nombres.** Vale la pena leer unos cuantos en voz alta: la sala peruana
      reconoce Miraflores, Chimbote y Juliaca, y a partir de acá cuando salga
      `dem-bebidas-arequipa` en un JSON ya sabe qué es.

      El fragmento se salta la mitad de Lima —el separador punteado lo dice—
      porque son catorce tiendas seguidas y no aportan nada de a una. Lo que
      importa es lo de los bordes.

      **Los dos números de cada línea son el caso entero.** El de la tienda es
      un factor de tamaño: `miraflores` vende 1.35 veces la tienda media y
      `juliaca` 0.75. De ahí sale que promediar porcentajes esté mal —una
      tienda no pesa lo que otra— y de ahí sale, sin decirlo todavía, la
      trampa 1 del reto 2.

      El de la categoría es la amplitud de la estacionalidad semanal: bebidas
      0.34 contra abarrotes 0.12. Bebidas oscila tres veces más de una semana
      a otra, y **por eso es la categoría que se elige para la campaña
      promocional del reto 1**: donde ya hay movimiento, un pico extra se
      esconde mejor.

      Y el reparto por región tampoco es un descuido: 14 tiendas en LIMA, una
      en CENTRO, una en ORIENTE. Guardarlo — en el reto 2 esa desigualdad
      decide un umbral.

      Si alguien pregunta si esto es real: es un mundo generado, y está escrito
      en un archivo que se lee en una pantalla. **Que sea inventado no lo hace
      arbitrario**; cada número de acá tiene una consecuencia que se va a ver
      esta tarde.

  - id: s1-caso-estado
    tipo: salida-anotada
    titulo: Y así está la flota hoy
    entradilla: El estado inicial del caso, medido. Todo lo que viene se compara contra estos números.
    comando: make seed  ·  y después → resumen_flota(dias=14)
    minutos: 4
    salida: |
      # lo que deja make seed, en el volumen `datos` (montado en /datos)
      /datos/ventas.csv            76,800 filas   el mundo, dos años de historia
      /datos/modelos/                 192 .joblib  856 KB en total
      /datos/predicciones.csv      17,472 filas   lo que escribió el job
      /datos/metricas.csv          17,472 filas   lo unico que el agente mira
      /datos/ejecuciones_job.csv        1 fila    la bitacora del job

      # y lo que dicen esas metricas
      {
        "modelos_evaluados": 192,
        "entrenados_hasta": "2026-05-08",
        "mape_validacion_medio": 10.4,
        "mape_medio": 13.782,
        "sesgo_pct": 0.801,
        "cobertura_media": 0.887,
        "modelos_con_mape_sobre_25": 8
      }
    anotaciones:
      - texto: "/datos/metricas.csv          17,472 filas"
        explicacion: >-
          192 modelos por 91 días. **Es todo lo que hay para saber si algo va
          mal**, y es exactamente por lo que nadie lo mira: no hay forma de
          leer diecisiete mil filas un lunes por la mañana.
      - texto: '"entrenados_hasta": "2026-05-08"'
        explicacion: >-
          Tres meses sin reentrenar, y no es un descuido del laboratorio: es lo
          normal. El reentrenamiento es semanal o mensual, y el mundo cambia
          cuando le da la gana.
      - texto: '"mape_medio": 13.782'
        explicacion: >-
          **Este es el número contra el que se lee todo el taller.** 13.8% de
          error medio con la flota sana. Cuando dentro de una hora se mueva a
          14.5 y parezca que no pasó nada, es contra este 13.8 que hay que
          compararlo.
      - texto: '"sesgo_pct": 0.801'
        explicacion: >-
          Y este es el que casi nadie mira: ocho décimas hacia arriba, que es
          prácticamente cero. Una flota sana no tiene sesgo. Por eso cuando
          aparece, apareció de verdad.
    notas: |
      **Es el ancla del caso, y va acá para poder señalarla el resto del día.**
      Hasta ahora el caso era una historia; estos son sus archivos y sus
      números.

      La lista merece medio minuto: que quede claro que el laboratorio no es
      una simulación de mentira, son 76,800 filas de historia y 192 artefactos
      de verdad en disco.

      **Dónde están, si alguien pregunta:** en el volumen `datos` de Docker, no
      en la carpeta del repositorio. Por eso sobreviven a `make abajo` y por eso
      `make reset` —que es `down -v`— los borra. Para verlos:
      `docker compose run --rm plataforma ls -la /datos`.

      El par 13.8 / +0.8 hay que pedir que lo anoten. Vuelve seis veces.

      Si a alguien le salen otros números: el mundo se genera contra la fecha
      del día. El MAPE y el sesgo coinciden al primer decimal; el conteo de
      modelos sobre umbral se mueve.
