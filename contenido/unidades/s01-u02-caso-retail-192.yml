# El caso es una unidad propia y no un ítem hundido dentro del repaso: es el
# marco de las ocho horas, y todo lo que sigue —los cinco retos— ocurre
# dentro de él. Que tenga su sitio en el índice es la diferencia entre un
# ejercicio y un caso.
id: s1-caso
tipo: caso
titulo: El caso
objetivos:
  - Entender el negocio dentro del cual ocurren los cinco retos
items:
  - id: s1-el-caso
    tipo: caso
    archivo: casos/retail-192.yml
    minutos: 5
    notas: |
      El marco de las ocho horas: los cinco retos pasan acá dentro.
      - Leer las cifras en voz alta y **dejarlas respirar**.
      - **NO adelantar los números del sesgo silencioso** — es el reto 1 y le
        quita el golpe. Acá basta la imagen del Excel de los lunes.
      - Vuelve a abrir el domingo, desde este mismo archivo.

  - id: s1-glosario-caso
    tipo: glosario
    titulo: Cuatro palabras del caso, antes de seguir
    entradilla: Se van a usar las ocho horas, y las cuatro significan algo preciso
    minutos: 3
    terminos: [flota, el mundo, artefacto, job batch]
    nuevos: [flota, el mundo, artefacto, job batch]
    notas: |
      - **«el mundo» es la que rinde.** No es poesía: es `ventas.csv`, lo único
        que el lab inventa y lo único que se toca para provocar cada fallo.
        **Los 192 modelos no se tocan nunca.**
      - «flota» para que nadie diga «los modelos»: el problema aparece cuando
        son demasiados para mirarlos de a uno.
      - **Decir en voz alta que el glosario está siempre ahí**, botón abajo a
        la derecha. Es la primera vez que aparece.

  - id: s1-caso-codigo
    tipo: codigo
    titulo: Y esta es la cadena, en código
    entradilla: Un archivo, 24 tiendas y 8 categorías. De acá salen los 192.
    lenguaje: python
    ruta: plataforma/config.py
    numeros: ["21-24", "37-59"]
    minutos: 5
    contenido: |2
      # (nombre, region, factor de tamano de la tienda)
      TIENDAS: list[tuple[str, str, float]] = [
          ("miraflores", "LIMA", 1.35),
          ("san-isidro", "LIMA", 1.30),
          ("trujillo", "NORTE", 1.10),
          ("chiclayo", "NORTE", 1.00),
          ("piura", "NORTE", 0.95),
          ("chimbote", "NORTE", 0.80),
          ("arequipa", "SUR", 1.15),
          ("tacna", "SUR", 0.85),
          ("juliaca", "SUR", 0.75),
          ("cusco", "SUR", 0.90),
          ("huancayo", "CENTRO", 0.90),
          ("iquitos", "ORIENTE", 0.80),
      ]

      # (nombre, demanda base diaria, amplitud de estacionalidad semanal)
      CATEGORIAS: list[tuple[str, float, float]] = [
          ("lacteos", 320, 0.18),
          ("bebidas", 410, 0.34),
          ("abarrotes", 500, 0.12),
          ("panaderia", 280, 0.22),
          ("carnes", 190, 0.30),
          ("limpieza", 150, 0.10),
          ("cuidado-personal", 130, 0.14),
          ("congelados", 160, 0.26),
      ]
    notas: |
      **Leer nombres en voz alta**: Miraflores, Chimbote, Juliaca. Después,
      `dem-bebidas-arequipa` en un JSON ya significa algo.
      - **Los dos números de cada línea son el caso entero.**
      - Tamaño de tienda: `miraflores` 1.35 · `juliaca` 0.75 → **promediar
        porcentajes está mal**. Es la trampa 1 del reto 2, sin nombrarla.
      - Estacionalidad: bebidas 0.34 · abarrotes 0.12. Oscila 3× más, y **por
        eso es la categoría de la campaña del reto 1**: el pico se esconde.
      - Regiones desiguales: 14 en LIMA, 1 en CENTRO, 1 en ORIENTE. En el
        reto 2 eso decide un umbral.
      - Si preguntan si es real: inventado, pero **no arbitrario**.

  - id: s1-caso-estado
    tipo: salida-anotada
    titulo: Y así está la flota hoy
    entradilla: El estado inicial del caso, medido. Todo lo que viene se compara contra estos números.
    comando: make seed  ·  y después → resumen_flota(dias=14)
    minutos: 4
    salida: |
      # lo que deja make seed, en el volumen `datos` (montado en /datos)
      /datos/ventas.csv            76,800 filas   el mundo, dos años de historia
      /datos/modelos/                 192 .joblib  856 KB en total
      /datos/predicciones.csv      17,472 filas   lo que escribió el job
      /datos/metricas.csv          17,472 filas   lo unico que el agente mira
      /datos/ejecuciones_job.csv        1 fila    la bitacora del job

      # y lo que dicen esas metricas
      {
        "modelos_evaluados": 192,
        "entrenados_hasta": "2026-05-08",
        "mape_validacion_medio": 10.4,
        "mape_medio": 13.782,
        "sesgo_pct": 0.801,
        "cobertura_media": 0.887,
        "modelos_con_mape_sobre_25": 8
      }
    anotaciones:
      - texto: "/datos/metricas.csv          17,472 filas"
        explicacion: >-
          192 modelos por 91 días. **Es todo lo que hay para saber si algo va
          mal**, y es exactamente por lo que nadie lo mira: no hay forma de
          leer diecisiete mil filas un lunes por la mañana.
      - texto: '"entrenados_hasta": "2026-05-08"'
        explicacion: >-
          Tres meses sin reentrenar, y no es un descuido del laboratorio: es lo
          normal. El reentrenamiento es semanal o mensual, y el mundo cambia
          cuando le da la gana.
      - texto: '"mape_medio": 13.782'
        explicacion: >-
          **Este es el número contra el que se lee todo el taller.** 13.8% de
          error medio con la flota sana. Cuando dentro de una hora se mueva a
          14.5 y parezca que no pasó nada, es contra este 13.8 que hay que
          compararlo.
      - texto: '"sesgo_pct": 0.801'
        explicacion: >-
          Y este es el que casi nadie mira: ocho décimas hacia arriba, que es
          prácticamente cero. Una flota sana no tiene sesgo. Por eso cuando
          aparece, apareció de verdad.
    notas: |
      **El ancla del caso: se señala el resto del día.** 76,800 filas y 192
      artefactos de verdad en disco, no una simulación de mentira.
      - **Pedir que anoten 13.8 / +0.8.** Vuelve seis veces.
      - Si preguntan dónde están: volumen `datos` de Docker, no en el repo. Por
        eso sobreviven a `make abajo` y `make reset` los borra.
      - Si a alguien le salen otros números: el mundo se genera contra la fecha
        del día. MAPE y sesgo coinciden al primer decimal; el conteo se mueve.
