id: s1-reto-1
tipo: reto
titulo: Encontrar el problema a mano
objetivos:
  - Sentir que revisar 192 modelos a mano no escala
  - Descubrir que la métrica que estaban mirando no era la que hablaba de plata
  - Salir con la pregunta de cuánto tardarían haciendo esto cada mañana
  - "Conceptos: escenario, agregación por dimensión, y deriva contra anomalía"
requisitos:
  - Entorno levantado y con datos
  - Saber qué son el MAPE, el sesgo y la cobertura
items:
  - id: s1-r1-titulo
    tipo: titulo
    titulo: "Reto 1 · Encuentra el problema a mano"
    entradilla: Sin agente, sin LLM. Tú, la API y pandas.
    minutos: 2
    notas: |
      Dejar claro que este reto no se "resuelve": se sufre. El segundo
      escenario está hecho para que no lo encuentren, y eso es el punto.

  - id: s1-r1-mapa
    tipo: diagrama
    titulo: Los pasos de este reto
    entradilla: Cuarenta minutos, cuatro pasos, y una pregunta al final
    clase: flujo
    minutos: 2
    contenido: |
      flowchart TD
        A["1 · romper el mundo<br/>campana_promocional"] --> B["2 · buscarlo<br/>con la API y pandas"]
        B --> C["3 · repararlo y romperlo<br/>otra vez: sesgo_silencioso"]
        C --> D["4 · buscarlo<br/>con el mismo metodo"]
        D --> E{{"lo que te llevas:<br/>cuanto tardas en encontrar<br/>lo que no suena"}}
    notas: |
      **Mapa del trabajo, no de la solución.** Qué se hace; el cómo lo
      descubren ellos.
      - Los cinco retos abren igual: pasos numerados y un hexágono al final.
        A partir del segundo, nadie tiene que leerlo.
      - **El paso 3 sorprende**: nadie espera hacer lo mismo dos veces. Ahí
        está el punto — **la segunda vez el método no encuentra nada.**
  - id: s1-r1-encargo
    tipo: markdown
    titulo: El encargo
    minutos: 2
    contenido: |
      Uno de los 192 modelos —o muchos— se está portando mal. Encuéntralo
      con las herramientas de siempre.

      Tres preguntas, en este orden:

      1. ¿Cuál es el **MAPE medio de la flota** en los últimos 14 días?
      2. ¿Qué **categoría** está peor? ¿En cuántas tiendas?
      3. ¿El problema es de esa categoría, de una **región**, o de la
         **cadena entera**?

      La tercera es la que importa. Las dos primeras son para llegar a
      ella.
    notas: |
      Insistir en el orden. Quien salta directo a mirar modelos
      individuales se pierde: con 192 series, mirar de a una no converge.
      El camino es agregar y comparar cortes.

  - id: s1-r1-criterios
    tipo: criterios
    titulo: Cuándo terminaste
    entradilla: No son criterios de código. Este reto no se escribe, se busca.
    minutos: 2
    criterios:
      - texto: Miraste la flota agregada por categoría, por región y por tienda
        pista: Los tres cortes, no uno. La forma del problema es la respuesta
      - texto: Sabes decir si el problema es de una categoría, de una tienda o de la cadena
        pista: Es la tercera pregunta del encargo, y la única que importa
      - texto: Lo hiciste dos veces, con el mismo método, sobre dos mundos distintos
      - texto: Y en el segundo, no encontraste nada
        pista: Eso no es fallar el reto. Es aprobarlo.
    notas: |
      **El cuarto criterio es el reto entero. Decirlo antes de empezar** —
      quita el miedo a no encontrar.
      - Sin esto, a los 10 min del segundo escenario alguien levanta la mano
        creyendo que se le rompió algo.
      - Los tres cortes del primer criterio son los que `agregado_por` ofrece
        mañana. **Sembrarlo sin nombrarlo.**

  - id: s1-r1-listo
    tipo: lectura
    titulo: ¿Estás en condiciones de empezar?
    entradilla: Veinte segundos, ahora. Antes de cuarenta minutos de ejercicio.
    minutos: 3
    comandos:
      - make verificar ARGS="--reto 1"
    observar: >-
      Que las dos comprobaciones pasen. `192 modelos en produccion` pregunta a
      la API cuántos modelos distintos hay en la telemetría; `hay telemetria
      suficiente` cuenta que sean más de 15,000 filas. Si el entorno no está en
      pie no sale un error de Python: sale
      `¿Esta levantado el entorno?  make arriba && make seed`.
    notas: |
      **20 segundos que ahorran media hora.** Sin esto alguien se pasa el reto
      mirando un mundo a medio poblar y creyendo que el problema es suyo.
      - Primera vez del verificador; vuelve en los retos 2 a 5. `make verificar`
        los ejecuta los cinco, `ARGS="--reto N"` uno.
      - **Decir lo que NO comprueba**: no mira si encontraste el problema.
        Comprueba que el entorno esté en pie.
      - **Si a alguien le falla, que lo diga ahora.**

  - id: s1-glosario-escenarios
    tipo: glosario
    titulo: Tres palabras antes de romper nada
    entradilla: Las dos últimas son la decisión más cara del taller, y hoy solo se nombran
    minutos: 3
    terminos: [escenario, deriva, anomalía, el mundo]
    nuevos: [escenario, deriva, anomalía]
    notas: |
      **`deriva` y `anomalía` deciden todo el domingo.** Se abren hoy porque el
      reto 1 las produce las dos sin nombrarlas.
      - **La frase**: la deriva es del modelo, la anomalía es de los datos.
        Sobre deriva se reentrena; **sobre anomalía, reentrenar rompe un modelo
        que estaba sano.**
      - Hoy basta la distinción. El precio de confundirlas es el reto 5.
      - `escenario` no es «datos de prueba»: es una degradación con nombre, que
        se aplica y se revierte.

  - id: s1-r1-api
    tipo: comando-anotado
    titulo: La telemetría, por la API
    entradilla: También está en http://localhost:8000/docs, con la interfaz de Swagger
    comando: curl -s "http://localhost:8000/v1/metricas?categoria=bebidas&desde=2026-07-01"
    minutos: 3
    segmentos:
      - texto: "-s"
        explicacion: >-
          Silencioso. Sin esto curl escupe una barra de progreso que se
          mezcla con el JSON y ensucia todo lo que venga después en el
          pipe.
        otrosValores: ["-v", "-i"]
      - texto: "categoria=bebidas"
        explicacion: >-
          Filtra por categoría. Los filtros del endpoint son
          `modelo_id`, `categoria`, `tienda`, `region`, `desde` y `hasta`,
          y se combinan entre sí.
      - texto: "desde=2026-07-01"
        explicacion: >-
          Recorta la ventana. Sin fecha vienen los 90 días de todos los
          modelos: 17,472 filas, que es exactamente lo que no se puede leer
          a ojo.
    notas: |
      Es la primera vez que ven la API. Vale la pena abrir `/docs` en vivo
      y dejar que exploren treinta segundos.

  - id: s1-r1-api-salida
    tipo: salida-anotada
    titulo: Y esto es lo que devuelve
    entradilla: Una fila por modelo y por día. 912 de ellas para esta consulta.
    comando: curl -s "…/v1/metricas?categoria=bebidas&desde=2026-07-01" | head
    minutos: 3
    salida: |
      [
        {
          "fecha": "2026-07-01",
          "modelo_id": "dem-bebidas-arequipa",
          "categoria": "bebidas", "tienda": "arequipa", "region": "SUR",
          "n": 1,
          "mape": 3.629,
          "sesgo_pct": 3.629,
          "cobertura": 1.0,
          "unidades_reales": 478.64,
          "unidades_pronosticadas": 496.01,
          "dias_en_promocion": 0, "dias_con_quiebre": 0
        },
        {
          "fecha": "2026-07-01",
          "modelo_id": "dem-bebidas-ate",
          "mape": 22.724,
          "sesgo_pct": -22.724,
          "unidades_reales": 380.74,
          "unidades_pronosticadas": 294.22,
          ...
        }
      ]
    anotaciones:
      - texto: '"mape": 3.629'
        explicacion: >-
          Un día, un modelo. La primera fila es de arequipa y ese día se
          equivocó un 3.6%. **Con `n: 1` el MAPE y el sesgo son el mismo
          número salvo el signo** — la diferencia solo aparece al agregar
          varios días o varios modelos, que es todo el reto 2.
      - texto: '"sesgo_pct": -22.724'
        explicacion: >-
          La segunda fila es la misma métrica con el signo puesto: ate
          pronosticó **de menos**, 294 contra 381 reales. Fíjense en que
          arequipa erró hacia arriba y ate hacia abajo el mismo día: sumadas,
          se cancelan. Eso es lo que hace silencioso a un sesgo de flota.
      - texto: '"unidades_reales": 478.64'
        explicacion: >-
          Las unidades vienen **además** de los porcentajes, y no es
          redundancia. Sin ellas no se puede agregar bien: un porcentaje ya es
          un cociente, y promediar cocientes le da el mismo peso a una tienda
          grande que a una chica. Guardarlo — es la trampa 1 del reto 2.
      - texto: '"dias_con_quiebre": 0'
        explicacion: >-
          La columna que nadie mira hoy y que en el reto 5 lo explica todo:
          cuántos días hubo faltante de stock. La telemetría la trae y el
          agente nunca la usa; esa es la conversación con la que cierra el
          domingo.
    notas: |
      **912 filas para UNA categoría y cinco semanas. Sin filtros, 17,472.**
      Ese número es el argumento del taller: no es que nadie quiera mirar la
      telemetría, es que no se puede a ojo.
      - **La primera anotación es la que más rinde**: con una sola fila el MAPE
        y el sesgo coinciden. **La diferencia nace al sumar, no al medir.**

  - id: s1-r1-romper
    tipo: comando-anotado
    titulo: Romper el mundo
    entradilla: Primero el escenario visible. Esta es la primera de las tres etapas de make romper.
    comando: docker compose run --rm plataforma python -m plataforma escenario --nombre campana_promocional
    minutos: 3
    segmentos:
      - texto: escenario
        explicacion: >-
          El subcomando que degrada el mundo. Reescribe el histórico de
          ventas ya generado: no toca los modelos ni las predicciones, solo
          la realidad contra la que se van a medir.
        otrosValores: ["datos", "entrenar", "pronosticar", "metricas", "seed"]
      - texto: "--nombre campana_promocional"
        explicacion: >-
          Cuál de las cuatro degradaciones aplicar. Es obligatorio y no
          admite un valor inventado: el programa lo valida contra su lista
          y falla enumerando las opciones. Esta es una campaña de descuentos
          en bebidas, mucho más agresiva que cualquiera del entrenamiento,
          en las últimas cuatro semanas.
        otrosValores: ["sesgo_silencioso", "feed_caido", "quiebre_stock"]
    notas: |
      - **Nombrar los parámetros que hoy no usamos**: `--categoria` y
        `--tienda` acotan el daño, `--desde` mueve la fecha. Sirven para
        armarse escenarios propios el lunes.
      - El comando termina diciendo `ahora corre: make pronosticar &&
        make metricas`. Es la pista del ítem siguiente.

  - id: s1-r1-romper-receta
    tipo: codigo
    titulo: Por qué son tres comandos y no uno
    entradilla: La receta de make romper, tal cual está en el Makefile
    lenguaje: makefile
    ruta: Makefile
    numeros: ["100-103"]
    minutos: 2
    resaltar: ["2-4"]
    contenido: |2
      romper:  ## Degrada los datos, rompe el mundo. Uso: make romper ESCENARIO=sesgo_silencioso
      	$(EN_PLATAFORMA) escenario --nombre $(ESCENARIO)
      	$(MAKE) pronosticar
      	$(MAKE) metricas
    notas: |
      Tres líneas, tres contenedores, en orden.
      - **Lo que importa es lo que NO está: no hay `entrenar`.** El mundo
        cambió, se reejecutó el job con los modelos viejos, y se midió.
      - **No es simplificación del lab**: es lo que pasa en producción, donde
        reentrenar es mensual y el mundo cambia cuando quiere.

  - id: s1-guia-escenarios
    tipo: archivo
    titulo: "Guía 3 · Romper el mundo"
    entradilla: Los cuatro escenarios con sus cifras, y cómo armarse otros
    archivo: archivos/guias/03-romper-el-mundo.pdf
    descripcion: >-
      Qué le hace cada escenario a la flota y qué huella deja en el MAPE y en
      el sesgo, medido. Y los tres parámetros —`--categoria`, `--tienda`,
      `--desde`— para acotar el daño y armarse escenarios propios.
    minutos: 1
    notas: |
      - **OJO: la guía trae las cifras de los cuatro escenarios, incluido el
        silencioso.** Quien lea esa fila ahora se adelanta el golpe.
      - No es grave (el punto es el rato buscando, no la sorpresa), pero **si
        la sala va rápida, anunciarla después de la tabla de degradaciones.**
      - Es la que más se usa el lunes: deja seguir rompiendo cosas.

  - id: s1-r1-lectura
    tipo: lectura
    titulo: La telemetría, en sus manos
    entradilla: La API primero, porque de ahí sale todo lo que van a mirar
    minutos: 10
    archivos:
      - ruta: plataforma/api.py
        lineas: "93-124"
        porque: >-
          El endpoint de métricas y sus seis filtros. Es la única puerta por la
          que se ve la flota, y la misma que va a usar el agente mañana.
      - ruta: plataforma/metricas.py
        porque: >-
          De dónde sale cada columna. Vale la pena mirar cómo se calcula
          `sesgo_pct`: es la resta de la lámina de hace media hora, en código.
    comandos:
      - 'curl -s "http://localhost:8000/v1/metricas?categoria=bebidas" | head'
      - make senales
      - make romper ESCENARIO=campana_promocional
      - make senales
    observar: >-
      Que el JSON trae `unidades_reales` y `unidades_pronosticadas` además de
      los porcentajes. Guardarlo: en el reto 2 esa aparente redundancia es la
      diferencia entre agregar bien y agregar mal. Y **el mismo `make senales`
      antes y después de romper**: es la lectura de la flota en cuatro números,
      y la diferencia entre las dos salidas es lo que el escenario hizo.
    notas: |
      **10 min con la API abierta antes de tocar pandas.** Quien entiende los
      filtros hace el ejercicio en cinco; quien no, pelea con el groupby por
      razones que no son del reto.
      - `http://localhost:8000/docs` es la misma API en Swagger. Más cómoda
        para explorar; el archivo, para entender.
      - **El segundo comando deja el mundo roto.** Si alguien lo ejecuta tarde,
        mira una flota sana y no encuentra nada.

  - id: s1-r1-groupby
    tipo: codigo
    titulo: Diez líneas de pandas
    entradilla: El agregado que responde las tres preguntas. Se pega en `make consola`.
    lenguaje: python
    minutos: 3
    resaltar: ["7-11"]
    contenido: |
      import pandas as pd

      m = pd.read_csv("/datos/metricas.csv", parse_dates=["fecha"])
      u = m[m["fecha"] >= m["fecha"].max() - pd.Timedelta(days=13)]

      por = u.groupby("categoria").agg(
          mape=("mape", "mean"),
          pronosticado=("unidades_pronosticadas", "sum"),
          real=("unidades_reales", "sum"),
      )
      por["sesgo_pct"] = (por.pronosticado - por.real) / por.real * 100

      por[["mape", "sesgo_pct"]].round(1).sort_values("mape", ascending=False)
    notas: |
      **Las líneas resaltadas son el reto 2 entero, adelantado.** El MAPE se
      promedia (es distancia por día); **el sesgo no** — es resta de totales.
      - **Dónde se pega: `make consola`.** Abre un Python dentro del contenedor
        con pandas y `/datos`. Por eso la ruta es absoluta: `metricas.csv` está
        en un volumen de Docker. **Es el error que más tiempo cuesta acá.**
      - Quien prefiera :8501 ordena por MAPE con un clic.
      - Si preguntan por `days=13`: catorce días contando el último.

  - id: s1-r1-feed-caido
    tipo: codigo
    titulo: Cómo se rompe un mundo, por dentro
    entradilla: feed_caido, y las tres líneas de comentario que lo explican todo
    lenguaje: python
    ruta: plataforma/escenario.py
    numeros: ["97-108"]
    resaltar: ["1-3"]
    minutos: 3
    contenido: |2
          # Un feed caido no reporta ceros: no reporta nada. Las filas desaparecen,
          # igual que en produccion. Es la diferencia entre "vendimos cero" y "no
          # sabemos cuanto vendimos", y el agente tiene que notarla.
          if nombre == "feed_caido":
              muda = corte + timedelta(days=7)
              quedan = [
                  f
                  for f in filas
                  if not (f["tienda"] == tienda and date.fromisoformat(f["fecha"]) >= muda)
              ]
              afectadas = len(filas) - len(quedan)
              _escribir(quedan)
    notas: |
      **No es el escenario de hoy**, pero es el que mejor enseña qué significa
      «romper el mundo»: **se reescribe el histórico y se vuelve a medir.**
      - **Las tres líneas de comentario son la lámina.** Una tienda muda no
        escribe ceros: deja de escribir. «Vendimos cero» contra «no sabemos
        cuánto vendimos» es la decisión más cara del domingo.
      - **Decir que no hay magia: hay un `if` por escenario.**

  - id: s1-r1-a-mano
    tipo: demo
    titulo: Encontrarlo con pandas
    minutos: 4
    pasos:
      - comando: make consola
        esperado: |
          Python 3.12 · pandas puesto · /datos montado
          >>> (se pega el bloque de la lámina anterior)
      - comando: "# y para la peor tienda, dentro de esa categoría:"
      - comando: 'b = u[u.categoria == "bebidas"]'
      - comando: 'b.groupby("tienda")["mape"].mean().round(1).sort_values().tail()'
    observar: >-
      Bebidas se despega del resto y no hay ninguna duda de cuál es. Está
      mal en las 24 tiendas a la vez, así que no es una tienda: es la
      categoría. Y el sesgo es fuertemente negativo — el modelo pronosticó
      de MENOS, porque la promoción disparó la venta real y él no la vio
      venir.
    respaldo: >-
      Si alguien se traba con pandas, la interfaz de :8501 ordena por MAPE
      con un clic. El objetivo es la lectura, no el groupby. Y la salida real
      está en la lámina siguiente.

      `make consola` es un intérprete corriente: se pega el bloque entero y se
      pulsa Enter dos veces. Se sale con `exit()`.
    notas: |
      **Medido**: MAPE de la flota 13.8 → 16.0. Bebidas 12.9 → **30.8**, más
      del doble de la flota.
      - **18 de las 24 tiendas de bebidas cruzan el 20%.**
      - Se mueven según el día. **Lo que no se mueve es que bebidas se despega
        sola.**

  - id: s1-r1-salida-visible
    tipo: salida-anotada
    titulo: Y esto es lo que sale
    entradilla: campana_promocional, últimos 14 días, por categoría
    comando: → el groupby de hace dos láminas
    minutos: 3
    salida: |
      # por categoria, ultimos 14 dias
                        mape  sesgo_pct
      categoria
      bebidas           30.8      -32.4
      panaderia         15.1        6.7
      lacteos           14.9        2.4
      limpieza          14.8       -4.9
      cuidado-personal  13.9        1.2
      abarrotes         13.6        1.2
      congelados        13.0       -0.7
      carnes            12.1        2.5

      flota   mape 16.0  sesgo -10.6

      # y por tienda, dentro de bebidas:
      chorrillos 55.3 · san-miguel 51.8 · jesus-maria 46.8 · magdalena 45.7
      → 18 de las 24 tiendas por encima del 20%
    anotaciones:
      - texto: "bebidas           30.8      -32.4"
        explicacion: >-
          **Se despega sola.** 30.8% contra 15.1% de la segunda: no hay que
          decidir nada, salta a la vista. Esto es lo que un tablero con
          umbrales sí detecta, y por eso el reto no termina acá.
      - texto: "→ 18 de las 24 tiendas por encima del 20%"
        explicacion: >-
          La segunda pregunta, contestada: está mal en 18 de 24 tiendas, así
          que **no es una tienda, es la categoría**. Si fuera una tienda, la
          vería una sola fila.
      - texto: "sesgo -10.6"
        explicacion: >-
          Y el signo importa: el sesgo de la flota se fue hacia **abajo**. El
          modelo pronosticó de menos porque la promoción disparó la venta real
          y él no la vio venir. Guardarlo para dentro de veinte minutos: en el
          escenario siguiente el sesgo se va hacia el otro lado, y un umbral
          por arriba no habría cazado este.
    notas: |
      **5 min** · la sensación que hay que dejar es **«esto fue fácil»**. La
      comodidad de acá es lo que hace que la siguiente duela.
      - Las cifras se mueven un poco según el día. **Lo que no se mueve es que
        bebidas se despega sola.**

  - id: s1-r1-visible
    tipo: metrica
    titulo: Cinco minutos
    valor: "1"
    unidad: categoría, 24 tiendas, encontrada a ojo
    contexto: Esto es lo que un tablero con umbrales sí detecta. Ninguna gracia.
    tono: bueno
    minutos: 2
    notas: |
      Bajar las expectativas a propósito. La sensación de "esto era fácil"
      es lo que hace que el escenario siguiente duela.

  - id: s1-r1-prediccion
    tipo: pregunta
    titulo: Antes de ejecutarlo, apuesten
    pregunta: >-
      El segundo escenario es una caída lenta y pareja de la demanda en
      TODA la cadena, sin nada específico que buscar. ¿Qué señal se va a
      mover?
    visibilidad: publica
    segundos: 45
    permiteOmitir: false
    respuesta: El sesgo, y el MAPE casi nada
    minutos: 3
    opciones:
      - El MAPE, claramente
      - El sesgo, y el MAPE casi nada
      - Las dos por igual
      - Ninguna de las dos
    notas: |
      **Que comprometan una respuesta antes de mirar.** No es acertar: es
      haber apostado. Diez minutos después, cuando no encuentren nada, tienen
      algo propio contra lo que contrastar.
      - **NO revelar todavía.** El revelado va después del ejercicio, en la
        tabla de las dos degradaciones.
    solucion:
      explicacion: |
        **El sesgo, y el MAPE casi nada.** Y ese "casi nada" es el taller
        entero.

        El MAPE mide *cuánto* te equivocas, sin signo. Si la demanda cae un
        poco en todas partes, el modelo se pasa un poco en todas partes: el
        error absoluto apenas cambia. El sesgo mide *hacia qué lado*, y ahí
        todos los errores empujan en la misma dirección y se suman.

        Medido acá: el MAPE de la flota pasa de 13.8% a 14.5% —menos de lo
        que se mueve entre dos semanas cualesquiera— y el sesgo de +0.8% a
        +4.7%. Son más de 36,000 unidades de más en almacén en catorce días.

        Un tablero con umbral sobre el MAPE no suena. Nunca.
      descartes:
        - opcion: El MAPE, claramente
          razon: >-
            Es la respuesta que más se elige y la que hace daño: es la
            señal que está en todos los tableros, y es exactamente la que
            no se entera.
        - opcion: Las dos por igual
          razon: >-
            Se moverían las dos si la caída fuera brusca o concentrada. Lo
            que hace silencioso a este escenario es que es lento y parejo.
        - opcion: Ninguna de las dos
          razon: >-
            Sería cierto si el mundo no hubiera cambiado. Cambió, y hay una
            señal que sí lo dice — el problema es que nadie la mira.

  - id: s1-r1-silencioso
    tipo: terminal
    titulo: Ahora el silencioso
    comando: make reparar && make romper ESCENARIO=sesgo_silencioso
    comandoWindows: .\taller.ps1 reparar; .\taller.ps1 romper sesgo_silencioso
    duracion: 40
    minutos: 2
    notas: |
      Acá sí conviene el atajo: seis contenedores seguidos, teclearlos no
      enseña nada nuevo.
      - **`reparar` es `romper` con la primera línea cambiada.** Vuelve al
        mundo sano **sin reentrenar nada**.
      - **Sin el `reparar` los dos escenarios se apilan** y las lecturas dejan
        de significar nada.
      - Este segundo escenario es una caída lenta y pareja en TODA la cadena.
        **Nada específico que buscar.**

  - id: s1-r1-a-mano-2
    tipo: demo
    titulo: Búscalo otra vez
    entradilla: El mismo código, sin cambiar una línea. Diez minutos.
    minutos: 4
    pasos:
      - comando: make senales
        esperado: "MAPE 14.5 · sesgo +4.7 · 16 de 192. Compararlo con el de antes de romper"
      - comando: "# el mismo groupby de hace un rato, tal cual"
      - comando: "# y por región, y por tienda"
    observar: >-
      Nada se despega. Ninguna categoría destaca, ninguna región destaca,
      ninguna tienda destaca. El MAPE de la flota se movió menos de un
      punto. Si tu criterio es "buscar lo que sobresale", acá no hay nada
      que encontrar — y sin embargo el mundo cambió.
    respaldo: >-
      Dejar que se frustren un rato es parte del ejercicio. A los diez
      minutos, cortar y pasar a la tabla.
    notas: |
      NO dar la pista del sesgo todavía. La tabla siguiente es el momento
      del golpe, y si sale antes se desarma. Si alguien lo encuentra solo
      —pasa— pedirle que se lo guarde treinta segundos.

  - id: s1-r1-salida-silencioso
    tipo: salida-anotada
    titulo: Y esto es lo que sale ahora
    entradilla: sesgo_silencioso. El mismo código, el mismo formato, otra historia.
    comando: → el mismo groupby, sin cambiar una línea
    minutos: 4
    salida: |
      # el mismo groupby, y entre parentesis el mundo sano
                        mape  sesgo_pct     (antes)
      categoria
      panaderia         17.2       10.9      ( 6.7)
      lacteos           16.8        6.5      ( 2.4)
      abarrotes         15.1        5.3      ( 1.2)
      cuidado-personal  14.2        4.9      ( 1.2)
      limpieza          13.5       -1.4      (-4.9)
      carnes            13.3        6.4      ( 2.5)
      congelados        13.3        2.8      (-0.7)
      bebidas           12.3        0.7      (-3.0)

      flota   mape 14.5  sesgo 4.7      (13.8 y 0.8)
    anotaciones:
      - texto: "panaderia         17.2       10.9      ( 6.7)"
        explicacion: >-
          **Ninguna se despega.** La peor está en 17.2 y la mejor en 12.3: es
          el mismo abanico de siempre. Ordenado por MAPE, que es como se buscó
          hace veinte minutos, acá no hay nada que encontrar.
      - texto: "flota   mape 14.5  sesgo 4.7      (13.8 y 0.8)"
        explicacion: >-
          Siete décimas de MAPE. Menos de lo que se mueve entre dos semanas
          cualesquiera, y por eso ningún umbral suena. La columna de al lado
          se multiplicó por seis.
      - texto: "( 2.4)"
        explicacion: >-
          Acá está el hallazgo, y hay que mirarlo en columna: **las ocho
          categorías movieron el sesgo hacia arriba**. Lácteos de 2.4 a 6.5,
          congelados de −0.7 a 2.8, bebidas de −3.0 a 0.7. Ocho de ocho, todas
          en la misma dirección. Eso no es ruido — el ruido no tiene dirección.
    notas: |
      **Rescata los diez minutos anteriores**: no era culpa suya, con la
      columna que miraban no había nada que ver.
      - **La tercera anotación es el golpe. Darle tiempo**: que lean la columna
        del paréntesis de arriba abajo antes de decir nada. **Ocho filas, ocho
        hacia el mismo lado.**
      - Un grupo moviéndose es ruido; **los ocho a la vez es una flota entera**.

  - id: s1-r1-tablero
    tipo: imagen
    titulo: Y esto era lo que mostraba el tablero
    entradilla: Mientras buscabas, la pantalla que mira el negocio se veía así
    archivo: img/ui-flota-sesgo.png
    destacar: [25, 9, 12, 13]
    pie: >-
      El mundo con el sesgo silencioso encima. MAPE 14.5% contra 13.8% del
      mundo sano: siete décimas. El gráfico es indistinguible del de hace
      media hora.
    minutos: 2
    notas: |
      **La lámina que cierra el reto 1.**
      - **Señalar el recuadro**: el MAPE se movió siete décimas. Después el
        sesgo al lado: **+4.7% contra +0.8%**.
      - **La frase**: un tablero con umbral sobre el MAPE no suena nunca, y
        esta es la pantalla que lo demuestra.
      - **36,981 unidades de más en catorce días**, y la señal que lo dice está
        a dos centímetros de la que todos miran.

  - id: s1-r1-tabla
    tipo: tabla
    titulo: Las dos degradaciones
    entradilla: El mismo cambio en el mundo, visto por tres señales distintas
    minutos: 3
    columnas: [Señal, Antes, Después, Lectura]
    filas:
      - ["MAPE de la flota", "13.8%", "14.5%", "Se mueve menos que entre dos semanas cualesquiera"]
      - ["Modelos sobre el umbral", "8 / 192", "16 / 192", "Se duplican, y aun así nadie levanta el teléfono"]
      - ["Sesgo de la flota", "+0.8%", "+4.7%", "Seis veces. Y el signo dice hacia dónde"]
    resaltar: [2]
    notas: |
      **Acá está el taller entero. Darle tiempo.**
      - **Señalar que el +0.8% es el que se pidió anotar hace una hora.** La
        columna «antes» no es un número nuevo: es el de las 15:05 vuelto a
        medir.
      - MAPE y sesgo se sostienen al primer decimal. El conteo sobre umbral se
        mueve según el día; **lo que se sostiene es que se duplican.**

  - id: s1-r1-metrica
    tipo: metrica
    titulo: Lo que costó
    valor: "36,000"
    unidad: unidades de más en almacén
    contexto: En catorce días. Ninguna alarma sonó.
    tono: malo
    minutos: 2
    notas: |
      El número exacto varía por ejecución: medido en dos mundos generados
      con cinco días de diferencia dio 36,338 y 36,981. Por eso está
      redondeado. Si alguien pregunta, la explicación es buena: el mundo se
      genera contra la fecha del día.

  - id: s1-r1-comparacion
    tipo: comparacion
    titulo: Qué vio cada señal
    entradilla: El mismo mundo, los mismos datos, los mismos catorce días
    minutos: 2
    izquierda:
      titulo: Lo que vio el MAPE
      contenido: >-
        "La flota está igual que siempre." Y tiene razón: el error se movió
        0.7 puntos, dentro de lo que se mueve solo. El MAPE mide distancia,
        y la distancia casi no cambió.
    derecha:
      titulo: Lo que vio el sesgo
      contenido: >-
        "La flota lleva dos semanas pronosticando de más, y cada vez más."
        El sesgo mide dirección, y la dirección se disparó. Es la única de
        las dos que estaba hablando de plata.
    notas: |
      Recordarles la definición de la unidad anterior: la misma resta, con
      y sin valor absoluto. Toda la diferencia está en un par de barras.

  - id: s1-r1-pregunta
    tipo: pregunta
    titulo: ¿Cuál alertarías?
    pregunta: >-
      Si tuvieras que poner UNA alarma sobre esta flota, y solo una, ¿sobre
      qué señal la pondrías?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    minutos: 3
    opciones:
      - El MAPE
      - El sesgo
      - Los dos
      - Ninguno de los dos solo
    respuesta: Ninguno de los dos solo
    notas: |
      Correcta: la cuarta. Casi nadie la elige antes de discutir.
      - Un umbral sobre el sesgo tampoco alcanza: **la campaña lo movió en la
        dirección contraria, y una tienda muda no mueve ninguna de las dos.**
      - **NO revelar hasta que hayan respondido todos.**
      - **La frase de cierre**: no falta una métrica mejor; falta algo que mire
        varias a la vez y sepa cuál importa hoy.
    solucion:
      explicacion: |
        Ninguno de los dos solo.

        Acaban de ver que el MAPE no vio el sesgo silencioso. Pero el sesgo
        tampoco alcanza: en la campaña promocional se movió en la dirección
        CONTRARIA —el modelo pronosticó de menos, no de más— y una tienda
        que deja de reportar no mueve ninguna de las dos señales.

        No falta una métrica mejor. Falta algo que mire varias a la vez y
        sepa cuál importa hoy.
      descartes:
        - opcion: El MAPE
          razon: >-
            Se movió 0.7 puntos con 36 mil unidades de sobre-stock encima.
            Mide distancia, no dirección.
        - opcion: El sesgo
          razon: >-
            Habría cazado el silencioso, sí. Pero en la campaña el sesgo se
            fue a −32%, y un umbral por arriba no lo habría visto.
        - opcion: Los dos
          razon: >-
            Mejor, y todavía insuficiente: la tienda muda no mueve ninguna
            de las dos. Dos umbrales siguen siendo umbrales.

  - id: s1-r1-cuanto-tardas
    tipo: markdown
    titulo: La pregunta que te llevas
    minutos: 2
    contenido: |
      Hiciste esto para **dos escenarios y una categoría**, con la clase
      entera acompañándote y sabiendo de antemano que algo estaba roto.

      Ahora hazlo **cada mañana**, para 192 modelos, en ocho categorías,
      veinticuatro tiendas y cinco regiones. Sin saber si hoy hay algo.

      ¿Cuánto tardas? ¿Y cuántos lunes aguantas antes de mirar solo las
      cinco tiendas más grandes y dejar los otros 152 modelos sin mirar?
    notas: |
      Es el puente al reto 2. Terminar acá y no explicar la solución: la
      respuesta empieza después del receso.

  - id: s1-receso
    tipo: receso
    titulo: Receso
    minutos: 20
