                              "categoria": m["categoria"],
                              "tienda": m["tienda"],
                              "region": m["region"],
                              "algoritmo": "Ridge",
                              "alpha": alpha,
                              "entrenado_hasta": hasta.isoformat(),
                              "n_entrenamiento": len(X_tr),
                          }
                      )
                      mlflow.log_metric("mape_validacion", mape_val)
    notas: |
      **Nombrarlo: acá vuelve el Módulo 2.** Misma herramienta, mismo trabajo,
      dentro de un caso que ya conocen.
      - **La distinción que vale: parámetro contra métrica.** Parámetro es lo
        que decidiste antes de entrenar; métrica es lo que salió. Los primeros
        se filtran, las segundas se comparan.
      - `log_metric("mape_validacion", ...)` **es el 10.4% otra vez**, tercera
        aparición y ya en su sitio.
      - El `if mlflow is not None`: **un registro no debe poder tumbar un
        entrenamiento.**

  - id: s1-mlflow-compose
    tipo: codigo
    titulo: Cómo se levanta, y por qué no está levantado
    entradilla: El servicio de MLflow en docker-compose.yml. Es la primera vez que abrimos este archivo.
    lenguaje: yaml
    ruta: docker-compose.yml
    numeros: ["62-72"]
    resaltar: ["4", "5"]
    minutos: 3
    contenido: |2
        # Registro de modelos. Opcional: docker compose --profile mlflow up -d mlflow
        mlflow:
          build:
            context: .
            dockerfile: plataforma/Dockerfile
          profiles: ["mlflow"]
          command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///datos/mlruns
          ports:
            - "5000:5000"
          volumes:
            - datos:/datos
    notas: |
      **El archivo que lleva toda la tarde detrás de cada comando, sin
      abrirse.** De un bloque como este salen imagen, puertos y volúmenes.
      - **`profiles: ["mlflow"]` es por qué `make arriba` no lo levanta**: con
        perfil, solo arranca si se lo pides por su nombre. Igual que `ollama`.
      - **MLflow no tiene base de datos acá**: lee una carpeta del mismo volumen
        `datos`. Por eso ve todo lo entrenado antes.
      - Si preguntan por el Dockerfile: `mlflow` ya está en sus dependencias.

  - id: s1-mlflow-ui
    tipo: demo
    titulo: El registro de modelos, abierto
    entradilla: make mlflow. Es el mismo MLflow del Módulo 2, con 192 ejecuciones dentro.
    minutos: 4
    pasos:
