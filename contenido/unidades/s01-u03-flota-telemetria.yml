          "panaderia": 24
        },
        "por_region": {
          "LIMA": 112, "NORTE": 32, "SUR": 32, "CENTRO": 8, "ORIENTE": 8
        },
        "entrenados_hasta": "2026-05-08",
        "mape_validacion_medio": 10.382
      }
    anotaciones:
      - texto: '"total_modelos": 192'
        explicacion: >-
          Ocho categorías por veinticuatro tiendas. Es **la misma pantalla de
          hace un minuto**, en el objeto que un agente sí puede leer: la
          interfaz tiene 192 filas y esto tiene doce líneas. Dicen lo mismo, y
          solo uno de los dos cabe en un prompt.
      - texto: '"LIMA": 112'
        explicacion: >-
          Las regiones no son parejas y no es un descuido: LIMA tiene 112
          modelos, CENTRO y ORIENTE tienen ocho cada una. Guardarlo — en el
          reto 2 esta desigualdad decide un umbral.
      - texto: '"entrenados_hasta": "2026-05-08"'
        explicacion: >-
          Tres meses. Ningún modelo de esta flota ha vuelto a entrenarse desde
          mayo, y así es como se ven casi todas las flotas reales. El modelo no
          se entera de que pasó el tiempo; la telemetría sí.
      - texto: '"mape_validacion_medio": 10.382'
        explicacion: >-
          **Acá está la brecha, en dos números.** El día que se entrenaron se
          equivocaban 10.4%. Hoy, en producción, 13.8% — el número de la
          lámina anterior. Nadie rompió nada: es el mundo alejándose del día
          del entrenamiento.
    notas: |
      **Primera herramienta del agente que ve la clase**, y todavía no hay
      agente: se lee como lo que es, una función. Mañana la llama un LLM y no
      cambia nada.
      - **La comparación en voz alta: 10.4 contra 13.8.**
      - Si preguntan «¿por qué no reentrenar y ya?»: reentrenar sobre datos que
        no se entienden repite el problema con números nuevos. **Es el freno
        del reto 5.**
      - `mape_validacion_medio` sale del registro, no de la telemetría.

  - id: s1-validacion
    tipo: codigo
    titulo: Y de dónde salía ese 10.4%
    entradilla: Las últimas cuatro semanas, apartadas antes de entrenar
    lenguaje: python
    ruta: plataforma/entrenar.py
    numeros: ["109", "113-119"]
    resaltar: ["3-6"]
    minutos: 3
    contenido: |2
              df = construir_features(serie).dropna(subset=COLUMNAS)

              # Ultimas 4 semanas como validacion.
              corte = len(df) - 28
              X_tr, y_tr = df[COLUMNAS].iloc[:corte], df["unidades"].iloc[:corte]
              X_va, y_va = df[COLUMNAS].iloc[corte:], df["unidades"].iloc[corte:]

              modelo = Ridge(alpha=alpha).fit(X_tr, y_tr)
              mape_val = _mape(y_va, pd.Series(modelo.predict(X_va), index=y_va.index))
    notas: |
      **El corte es por tiempo y no al azar. Esa es la lámina.** Repartir al
      azar una serie temporal entrena con días posteriores a los que evalúa: el
      modelo vio el futuro.
      - Por eso el **10.4% es honesto**: se equivocaba así en días que no había
        visto. Hoy va por 13.8%. **La diferencia son tres meses de mundo**, no
        un error de nadie.
      - `Ridge` penaliza coeficientes grandes: con doce features
        correlacionadas, una regresión pelada se vuelve inestable.
      - **Decirlo: se entrena con scikit-learn, con el `.fit()` de cualquier
        cuaderno.**

  - id: s1-pausa-fabrica
    tipo: pausa-preguntas
    titulo: Pausa · antes de ver cómo se fabrican
    minutos: 3
    disparadores:
      - ¿Quedó claro por qué el 10.4% y el 13.8% son comparables?
      - ¿Alguien aparta su conjunto de validación por tiempo, o lo reparte al azar?
      - ¿Cada cuánto se reentrena en donde trabajan? ¿Y quién lo decide?
    notas: |
      **3 min** · última ventana barata antes de cinco láminas seguidas sobre
      cómo se fabrica un modelo.
      - **La segunda es la que rinde**: repartir una serie temporal al azar. En
        una sala de veinte siempre hay dos o tres que lo hacen sin saberlo.
      - La tercera engancha con el reto 5: quien dice «cada mes» ya entendió
        que el modelo sirve contra un mundo que ya no existe.

  - id: s1-guardar
    tipo: codigo
    titulo: Y así se guarda un modelo entrenado
    entradilla: Una línea. Lo demás de esta lámina es el registro, que es lo que se vuelve caro.
    lenguaje: python
    ruta: plataforma/entrenar.py
    numeros: ["121-123", "140-148"]
    resaltar: ["4"]
    minutos: 4
    contenido: |2
              ruta = RUTA_MODELOS / f"{m['modelo_id']}.joblib"
              joblib.dump(modelo, ruta)

              registro.append(
                  {
                      **m,
                      "version": previo.get(m["modelo_id"], {}).get("version", 0) + 1,
                      "entrenado_hasta": hasta.isoformat(),
                      "mape_validacion": round(mape_val, 3),
                      "artefacto": str(ruta),
                  }
              )
    notas: |
      **`joblib.dump(modelo, ruta)` es toda la persistencia.** Decirlo despacio:
      «artefacto» suena mucho más ceremonioso de lo que es.
      - **La `version` no se pone: se hereda y se incrementa.** Es la línea que
        convierte una carpeta de archivos en un registro de modelos.
      - Los modelos que **no** se tocan conservan su versión y su fecha: un
        `--categoria bebidas` reentrena 24 y deja 168 con su edad. **Las flotas
        reales conviven con modelos de distinta edad.**
      - El `mape_validacion` de acá **es el 10.4% de hace dos láminas.**

  - id: s1-entrenar
    tipo: comando-anotado
    titulo: Reentrenar, y solo eso
    entradilla: La etapa 2/4 del seed, corrida sola. Es el único paso que cambia un artefacto.
    comando: docker compose run --rm plataforma python -m plataforma entrenar
    minutos: 4
    segmentos:
      - texto: entrenar
        explicacion: >-
          Uno de los seis subcomandos de la plataforma, y el único que
          **escribe en `modelos/`**. Los demás tocan el histórico o la
          telemetría; este toca los artefactos. `make entrenar` es su atajo.
        otrosValores: ["datos", "escenario", "pronosticar", "metricas", "seed"]
    notas: |
      **El único comando de las ocho horas que cambia un modelo.** Hasta acá
      solo se vio escondido dentro de `seed`, como el `2/4`.
      - Suelto enseña dos cosas: **cuánto tarda de verdad** (por eso `romper` y
        `reparar` no lo incluyen) y que **la `version` sube en uno**.
      - Acepta los filtros de `escenario`: `--categoria bebidas` toca 24 y deja
        168. **Es lo que el agente va a pedir el domingo.**

  - id: s1-entrenar-salida
    tipo: salida-anotada
    titulo: Y lo que deja
    entradilla: La misma flota, una versión más vieja
    comando: docker compose run --rm plataforma python -m plataforma entrenar
    minutos: 3
    salida: |2
        48/192 modelos entrenados...
        96/192 modelos entrenados...
        144/192 modelos entrenados...
        192/192 modelos entrenados...
      Flota entrenada: 192 modelos hasta 2026-05-08

      # y en el registro, antes y despues:
      "version": 1   ->   "version": 2
      "entrenado_hasta": "2026-05-08"   (igual)
    anotaciones:
      - texto: "Flota entrenada: 192 modelos hasta 2026-05-08"
        explicacion: >-
          **La fecha no se movió, y eso es lo raro de la lámina.** Reentrenar no
          adelanta el corte: el modelo se vuelve a ajustar contra el mismo
          histórico, que llega hasta el 8 de mayo porque los 91 días siguientes
          están apartados para evaluarlo. Reentrenar no es lo mismo que tener
          datos nuevos.
      - texto: '"version": 1   ->   "version": 2'
        explicacion: >-
          Lo único que cambió de verdad. Es la evidencia de que el comando hizo
          algo: los `.joblib` pesan lo mismo, se llaman igual y tienen otra
          marca de tiempo. **El registro es el que lleva la cuenta.**
    notas: |
      **La primera anotación es la que enseña, y sorprende**: se reentrena y el
      modelo sigue sin saber nada de julio.
      - **Un reentrenamiento arregla el ajuste, no la ignorancia.** Para eso
        hacen falta datos nuevos.
      - Para comprobarlo: `ls -l /datos/modelos | head` antes y después. Mismo
        nombre, mismo tamaño, otra hora.

  - id: s1-pregunta-reentrenar-arregla
    tipo: pregunta
    titulo: Y entonces, ¿qué arregla reentrenar?
    pregunta: >-
      Acabamos de reentrenar los 192 y `entrenado_hasta` sigue diciendo
      2026-05-08. Si hoy un modelo se está equivocando porque el mundo cambió
      en julio, ¿reentrenarlo así lo arregla?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    respuesta: No, porque sigue sin ver julio
    minutos: 3
    opciones:
      - Sí, para eso está reentrenar
      - No, porque sigue sin ver julio
      - Solo si se cambia el algoritmo
      - Depende de cuántas veces se reentrene
    notas: |
      **30 s.** Va acá porque la lámina anterior dejó el dato raro en pantalla:
      la fecha no se movió.
      - **La consecuencia, al revelar**: el reto 5 va a recomendar reentrenar,
        y eso solo sirve si además llegan datos nuevos.
    solucion:
      explicacion: |
        **No, porque sigue sin ver julio.** El corte de entrenamiento está en
        el 8 de mayo y los 91 días siguientes están apartados a propósito: son
        contra lo que se evalúa la flota. Reentrenar vuelve a ajustar los
        coeficientes **contra el mismo histórico**.

        Reentrenar arregla el ajuste, no la ignorancia. Para que un
        reentrenamiento sirva de verdad hacen falta **datos nuevos** — y en
        producción esa es justo la parte que se olvida: se programa el
        reentrenamiento semanal y nadie comprueba que la ventana de datos
        avance con él.

        Guárdenlo para mañana. En el reto 5 el agente va a recomendar
        «reentrenar la categoría», y la pregunta que hay que hacerle a esa
        recomendación es siempre la misma: *¿contra qué datos?*
      descartes:
        - opcion: Sí, para eso está reentrenar
          razon: >-
            Es lo que todo el mundo asume, y por eso la lámina anterior deja la
            fecha a la vista. Reentrenar sin datos nuevos reajusta lo mismo.
        - opcion: Solo si se cambia el algoritmo
          razon: >-
            Cambiar de algoritmo es otra conversación, y tampoco resuelve
            ésta: un modelo mejor sobre los mismos datos sigue sin saber qué
            pasó en julio.
        - opcion: Depende de cuántas veces se reentrene
          razon: >-
            Reentrenar cien veces sobre el mismo histórico da cien veces el
            mismo modelo. Lo que falta no es repetición, son datos.

  - id: s1-mlflow-registro
    tipo: codigo
    titulo: Y cada entrenamiento queda registrado
    entradilla: Ocho parámetros y una métrica, por modelo. Esto es MLflow, el del Módulo 2.
    lenguaje: python
    ruta: plataforma/entrenar.py
