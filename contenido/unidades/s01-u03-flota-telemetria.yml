id: s1-flota
tipo: repaso
titulo: La flota de 192 modelos
objetivos:
  - Entender qué es una flota de modelos desplegados y quién la vigila hoy
  - "Leer la telemetría: qué dice el MAPE, qué dice el sesgo, qué dice la cobertura"
items:
  - id: s1-glosario-librerias
    tipo: glosario
    titulo: Tres librerías, antes de verlas en una tabla
    entradilla: Las que fabrican los 192 modelos. Solo una se teclea hoy
    minutos: 3
    terminos: [pandas, scikit-learn, joblib]
    nuevos: [pandas, scikit-learn, joblib]
    notas: |
      **Va antes de la tabla**, que las nombra las tres sin explicarlas.
      - **Decir cuál se teclea**: solo `pandas`, y solo en el reto 1. Las otras
        dos se leen.
      - **El «ojo» de `joblib` es el que sorprende**: 1 KB por artefacto, 856 KB
        la flota. Quien espera gigabytes está pensando en un modelo de lenguaje.
      - Si preguntan por MLflow: viene en dos láminas.

  - id: s1-que-es-un-modelo
    tipo: markdown
    titulo: Qué es "un modelo en producción"
    minutos: 2
    contenido: |
      Acá un modelo **no es un chatbot**. Es un **artefacto entrenado**: un
      archivo con los coeficientes que quedaron de ajustar una regresión
      contra el histórico de una tienda y una categoría.

      Cada uno de los 192 es una regresión Ridge sobre features de:

      - **rezagos** de 7, 14 y 28 días
      - **medias móviles** de 7 y 28 días
      - **día de la semana**
      - si ese día hubo **promoción**

      Deliberadamente simple. El taller no trata de exprimir precisión;
      trata de vigilar modelos que ya están corriendo.

      Y se fabrican con la caja de herramientas de siempre, sin nada exótico:

      | Pieza | Con qué |
      |---|---|
      | Las features | **pandas** |
      | El ajuste | **scikit-learn**, `Ridge` de `sklearn.linear_model` |
      | Guardar el artefacto | **joblib**, un `.joblib` por modelo |
      | Anotar cómo se entrenó | **MLflow**, el mismo del Módulo 2 |
    notas: |
      **Decir los cuatro nombres en voz alta.** Es la respuesta a «¿con qué se
      generan los modelos?».
      - **El que sorprende: guardar un modelo es UNA línea.**
        `joblib.dump(modelo, ruta)`. Ni servidor, ni formato propio.
      - MLflow es del Módulo 2. Reencuentro, y se abre en un rato.
      - Si preguntan por qué Ridge: uno más complejo no cambiaría nada de lo
        que vamos a hacer, y alargaría el entrenamiento de los 192.

  # La lámina de código llegaba sin que nadie hubiera dicho qué es una feature
  # ni por qué hay que fabricarlas. Estas dos abren eso: primero con una fila
  # de datos reales —el modelo no lee fechas, lee trece números—, y después
  # desmontando la cadena de pandas, que es donde la clase se pierde.
  - id: s1-glosario-features
    tipo: glosario
    titulo: Cuatro palabras antes de mirar el código
    entradilla: Las que hacen falta para leer doce líneas de pandas sin adivinar
    minutos: 3
    terminos: [feature, rezago, media móvil, fuga de datos]
    nuevos: [feature, rezago, media móvil, fuga de datos]
    notas: |
      **La que hay que dejar clavada es `feature`**: el resto del taller la usa
      sin traducir.
      - **Decirlo en una frase**: el modelo no sabe qué día es ni en qué tienda
        está. Solo ve números, y alguien tuvo que fabricarlos.
      - `rezago` y `media móvil` son las dos formas de mirar atrás: **un día
        concreto** y **el nivel de la semana**. Por eso están las dos.
      - `fuga de datos` se abre acá y se cobra en la lámina siguiente.

  - id: s1-que-es-una-feature
    tipo: tabla
    titulo: Qué es «construir features»
    entradilla: Una fila real de bebidas en Miraflores. Esto, y solo esto, es lo que ve el modelo.
    minutos: 4
    columnas: [Columna, Valor, De dónde sale]
    filas:
      - ["`fecha`", "2025-07-19", "**el modelo NO la ve.** Solo ordena"]
      - ["`unidades`", "1,092.16", "**lo que hay que predecir**, no una feature"]
      - ["`lag_7`", "645.18", "lo que se vendió el 12 de julio, hace 7 días"]
      - ["`lag_14` · `lag_28`", "…", "lo mismo, hace 2 y hace 4 semanas"]
      - ["`media_7`", "604.71", "el promedio de los 7 días anteriores"]
      - ["`media_28`", "…", "el promedio del mes anterior"]
      - ["`dow_1` … `dow_6`", "0 0 0 0 0 1", "sábado. Seis casillas, una encendida"]
      - ["`en_promocion`", "0 ó 1", "del propio histórico"]
      - ["`t`", "0.00 → 1.00", "qué tan avanzada va la serie"]
    resaltar: [3, 5]
    notas: |
      **La frase que resuelve la lámina: el modelo no sabe qué día es ni dónde
      está. Ve trece números y devuelve uno.**
      - **Señalar las dos filas resaltadas juntas.** `lag_7` es *un día*
        —pudo ser raro—; `media_7` es *el nivel*. Un modelo con solo lo primero
        persigue el ruido.
      - **`dow` = day of week**, y van seis y no siete: el domingo es «todas
        apagadas». Con siete, la séptima no aporta nada y estorba al ajuste.
      - Si alguien pregunta por `t`: le deja aprender una tendencia lenta.
      - Los números son de verdad, de `ventas.csv`. Se pueden comprobar en
        `make consola`.

  - id: s1-cadena-features
    tipo: codigo
    titulo: Y la línea que casi nadie lee bien
    entradilla: shift, rolling y mean, de izquierda a derecha, sobre esos mismos números
    lenguaje: text
    minutos: 4
    contenido: |
      df["unidades"].shift(1).rolling(7).mean()
                    └──┬───┘ └───┬────┘ └─┬──┘
                       1         2        3

      la columna         1 · shift(1)      2 · rolling(7)   3 · mean()
      ─────────────      ────────────      ──────────────   ──────────
      12 jul   645.18    corre todo        agrupa los 7
      13 jul   684.56    UNA fila hacia    valores de cada   el promedio
      14 jul   762.33    abajo, para que   ventana:          de esa ventana
      15 jul   464.48    la fila del 19    12..18 jul
      16 jul   399.47    NO se vea a
      17 jul   554.02    si misma
      18 jul   722.90
      ─────────────                                          ↓
      19 jul  1092.16  ← el dia que se predice          media_7 = 604.71

      (645.18 + 684.56 + 762.33 + 464.48 + 399.47 + 554.02 + 722.90) / 7
                                                        = 604.705714…
    notas: |
      **Sin el `shift(1)`, el 1,092.16 del día 19 entra en su propia media** y
      el modelo entrena viendo parte de la respuesta. Eso es fuga de datos.
      - **Leerla como una frase, de izquierda a derecha**: corre uno, agrupa
        de siete, promedia.
      - `.rolling(7)` **no calcula nada**: dice de cuántos en cuántos. El
        número lo pone `.mean()`, y podría ser `.max()`.
      - **La pista de que hay fuga**: validación baja de golpe y producción no
        se parece. Acá 10.4% contra 13.8% — **esa brecha es sana**.
      - Las 6 primeras filas salen `NaN`; por eso hay un `.dropna()`.

  # El respiro del tramo, y de paso la comprobación que vale: si la fuga de
  # datos se entiende sobre un ejemplo inventado, se va a reconocer en features
  # ajenas. Si no, la lámina anterior fue una curiosidad de pandas.
  - id: s1-pregunta-fuga
    tipo: pregunta
    titulo: Cuál filtra el futuro
    pregunta: >-
      Para predecir las ventas de HOY, ¿cuál de estas features es fuga de
      datos?
    minutos: 3
    opciones:
      - Lo que se vendió hace 7 días
      - El promedio de los 7 días anteriores
      - El total de la semana que termina hoy
      - Si hoy es sábado
    respuesta: El total de la semana que termina hoy
    solucion:
      explicacion: |
        **La prueba es siempre la misma: ¿este número existe la mañana en que
        hay que predecir?**

        El total de una semana que termina hoy incluye lo de hoy — que es
        justo lo que no se sabe todavía. Con esa columna el modelo luce
        perfecto en validación y se desploma servido, sin que nada avise.
      razones:
        - opcion: Lo que se vendió hace 7 días
          razon: >-
            Cerrado hace una semana. Es `lag_7`, y está en el modelo.
        - opcion: El promedio de los 7 días anteriores
          razon: >-
            **Anteriores**, y por eso lleva `.shift(1)`. Es `media_7`.
        - opcion: El total de la semana que termina hoy
          razon: >-
            **Incluye hoy.** Es la respuesta metida entre las pistas: no
            existe cuando hay que predecir.
        - opcion: Si hoy es sábado
          razon: >-
            El calendario se sabe con años de antelación. Son las `dow_`.
    notas: |
      **Si la tercera gana cómodo, seguir.** Es la única que no existe todavía
      la mañana de la predicción.
      - **La regla de bolsillo, y es la que se llevan**: ¿este número existe
        cuando hay que predecir? Si no, es fuga.
      - Si alguien duda entre la 2 y la 3, es exactamente el `.shift(1)`.

  - id: s1-features
    tipo: codigo
    titulo: Y estas son las features, de verdad
    entradilla: Trece columnas, y un solo archivo que las calcula para entrenar y para predecir
    lenguaje: python
    ruta: plataforma/modelo.py
    numeros: ["13-21", "32-33"]
    resaltar: ["10-11"]
    minutos: 3
    contenido: |2
      LAGS = (7, 14, 28)
      VENTANAS = (7, 28)

      COLUMNAS = (
          [f"lag_{d}" for d in LAGS]
          + [f"media_{v}" for v in VENTANAS]
          + [f"dow_{d}" for d in range(1, 7)]
          + ["en_promocion", "t"]
      )
              # shift(1) para no filtrar el valor del propio dia que se predice.
              df[f"media_{v}"] = df["unidades"].shift(1).rolling(v).mean()
    notas: |
      **Ahora que la cadena está desmontada, esta lámina es de una sola idea:
      el archivo.**
      - **Un solo archivo para entrenamiento y pronóstico, a propósito.** Si
        calcularan distinto → *training/serving skew*: funciona en el cuaderno
        y falla servido, sin que nada avise. Está dicho en su docstring.
      - **`COLUMNAS` es la lista, y es el contrato**: `entrenar` y
        `pronosticar` la importan los dos. Añadir una feature es tocar acá y
        nada más.
      - Trece features y una regresión. No hace falta más: vigilamos modelos,
        no los exprimimos.

  - id: s1-modelo-vs-contenedor
    tipo: comparacion
    titulo: Un modelo no es un contenedor
    entradilla: La relación no es 1 a 1, y en el taller anterior lo parecía
    minutos: 2
    izquierda:
      titulo: Lo que vieron desplegando
      contenido: >-
        Un modelo empaquetado en su imagen, expuesto como servicio de
        inferencia, respondiendo peticiones HTTP. Una imagen, un modelo, un
        endpoint.
    derecha:
      titulo: Lo que hay acá
      contenido: >-
        Un job batch que corre de madrugada, carga los 192 artefactos de
        disco y escribe un CSV. Nadie necesita una respuesta en 50
        milisegundos para decidir qué reponer mañana. Una imagen, 192
        modelos, ningún endpoint.
    notas: |
      **El punto que más se resiste: decirlo dos veces.**
      - En pronóstico de demanda el patrón dominante es **batch, no servicio**.
      - **La frase**: un servicio se cae y alguien se entera; un job batch
        termina bien y entrega basura.

  - id: s1-arquitectura
    tipo: diagrama
    titulo: La solución completa, por componentes
    clase: componentes
    minutos: 3
    entradilla: Cada caja oscura es un comando. Los cuatro del recuadro los encadena `make seed`.
    contenido: |
      flowchart LR
        subgraph SEED["make seed = datos + entrenar + pronosticar + metricas"]
          direction LR
          D["make datos<br/><small>datos.py</small>"] --> V[("ventas.csv<br/>el mundo")]
          V --> E["make entrenar<br/>192 Ridge<br/><small>entrenar.py · sklearn</small>"]
          E --> M[("modelos/<br/>192 artefactos")]
          E -.->|registro| ML[("MLflow")]
          M --> J["make pronosticar<br/>el job de madrugada<br/><small>pronosticar.py · joblib</small>"]
          V --> J
          J --> P[("predicciones.csv")]
          P --> C["make metricas<br/>cruce contra lo vendido<br/><small>metricas.py · pandas</small>"]
          V --> C
          C --> TM[("metricas.csv<br/>la telemetria")]
        end
        ML -.->|make mlflow| MLUI["registro :5000<br/>un entrenamiento por modelo, y su MAPE<br/><small>servicio aparte, con --profile</small>"]
        TM --> API["API :8000 · make arriba<br/>la única puerta a la telemetría<br/><small>api.py · FastAPI</small>"]
        API -->|lo que hay hoy| UI["interfaz :8501 · make ui<br/>el tablero que nadie mira<br/><small>ui/app.py · Streamlit</small>"]
        API -.->|solo HTTP, no ve el disco| AG["el agente · make agente<br/>todavía no existe<br/><small>grafo.py · LangGraph</small>"]
    notas: |
      El mapa al que se vuelve toda la clase. **Anclarlo bien.**
      - **`ventas.csv` entra DOS veces**: entrenar y medir. Un modelo no se
        degrada en abstracto, sino contra la realidad.
      - **El agente todavía no existe.** Y su flecha dice «solo HTTP, no ve el
        disco»: no sabe dónde está `metricas.csv`.
      - **Cada caja gris es un comando de hoy**, no una arquitectura de
        referencia.
      - **El recuadro es `make seed`.** Por eso la primera vez tarda.
      - `romper` y `reparar` son `pronosticar` + `metricas` otra vez.
        **Ninguno pasa por `entrenar`.**

  - id: s1-arquitectura-capas
    tipo: tabla
    titulo: Y esto es lo que hay debajo de cada caja
    entradilla: El mismo dibujo, sin el atajo. `make` no hace nada por sí solo
    minutos: 4
    columnas: [El atajo, Lo que ejecuta de verdad, Archivo, Librería]
    filas:
      - ["`make datos`", "`docker compose run --rm plataforma python -m plataforma datos`", "`plataforma/datos.py`", "—"]
      - ["`make entrenar`", "`… python -m plataforma entrenar`", "`plataforma/entrenar.py`", "**scikit-learn** · joblib · MLflow"]
      - ["`make pronosticar`", "`… python -m plataforma pronosticar`", "`plataforma/pronosticar.py`", "**joblib** · pandas"]
      - ["`make metricas`", "`… python -m plataforma metricas`", "`plataforma/metricas.py`", "**pandas**"]
      - ["`make arriba`", "`docker compose up -d plataforma ui`", "`plataforma/api.py`", "**FastAPI** · uvicorn"]
      - ["`make ui`", "`docker compose up -d ui`", "`ui/app.py`", "**Streamlit**"]
      - ["`make agente`", "`docker compose run --rm agente python -m agente run`", "`agente/grafo.py`", "**LangGraph** · LangChain"]
    resaltar: [2]
    notas: |
      **La lámina que contesta «¿y qué hace `make` en realidad?».** Nada: lee
      una receta y ejecuta sus líneas.
      - **Leer una fila entera en voz alta**, la resaltada. Las demás se leen
        solas después.
      - **El patrón se repite en las siete**: `docker compose run --rm` +
        servicio + `python -m` + módulo. Quien lo ve una vez, las lee todas.
      - **`up -d` en dos filas, `run --rm` en cinco**: dejar algo vivo contra
        ejecutar y desaparecer.
      - **El día que trabajen sin este Makefile, esta columna es la que hay que
        saber.**

  - id: s1-pregunta-capas
    tipo: pregunta
    pregunta: "`make entrenar` y `docker compose run --rm plataforma python -m plataforma entrenar`: ¿en qué se diferencian?"
    minutos: 2
    opciones:
      - El primero es más rápido, usa una caché
      - En nada. El primero ejecuta exactamente el segundo
      - El primero corre en tu máquina, el segundo en un contenedor
      - El primero entrena, el segundo solo simula
    respuesta: En nada. El primero ejecuta exactamente el segundo
    solucion:
      explicacion: >-
        Es literalmente la misma línea. `make` la lee del `Makefile` y la
        ejecuta — no añade nada, no la optimiza, no la cambia.
      descartes:
        - opcion: El primero corre en tu máquina, el segundo en un contenedor
          razon: Los dos corren en el mismo contenedor. La línea es la misma.
    notas: |
      **30 s, y va acá porque la tabla de capas acaba de estar en pantalla.**
      - Si gana la primera o la tercera, **`make` todavía se ve como magia** y
        conviene volver una lámina atrás.

  # Va JUSTO antes del glosario de Docker y no después: es lo que decide a qué
  # ritmo se dicta el resto de la unidad. Si la sala está en las dos primeras
  # opciones, las seis palabras siguientes hay que leerlas enteras y despacio;
  # si está en las dos últimas, se pasan en un minuto y se gana tiempo para el
  # reto 1. Preguntarlo después ya no sirve de nada.
  - id: s1-pregunta-nivel-docker
    tipo: pregunta
    titulo: ¿Cuánto conocen de Docker?
    pregunta: ¿Cuánto conoces de Docker?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    minutos: 2
    opciones:
      - Nunca lo he escuchado
      - Sé lo que es
      - Lo he usado algunas pocas veces
      - Lo uso con mucha frecuencia
      - Lo domino
    solucion:
      explicacion: |
        **Acá no hay respuesta correcta: es un retrato de la sala**, y sirve
        para calibrar el ritmo de la próxima media hora.

        La respuesta útil es la honesta. En un taller de MLOps la presión es
        a marcar de más, y eso solo consigue que la clase vaya deprisa por
        encima de gente que se quedó atrás sin decirlo.

        Nada de lo que viene hoy exige dominar Docker. Los comandos están
        escritos y el entorno viene hecho: lo que hace falta es **leerlos sin
        que parezcan magia**, y para eso alcanzan las seis palabras de la
        lámina siguiente.
    notas: |
      **Decide el ritmo de la unidad. Mirar el reparto, no el ganador.**
      - **Peso en las dos primeras** → las seis palabras enteras, con su
        ejemplo. Y decirlo en voz alta: **hoy no hace falta saber Docker**,
        los comandos vienen escritos.
      - **Peso en las dos últimas** → glosario en un minuto, señalando solo
        `volumen` y `up` contra `run`: las dos que fallan aunque se use a
        diario.
      - **Decir que es anónima antes de lanzarla.** Solo salen totales, y
        `permiteOmitir` está puesto.
      - Es la pregunta del taller donde más se exagera. Tomarla con pinzas.

  - id: s1-glosario-docker
    tipo: glosario
    titulo: Seis palabras de Docker, antes de teclear
    entradilla: Las que hacen falta para leer los comandos que vienen
    minutos: 3
    terminos: [imagen, contenedor, volumen, servicio, Docker Compose, up contra run]
    nuevos: [imagen, contenedor, volumen, servicio, Docker Compose, up contra run]
    notas: |
      Todo lo que viene usa estas cinco palabras.
      - **`servicio` es la que se usa sin explicarse**: está en cada
        `docker compose run --rm plataforma …` y hace que «el agente no es un
        servicio» signifique algo.
      - **La que se confunde el resto del día**: `up` deja algo vivo, `run`
        ejecuta y desaparece.
      - **`Docker Compose` no es `Docker`**: uno maneja un contenedor, el otro
        el conjunto y su red. Por eso el agente llama a `plataforma:8000` y no
        a `localhost`.

  - id: s1-guia-docker
    tipo: archivo
    titulo: "Guía 1 · Docker en siete comandos"
    entradilla: Estas cuatro palabras y los siete comandos que vienen, en dos caras
    archivo: archivos/guias/01-docker-en-siete-comandos.pdf
    descripcion: >-
      Las cuatro palabras de recién, los siete comandos del taller, la
      diferencia entre `up` y `run`, y dónde viven los datos. Es la hoja para
      tener al lado durante la próxima hora.
    minutos: 1
    notas: |
      **1 min**, se anuncia y se pasa.
      - Sirve para que sepan **cuál** de las seis es la de ahora.
      - **La frase**: todo lo que viene está acá dentro. Quien se pierda en un
        comando no levanta la mano — lo busca.

  - id: s1-glosario-make
    tipo: glosario
    titulo: Tres palabras antes de teclear nada
    entradilla: Se van a usar las ocho horas, y ninguna se ha explicado todavía
    minutos: 3
    terminos: [make, Makefile, taller.ps1]
    nuevos: [make, Makefile, taller.ps1]
    notas: |
      **Va antes de la tabla de atajos**, no después: la tabla ya usa `make` en
      las diez filas.
      - **La frase de `make`: no hace nada por sí solo.** `make entrenar` no
        entrena — ejecuta la línea que alguien escribió bajo `entrenar:`.
      - **Decir lo de `taller.ps1` mirando a la sala.** Media clase está en
        Windows y lleva rato viendo una segunda línea sin saber qué es.
      - Si preguntan por WSL2: se puede, pero **montarlo antes de la clase es
        una forma cara de perder la primera hora.**

  - id: s1-que-es-make
    tipo: comparacion
    titulo: Qué es make, y qué problema resuelve
    entradilla: Un ejecutor de recetas de 1976, anterior a Docker y a casi todo lo demás
    minutos: 4
    izquierda:
      titulo: Sin él
      contenido: |
        Para poblar el mundo hay que teclear, sin equivocarse:

        ```
        docker compose run --rm plataforma \
          python -m plataforma seed
        ```

        Y acordarse de `--rm`, del nombre del servicio, y de que el módulo se
        llama `plataforma` igual que el servicio pero no es lo mismo.

        **El problema no es teclear.** Es que cada persona lo teclea distinto,
        y el que lo escribe en el README deja de actualizarlo en dos semanas.
    derecha:
      titulo: Con él
      contenido: |
        ```
        make seed
        ```

        La receta vive en el `Makefile`, en la raíz del repositorio:

        ```
        seed:  ## Pipeline completo
        	$(EN_PLATAFORMA) seed
        ```

        **Un nombre, dos puntos, y debajo lo que se ejecuta.** Eso es todo lo
        que hay que saber de la sintaxis para leer el archivo entero.
    notas: |
      **La idea que se llevan**: el `Makefile` es la documentación que sí se
      mantiene.
      - **Decirlo así**: si el comando cambia y el `Makefile` no, deja de
        funcionar y alguien lo arregla. **Un README puede llevar meses
        mintiendo** y nadie se entera.
      - `$(EN_PLATAFORMA)` es una variable de arriba del archivo. Se define una
        vez y la usan las seis recetas de la plataforma.
      - **`cat Makefile` lo enseña entero.** Son 100 líneas y se leen de una
        sentada. Vale la pena decir que se puede.

  - id: s1-make-windows
    tipo: comparacion
    titulo: Y en Windows, que no trae make
    entradilla: Mismo nombre detrás, mismos contenedores, mismo resultado
    minutos: 3
    izquierda:
      titulo: macOS y Linux
      contenido: |
        ```
        make arriba
        make seed
        make romper ESCENARIO=sesgo_silencioso
        make verificar ARGS="--reto 1"
        ```

        Recetas en `Makefile`.
    derecha:
      titulo: Windows · PowerShell
      contenido: |
        ```
        .\taller.ps1 arriba
        .\taller.ps1 seed
        .\taller.ps1 romper sesgo_silencioso
        .\taller.ps1 verificar --reto 1
        ```

        Mismo repositorio, archivo `taller.ps1`.
    notas: |
      **La regla, en una frase**: mismo nombre detrás del comando.
      - **Lo único que cambia es cómo se pasan los valores**: `ESCENARIO=x` y
        `ARGS="…"` se vuelven argumentos sueltos. PowerShell no tiene la
        sintaxis de variables de `make`.
      - **Decir que no hace falta WSL2.** Docker Desktop y nada más.
      - Cada lámina del taller que manda ejecutar algo trae **las dos líneas**.
        Señalarlo acá y no volver a mencionarlo.

  - id: s1-make
    tipo: tabla
    titulo: Todos los comandos del taller son atajos
    entradilla: Y hoy los abrimos. Detrás de cada make hay un docker compose que se puede teclear entero.
    minutos: 3
    columnas: [Lo que tecleas, Lo que corre de verdad]
    filas:
      - ["`make arriba`", "`docker compose build` y luego `docker compose up -d plataforma ui`"]
      - ["`make seed`", "`docker compose run --rm plataforma python -m plataforma seed`"]
      - ["`make entrenar`", "`… python -m plataforma entrenar` — el único que reescribe un modelo"]
      - ["`make romper ESCENARIO=x`", "`escenario --nombre x`, después `pronosticar`, después `metricas`"]
      - ["`make agente`", "`docker compose run --rm agente python -m agente run`"]
      - ["`make actuar`", "lo mismo, más `-e EJECUTAR_ACCIONES=1`"]
      - ["`make ui`", "`docker compose up -d ui` — **`up`, no `run`**"]
      - ["`make mlflow`", "`docker compose --profile mlflow up -d mlflow` — el registro, en `:5000`"]
      - ["`make ollama`", "`--profile local up -d ollama` — un modelo local, si no hay llave"]
      - ["`make reset`", "`docker compose down -v` — la `-v` borra los volúmenes"]
    resaltar: [6]
    notas: |
      **Empezar por qué es `make`**: ejecutor de recetas de 1976. Lee el
      `Makefile`, busca la receta y ejecuta sus líneas. Nada más.
      - **La fila resaltada es la trampa del día: `make ui` usa `up`, no
        `run`.** Vuelve tres veces durante la clase.
      - Las dos últimas usan `--profile`: por eso `make arriba` no las levanta.
      - **Lo que se llevan no es la tabla**: es que ningún comando del taller es
        magia, y que sin este Makefile sabrían escribir la columna derecha.

  - id: s1-pregunta-make
    tipo: pregunta
    pregunta: Si borras el `Makefile` del repositorio, ¿qué deja de funcionar?
    minutos: 2
    opciones:
      - El laboratorio entero
      - Los 192 modelos, que se entrenan desde ahí
      - Nada, salvo los atajos
      - Docker, que lo necesita para arrancar
    respuesta: Nada, salvo los atajos
    solucion:
      explicacion: >-
        `make` no ejecuta nada suyo: ejecuta líneas que alguien escribió. Sin
        el `Makefile` habría que teclear el `docker compose run --rm …`
        entero, y el laboratorio funcionaría exactamente igual.
      descartes:
        - opcion: El laboratorio entero
          razon: El laboratorio son contenedores y Python. `make` solo los llama.
        - opcion: Docker, que lo necesita para arrancar
          razon: Es al revés. `make` llama a Docker, no al contrario.
    notas: |
      **La pregunta que comprueba si entendieron la tabla anterior.**
      - Suele ganar la primera, y es la señal de que `make` todavía se ve como
        magia.
      - **Al revelar, la frase**: el día que trabajen sin este Makefile, la
        columna derecha es la que hay que saber.

  - id: s1-cadena
    tipo: codigo
    titulo: Las tres recetas que mueven el mundo
    entradilla: seed lo crea, romper lo degrada, reparar lo devuelve. Tal cual están en el Makefile.
    lenguaje: makefile
    ruta: Makefile
    numeros: ["54-56", "110-118"]
    resaltar: ["5", "10"]
    minutos: 4
    contenido: |2
      seed:  ## Pipeline completo: datos, entrenamiento, pronostico y metricas
      	$(EN_PLATAFORMA) seed

      romper:  ## Degrada los datos, rompe el mundo. Uso: make romper ESCENARIO=sesgo_silencioso
      	$(EN_PLATAFORMA) escenario --nombre $(ESCENARIO)
      	$(MAKE) pronosticar
      	$(MAKE) metricas

      reparar:  ## Regenera los datos limpios, vuelve al mundo sano
      	$(EN_PLATAFORMA) datos
      	$(MAKE) pronosticar
      	$(MAKE) metricas
    notas: |
      **`romper` y `reparar` son la misma receta con la primera línea
      cambiada.** Una pone `escenario --nombre x`, la otra `datos`.
      - **Lo que importa es lo que NO está en ninguna: no hay `entrenar`.** El
        mundo cambia, se reejecuta el job con los modelos viejos, y se mide.
      - **Los 192 artefactos son los mismos toda la tarde** — como en
        producción, donde reentrenar es mensual y el mundo cambia cuando quiere.
      - `$(EN_PLATAFORMA)` es la variable de arriba del archivo.

  # La receta del Makefile dice qué se ejecuta y en qué orden; no dice qué
  # archivo toca cada paso, que es lo que hace falta para saber por qué un `ls`
  # da idéntico después de romper el mundo. Esto es ese mapa, y de paso deja
  # ver que los .joblib no aparecen en ninguna línea de `romper`.
  - id: s1-entradas-salidas
    tipo: codigo
    titulo: Y qué archivo toca cada uno
    entradilla: Los mismos comandos, con lo que leen y lo que escriben. Todo dentro de /datos.
    lenguaje: text
    minutos: 5
    contenido: |
      Todos tienen la misma forma:
        docker compose run --rm plataforma python -m plataforma <sub>
        run --rm = contenedor de usar y tirar, con /datos montado

      make seed  encadena los cuatro de abajo, en este orden
      ─────────────────────────────────────────────────────────────────────
        datos          LEE   (nada: lo inventa)
                       ESCR  ventas.csv .................. 76,800 filas

        entrenar       LEE   ventas.csv
                       ESCR  modelos/*.joblib ............ 192 archivos
                       ESCR  modelos/registro.json ....... version, mape_val
                       ESCR  mlruns/ .................... 192 runs de MLflow

        pronosticar    LEE   ventas.csv + registro.json + los 192 .joblib
                       ESCR  predicciones.csv ............ 17,472 filas
                       ESCR  ejecuciones_job.csv ......... +1 fila (append)

        metricas       LEE   predicciones.csv + ventas.csv
                       ESCR  metricas.csv ............... 17,472 filas
    notas: |
      **La lámina que responde «¿y esto qué tocó?» para el resto del día.**
      - **Cada paso lee lo que escribió el anterior.** Por eso el orden no es
        decorativo: `pronosticar` sin `entrenar` no tiene modelos que cargar.
      - `ejecuciones_job.csv` es **el único que se abre en modo append**. Los
        demás se sobrescriben enteros, y por eso delata cuántas veces corrió
        el job.
      - No leerla entera en voz alta. **Se señala y se vuelve** cuando alguien
        pregunte qué cambió.

  - id: s1-entradas-salidas-romper
    tipo: codigo
    titulo: Y qué toca romper el mundo
    entradilla: Los mismos tres archivos. Y una ausencia, que es de lo que trata la tarde.
    lenguaje: text
    minutos: 4
    contenido: |
      make romper ESCENARIO=campana_promocional
      ─────────────────────────────────────────────────────────────────────
        escenario      LEE   ventas.csv
        --nombre X     ESCR  ventas.csv  ← el MISMO archivo, reescrito
        + pronosticar  ESCR  predicciones.csv
        + metricas     ESCR  metricas.csv

        ⚠ los 192 .joblib NO aparecen en ninguna linea.
          Cambia el mundo, no el modelo. Por eso un `ls` da identico
          antes y despues: es el punto del taller.

      make reparar  = datos + pronosticar + metricas   (regenera limpio)
      ─────────────────────────────────────────────────────────────────────

        archivos       LEE   todo /datos        ESCR  nada
        make consola   python a secas, REPL con pandas y /datos montado
    notas: |
      **La ausencia es la lámina.** No hay `entrenar` en ninguna de las dos
      recetas.
      - **`ventas.csv` es el único archivo del taller que se reescribe en su
        sitio**, y todo lo demás cuelga de él. Romper el mundo es literalmente
        eso: una pasada sobre ese CSV.
      - **Preguntarlo en voz alta antes de pasar**: si los modelos son los
        mismos y el error sube, ¿de quién es la culpa?
      - `reparar` no es «deshacer»: **regenera el histórico desde cero** con la
        misma semilla. Por eso vuelve exacto y sirve de sonda.

  - id: s1-pregunta-reentrenar
    tipo: pregunta
    titulo: Una de las tres
    pregunta: >-
      De esas tres recetas —`seed`, `romper` y `reparar`—, ¿cuáles vuelven a
      entrenar los 192 modelos?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    respuesta: Solo seed, y solo la primera vez
    minutos: 3
    opciones:
      - Las tres
      - "`romper` y `reparar`, porque cambian los datos"
      - Solo seed, y solo la primera vez
      - Ninguna
    notas: |
      **Casi todos dicen que `reparar` reentrena.** Suena a que arregla los
      modelos, y no toca ninguno.
      - **La frase al revelar**: si los modelos no cambian nunca, todo lo que
        se mueve es el mundo. La tarde entera cuelga de ahí.
    solucion:
      explicacion: |
        **Solo `seed`, y solo la primera vez.** Las otras dos regeneran el
        histórico, vuelven a ejecutar el job con los modelos que ya estaban, y
        miden. Ni una línea de `entrenar`.

        Eso no es una simplificación del laboratorio: es lo que pasa en
        producción. El reentrenamiento es semanal o mensual y el mundo cambia
        cuando le da la gana, así que **casi todo el tiempo el modelo que está
        sirviendo se entrenó contra un mundo que ya no existe**.

        Guárdenlo, porque explica el resto del día: cada vez que algo se
        degrade esta tarde, los 192 artefactos van a ser exactamente los
        mismos de ahora.
      descartes:
        - opcion: Las tres
          razon: >-
            Sería lo cómodo y costaría minutos cada vez. Entrenar 192 modelos
            es el único paso lento de todo el laboratorio.
        - opcion: "`romper` y `reparar`, porque cambian los datos"
          razon: >-
            Cambian los datos y **por eso mismo** no reentrenan: el punto es
            ver qué le pasa a un modelo viejo cuando el mundo se mueve.
        - opcion: Ninguna
          razon: >-
            Alguien tuvo que entrenarlos: es el segundo paso de `seed`. Lo que
            no vuelve a ocurrir es el reentrenamiento.

  - id: s1-levantar
    tipo: comando-anotado
    titulo: Levantar el entorno
    entradilla: Esto es lo que hace make arriba, sin el atajo
    comando: docker compose up -d plataforma ui
    minutos: 3
    segmentos:
      - texto: docker compose
        explicacion: >-
          Lee `docker-compose.yml` y trabaja sobre los servicios declarados
          ahí. Con guion —`docker-compose`— es la versión 1, un binario
          aparte que ya no se instala; sin guion es el plugin actual. El
          Makefile detecta cuál tienes, para no obligar a nadie a
          reinstalar Docker el sábado por la mañana.
        otrosValores: ["docker-compose"]
      - texto: up
        explicacion: >-
          Levanta los servicios y los deja corriendo. Si falta la imagen,
          la construye antes. `make arriba` además fuerza un `build`
          previo, porque construye TRES imágenes y solo levanta dos: la del
          agente no es un servicio, y sin ese `build` su construcción le
          cae encima al alumno en plena clase.
        otrosValores: ["down", "ps", "logs", "build", "run"]
      - texto: "-d"
        explicacion: >-
          Detached. Devuelve la terminal en lugar de quedarse pegado a los
          logs. Sin esto, cerrar la ventana se lleva los servicios por
          delante. Para ver los logs después, `make logs`.
      - texto: plataforma ui
        explicacion: >-
          Qué servicios levantar, con el nombre que tienen en el YAML. Sin
          nombres levantaría todos los que no estén detrás de un `profile`
          — `mlflow` y `ollama` lo están, por eso hay que pedirlos aparte.
          Nombrar los dos deja claro que **`agente` no es un servicio**.
    notas: |
      Primer comando de Docker que muchos leen entero. **Ir despacio**, un
      segmento por paso.
      - Si preguntan por qué el agente no es un servicio: **no escucha nada**.
        Corre una vez al día, diagnostica y termina. Se ve en `--rm`, dos
        pantallas más adelante.

  - id: s1-seed
    tipo: comando-anotado
    titulo: Poblar el mundo
    entradilla: Y esto es make seed
    comando: docker compose run --rm plataforma python -m plataforma seed
    minutos: 3
    segmentos:
      - texto: run
        explicacion: >-
          Arranca un contenedor **nuevo** del servicio, le pasa un comando,
          y termina cuando el comando termina. Es lo contrario de `up`:
          `up` deja algo vivo escuchando, `run` ejecuta una tarea y se va.
          Por eso `make estado` nunca muestra nada de esto.
        otrosValores: ["up", "exec"]
      - texto: "--rm"
        explicacion: >-
          Borra el contenedor al terminar. Sin esto cada ejecución deja uno
          parado en disco, y a la décima `docker ps -a` es una lista de
          cadáveres. Se puede borrar el contenedor sin perder nada porque
          lo que se produce no vive en él: vive en el volumen `datos`.
      - texto: plataforma python
        explicacion: >-
          La costura de la línea. A la izquierda de ese espacio, el
          servicio tal como se llama en el YAML —de ahí salen la imagen,
          los volúmenes y las variables de entorno, sin repetir nada acá—;
          a la derecha, lo que se ejecuta **dentro** del contenedor. Todo
          lo que sigue ya no es de Docker.
        otrosValores: ["agente python", "ui python"]
      - texto: -m plataforma seed
        explicacion: >-
          `-m` corre un paquete de Python como si fuera un programa,
          buscando su `__main__.py`. `seed` es un subcomando de **ese**
          programa: hay también `datos`, `entrenar`, `pronosticar`,
          `metricas` y `escenario`, y cada uno tiene su atajo en el
          Makefile. `seed` encadena los cuatro primeros.
    notas: |
      **El segmento de `--rm` es el que más rinde.**
      - **Dejar que hagan la pregunta**: «si borras el contenedor, ¿dónde
        quedan los 192 modelos?». Es la puerta a los volúmenes.
      - En Windows esta línea se teclea igual: `.\taller.ps1` envuelve al
        `make`, no al `docker compose`.

  - id: s1-seed-salida
    tipo: salida-anotada
    titulo: Y esto es lo que imprime
    entradilla: Cuatro etapas, y las cuatro flechas del diagrama de arquitectura
    comando: docker compose run --rm plataforma python -m plataforma seed
    salida: |
      1/4 Generando historico de ventas...
      2/4 Entrenando la flota (192 modelos)...
        48/192 modelos entrenados...
        96/192 modelos entrenados...
        144/192 modelos entrenados...
        192/192 modelos entrenados...
      3/4 Corriendo el job batch de pronostico...
        17472 predicciones de 192 modelos
      4/4 Calculando metricas...

      Listo. 192 modelos con 17,472 dias-modelo de telemetria.
    minutos: 3
    anotaciones:
      - texto: "1/4 Generando historico"
        explicacion: >-
          Escribe `ventas.csv`. Es el mundo — cuatrocientos días de ventas
          inventados con una semilla fija, para que todos tengan el mismo.
          En producción esta etapa no existe: el mundo llega solo.
      - texto: "2/4 Entrenando la flota (192 modelos)"
        explicacion: >-
          Deja 192 artefactos en disco, uno por tienda y categoría. Corta
          91 días antes de hoy a propósito: lo que el modelo no llega a ver
          es exactamente contra lo que se lo va a evaluar.
      - texto: "3/4 Corriendo el job batch"
        explicacion: >-
          **Este es el job de madrugada del caso.** Carga los 192, proyecta
          los días que quedaron fuera del entrenamiento y escribe
          `predicciones.csv`. Cada ejecución deja además una fila en su
          bitácora: si corrió, cuánto tardó, si falló.
      - texto: "4/4 Calculando metricas"
        explicacion: >-
          Cruza predicción contra realidad. Es la **única** etapa que
          produce telemetría, y sin ella no hay absolutamente nada que
          monitorear. Todo el taller vive de este cruce.
      - texto: "17,472"
        explicacion: >-
          192 modelos × 91 días evaluados. Un dato por modelo y por día. Si
          a alguien le sale otro número, casi seguro dejó el mundo roto de
          una prueba anterior: `make reparar` y listo.
    notas: |
      **Recorrer las cuatro etapas señalando el diagrama de hace tres
      láminas: son sus cuatro flechas, en orden.**
      - En el `3/4`, la frase que rinde mañana: **el agente también vigila el
        job.** Un modelo sano y el pipeline caído desde el martes.
      - **Lo que tarda no es esto**: `seed` son 30 s. Los cinco minutos de la
        primera vez son de `make arriba` construyendo imágenes.

  - id: s1-glosario-pipeline
    tipo: glosario
    titulo: Y cuatro más, de lo que acaba de ejecutarse
    entradilla: Salieron en la pantalla de recién y se van a usar el resto del día
    minutos: 3
    terminos: [pipeline, telemetría, días-modelo, percentil]
    nuevos: [pipeline, telemetría, días-modelo, percentil]
    notas: |
      Las cuatro acaban de salir en pantalla sin explicarse.
      - **`días-modelo` es la que vale.** 17,472 no son filas ni modelos: es la
        unidad en que se cuenta observar una flota. Ante «tenemos poca
        telemetría», la pregunta es **cuántos días-modelo**.
      - **`percentil`** hace falta antes: sale en `latencia_p95_ms` (lámina
        siguiente) y en `sesgo_modelo_p90` mañana. No es un promedio: es un
        corte, y resiste los extremos que un promedio se traga.

  - id: s1-artefactos
    tipo: salida-anotada
    titulo: Los 192, en disco
    entradilla: Un archivo por modelo. Esto es lo que el job carga cada madrugada.
    comando: docker compose run --rm plataforma ls -la /datos/modelos | head
    minutos: 3
    salida: |
      total 860
      -rw-r--r--  1 root root  1025  dem-abarrotes-arequipa.joblib
      -rw-r--r--  1 root root  1025  dem-abarrotes-ate.joblib
      -rw-r--r--  1 root root  1025  dem-abarrotes-callao.joblib
      ...
      -rw-r--r--  1 root root 45123  registro.json

      $ ls /datos/modelos | wc -l
      193
      $ du -sh /datos/modelos
      856K
    anotaciones:
      - texto: "dem-abarrotes-arequipa.joblib"
        explicacion: >-
          **Un archivo por modelo**, y el nombre es el `modelo_id`:
          `dem-<categoria>-<tienda>`. Es el mismo identificador que va a
          aparecer en la telemetría, en la API y en todo lo que diga el agente.
      - texto: "1025  dem-abarrotes-ate.joblib"
        explicacion: >-
          Mil veinticinco bytes. Un modelo de pronóstico en producción son doce
          coeficientes y un intercepto — cabe en un tuit. La palabra
          «artefacto» suena a mucho más de lo que es.
      - texto: "registro.json"
        explicacion: >-
          El único que no es un modelo. Trae, por cada uno, su `version`, hasta
          qué día se entrenó y con qué `mape_validacion` quedó. **De acá sale
          el 10.4% que vamos a comparar contra el 13.8%** dentro de un rato.
      - texto: "193"
        explicacion: >-
          192 modelos más el registro. Si a alguien le sale 1, el entrenamiento
          se quedó a medias: `make seed` otra vez.
      - texto: "856K"
        explicacion: >-
          La flota entera. **Ochocientos cincuenta y seis kilobytes deciden qué
          se repone en 24 tiendas**, y no los mira nadie. Ese contraste es el
          taller.
    notas: |
      Convierte «artefacto» en algo que se puede listar. La palabra se usa las
      ocho horas y hasta acá no tenía imagen.
      - **Los dos números: 1 KB cada uno, 856 KB la flota entera.** Un modelo
        de pronóstico no es un modelo de lenguaje. Quien viene esperando
        gigabytes necesita oírlo.
      - Si preguntan qué hay dentro: los coeficientes de la Ridge. **No hace
        falta abrirlo hoy.**

  - id: s1-flota-pausa
    tipo: pausa-preguntas
    titulo: Pausa · ¿alguien se quedó bloqueado?
    minutos: 2
    disparadores:
      - ¿Alguien vio un número distinto de 17,472?
      - ¿Alguna imagen se quedó construyendo?
      - ¿Quedó alguna duda de qué hace `run --rm` que no sea `up`?
    notas: |
      **2 min, no cinco.** Acaban de teclear los dos comandos que el resto del
      taller da por hechos: si alguien se quedó atrás, saberlo **ahora**.
      - Los tres rescates vienen justo después. Si alguien levanta la mano con
        uno: «es la siguiente lámina».

  - id: s1-rescate-docker
    tipo: error-comun
    titulo: "Rescate · el motor no está corriendo"
    minutos: 2
    sintoma: >-
      open //./pipe/dockerDesktopLinuxEngine: The system cannot find the
      file specified
    causa: >-
      Docker Desktop está cerrado. El mensaje habla de un named pipe, que es
      el canal entre el cliente de Docker y su motor — y por eso no se
      parece en nada a "abre Docker".
    arreglo: >-
      Abrir Docker Desktop y esperar a que la ballena deje de moverse. Ojo
      con la trampa: `docker compose version` responde bien con Docker
      cerrado, porque contesta el cliente. Quien quiera comprobar de verdad
      que el motor está vivo, `docker info`.

  - id: s1-rescate-recarga
    tipo: error-comun
    titulo: "Rescate · el contenedor sirve el código con el que arrancó"
    minutos: 2
    sintoma: >-
      Un 404 en una ruta que está en el archivo. O la interfaz reventando
      por una columna que llega como texto. O un `git pull` que parece no
      haber hecho nada.
    causa: >-
      Tres síntomas distintos, un solo error: el proceso dentro del
      contenedor sigue ejecutando el código que había cuando arrancó, no el
      que hay ahora en disco.
    arreglo: >-
      Reiniciar el servicio. En este laboratorio ya está resuelto con
      `--reload` en uvicorn y con sondeo del sistema de archivos, que hace
      falta en Windows porque los avisos de cambio no cruzan el montaje.
    notas: |
      - Apareció **tres veces** preparando el taller, con tres caras distintas
        y el mismo error debajo.
      - **La pregunta que hay que enseñarles a hacerse**: «¿el proceso vio este
        archivo?».

  - id: s1-rescate-disco
    tipo: error-comun
    titulo: "Rescate · disco lleno a mitad de la construcción"
    minutos: 2
    sintoma: La construcción de las imágenes falla por espacio.
    causa: >-
      Las imágenes de este laboratorio ocupan del orden de 6 GB, y la caché
      de construcción otro tanto.
    arreglo: "`docker builder prune -f`, y dejar 12 GB libres antes de empezar."

  - id: s1-guia-fallas
    tipo: archivo
    titulo: "Guía 6 · Si algo falla"
    entradilla: Los tres rescates de recién, y otras diez. Seis solo de Windows.
    archivo: archivos/guias/06-si-algo-falla.pdf
    descripcion: >-
      Trece incidencias reales, con su síntoma y su arreglo: Docker, Windows,
      el agente sin llave y los datos. Ninguna es interesante por sí sola;
      juntas son la mitad del tiempo.
    minutos: 1
    notas: |
      **El momento de tener la guía de fallas es antes de fallar.**
      - Los tres rescates de recién son sus tres primeras entradas.
      - **Decir que la primera línea de la guía es `make verificar`**, y que es
        la respuesta a casi todo lo de hoy: esta hoja primero, la mano
        levantada después.

  - id: s1-mundo-crudo
    tipo: salida-anotada
    titulo: El mundo, por dentro
    entradilla: ventas.csv. Seis días de una tienda y una categoría, tal cual están en disco.
    comando: docker compose run --rm plataforma head -1 /datos/ventas.csv  ·  y seis filas de agosto
    minutos: 4
    salida: |
      fecha,tienda,region,categoria,unidades,unidades_demandadas,en_promocion,quiebre_stock
      2026-08-02,miraflores,LIMA,lacteos,659.17,659.17,0,0
      2026-08-03,miraflores,LIMA,lacteos,606.0,606.0,0,0
      2026-08-04,miraflores,LIMA,lacteos,581.89,581.89,0,0
      2026-08-05,miraflores,LIMA,lacteos,494.94,494.94,0,0
      2026-08-06,miraflores,LIMA,lacteos,271.42,396.01,0,1
      2026-08-07,miraflores,LIMA,lacteos,571.04,571.04,0,0
    anotaciones:
      - texto: "2026-08-02,miraflores,LIMA,lacteos,659.17,659.17,0,0"
        explicacion: >-
          Una fila por tienda, categoría y día. 24 × 8 × 400 días = **76,800
          filas**, y son dos años de historia. Este archivo es *el mundo*: lo
          único que el laboratorio inventa, y lo único que se toca para provocar
          cada fallo de esta tarde.
      - texto: "unidades,unidades_demandadas"
        explicacion: >-
          **Dos columnas y no una, y esa es la lámina.** `unidades` es lo que se
          vendió; `unidades_demandadas` es lo que se habría vendido con
          estantería llena. Casi siempre son el mismo número.
      - texto: "2026-08-06,miraflores,LIMA,lacteos,271.42,396.01,0,1"
        explicacion: >-
          **Salvo este día.** Se vendieron 271 y se querían 396: faltó producto.
          La venta observada no es la demanda, está **topada por el almacén**, y
          esa diferencia de 125 unidades no la sabe nadie aguas abajo.
      - texto: "quiebre_stock"
        explicacion: >-
          Y sin embargo el mundo **sí lo sabe**: la última columna lo dice, en
          crudo, con un 1. Guárdenla. El domingo, a las 12:30, va a ser la
          señal que decide si el agente hace daño o no — y para entonces
          seguirá ahí, sin que nadie la haya mirado.
      - texto: "en_promocion"
        explicacion: >-
          La otra bandera del día, y es la que el modelo **sí** usa: es una de
          las doce features. Compárenla con la de al lado — las dos están acá,
          y solo una llega hasta el modelo.
    notas: |
      El archivo del que sale todo lo demás. Se nombró cinco veces sin enseñar
      una fila.
      - **La lámina existe por la cuarta anotación. Despacio, y sin adelantar
        el final**: `quiebre_stock` **está en el mundo**. El dato existe; se
        pierde entre acá y la telemetría que el agente mira.
      - Sembrarlo ahora hace que el cierre del reto 5 sea una decisión de
        instrumentación y no una queja.
      - Si preguntan cuántos días: **861 de 76,800, un 1.1%.** Poco, y basta
        para arruinar un reentrenamiento.
      - Para quien venga de datos: **la venta observada no es la demanda.**

  - id: s1-telemetria
    tipo: modelo-datos
    titulo: Qué emite la flota
    entradilla: Una fila por modelo y por día. Esto es todo lo que el agente va a poder mirar.
    minutos: 3
    tablas:
      - nombre: metricas
        descripcion: >-
          El resultado de cruzar lo que se pronosticó contra lo que
          realmente se vendió.
        columnas:
          - { nombre: fecha, tipo: date }
          - { nombre: modelo_id, tipo: text, nota: "dem-{categoria}-{tienda}" }
          - { nombre: categoria, tipo: text }
          - { nombre: tienda, tipo: text }
          - { nombre: region, tipo: text, nota: LIMA, NORTE, SUR, CENTRO, ORIENTE }
          - { nombre: n, tipo: int, nota: días que entraron en el cálculo }
          - { nombre: mape, tipo: float, nota: cuánto se equivoca }
          - { nombre: sesgo_pct, tipo: float, nota: hacia qué lado }
          - { nombre: cobertura, tipo: float, nota: qué tanto acierta el intervalo }
          - { nombre: latencia_p95_ms, tipo: int }
          - { nombre: unidades_reales, tipo: float }
          - { nombre: unidades_pronosticadas, tipo: float }
          - { nombre: dias_en_promocion, tipo: int }
          - { nombre: dias_con_quiebre, tipo: int }
    notas: |
      - **Señalar que `unidades_reales` y `unidades_pronosticadas` están además
        de los porcentajes.** No es redundancia: sin unidades no se agrega bien.
      - **El porqué es el reto 2. NO adelantarlo.**

  - id: s1-metricas-definidas
    tipo: markdown
    titulo: "MAPE: cuánto se equivoca"
    minutos: 2
    contenido: |
      El error porcentual absoluto medio. Para cada día se toma la
      diferencia entre lo pronosticado y lo vendido, en valor absoluto, y se
      divide entre lo vendido. El promedio de eso.

      **Es una distancia, no una dirección.** Un modelo que se pasa por 10
      unidades y otro que se queda corto por 10 tienen exactamente el mismo
      MAPE.

      Es la métrica que todo el mundo mira, y es la única de las tres que
      casi siempre está en el tablero.
    notas: |
      - **Insistir en «valor absoluto».** De ahí sale toda la unidad siguiente.

  - id: s1-sesgo
    tipo: comparacion
    titulo: "Sesgo: hacia qué lado se equivoca"
    entradilla: La misma resta, sin el valor absoluto
    minutos: 4
    izquierda:
      titulo: MAPE
      contenido: >-
        Promedio de |pronóstico − real| ÷ real. Siempre positivo. Dice qué
        tan lejos cae el modelo, y nada más.
    derecha:
      titulo: Sesgo
      contenido: >-
        Promedio de (pronóstico − real) ÷ real. Con signo. Positivo
        significa que el modelo pronostica de más — y pronosticar de más
        durante tres semanas es inventario que alguien compró y nadie
        vendió.
    notas: |
      **La frase que sostiene el taller**: el MAPE puede quedarse quieto
      mientras el sesgo se dispara.
      - Es el modo de falla más caro, y **ningún umbral sobre el MAPE lo
        detecta**.
      - **NO dar los números todavía** — son del reto 1.

  - id: s1-intervalo
    tipo: codigo
    titulo: De dónde sale el intervalo
    entradilla: Dos líneas del job, y lo que la cobertura mide de verdad
    lenguaje: python
    ruta: plataforma/pronosticar.py
    numeros: ["83-84", "106-108"]
    minutos: 3
    contenido: |2
              # Error historico del modelo, para construir el intervalo.
              sigma = max(1.0, float(df["unidades"].tail(90).std() or 1.0)) * 0.6
                          "prediccion": round(float(max(0.0, p)), 2),
                          "limite_inferior": round(float(max(0.0, p - 1.96 * sigma)), 2),
                          "limite_superior": round(float(p + 1.96 * sigma), 2),
    notas: |
      **Nombrar el 1.96**: el ancho de una normal que deja el 95% en medio.
      Con sigma a 0.6 cubre ~90%.
      - **La promesa del modelo**: «la venta cae aquí dentro nueve de cada diez
        días». La cobertura mide **cuántas veces esa promesa se cumplió** — no
        cuántos días hubo predicción.
      - Sigma sale de los últimos 90 días: quien vende parejo tiene intervalo
        estrecho. **No premia al que se cubre.**
      - Si la sala va rápida, lanzar la pregunta **antes** de esta lámina.

  - id: s1-pregunta-cobertura
    tipo: pregunta
    titulo: Antes de verlo
    pregunta: >-
      Un modelo publica intervalos de predicción al 90%. Midiendo los
      últimos 14 días, la realidad cae dentro del intervalo el 97% de las
      veces. ¿Qué está pasando?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    respuesta: El modelo se está cubriendo las espaldas
    minutos: 3
    opciones:
      - El modelo está muy bien calibrado
      - El modelo se está cubriendo las espaldas
      - Faltan datos para decirlo
      - El intervalo está mal calculado
    notas: |
      - **Se pregunta ANTES de explicarla, a propósito.**
      - **Dejar que se equivoquen**: gana la primera opción casi siempre, y
        equivocarse acá es lo que hace que la explicación se quede.
    solucion:
      explicacion: |
        **97% de cobertura en un intervalo del 90% no es estar mejor: es
        estar peor.** El modelo prometió acertar 9 de cada 10 veces y
        acierta 9.7 — porque abrió el intervalo más de lo necesario.

        Un intervalo que casi nunca falla es un intervalo tan ancho que no
        sirve para decidir nada. "Entre 40 y 400 unidades" nunca se
        equivoca, y nunca ayuda a reponer.

        Lo que se busca es cobertura **cerca** del nominal, por arriba o por
        abajo. Alejarse hacia arriba es tan síntoma como alejarse hacia
        abajo, y es el que nadie mira porque suena a buena noticia.
      descartes:
        - opcion: El modelo está muy bien calibrado
          razon: >-
            Calibrado sería 90%. 97% es siete puntos de más, y en un tablero
            pintado de verde eso pasa por excelencia.
        - opcion: Faltan datos para decirlo
          razon: >-
            Catorce días de 192 modelos son 2,688 observaciones. La duda
            razonable acá no es de tamaño de muestra.
        - opcion: El intervalo está mal calculado
          razon: >-
            Puede estarlo, pero no hace falta suponerlo: un intervalo bien
            calculado sobre un modelo inseguro da exactamente esto.

  - id: s1-cobertura
    tipo: markdown
    titulo: "Cobertura: la que casi todos leen mal"
    minutos: 2
    contenido: |
      Cada predicción viene con un intervalo. La cobertura es **qué
      fracción de los días la venta real cayó dentro de ese intervalo**.

      No es el porcentaje de días con predicción disponible. No es cuántos
      modelos corrieron. Es cuántas veces el modelo dijo la verdad sobre su
      propia incertidumbre.

      Una cobertura que se desploma es un modelo que dejó de saber lo que
      no sabe — y eso suele pasar antes de que el MAPE se mueva.
    notas: |
      - **Preguntar qué creen que mide antes de decirlo.**
      - La confusión con «días con predicción disponible» es tan común que
        conviene que salga de ellos.

  - id: s1-glosario-senales
    tipo: glosario
    titulo: Las tres señales, y lo que cada una no dice
    entradilla: Las tres se leen mal de tres maneras distintas
    minutos: 2
    terminos: [MAPE, sesgo, cobertura]
    nuevos: [MAPE, sesgo, cobertura]
    notas: |
      **La lámina de referencia de las ocho horas.**
      - **Lo que agrega son los tres «ojo»**: las tres formas de leer mal la
        telemetría, y cada una es un reto. MAPE que no se entera = reto 1;
        sesgo promediado = trampa 1 del reto 2; cobertura al revés = la
        pregunta de hace un minuto.
      - **Decir en voz alta que el glosario está siempre ahí**, botón abajo a
        la derecha.

  - id: s1-guia-telemetria
    tipo: archivo
    titulo: "Guía 2 · Leer la telemetría"
    entradilla: Las tres señales que acabamos de ver, con sus tres formas de leerlas mal
    archivo: archivos/guias/02-leer-la-telemetria.pdf
    descripcion: >-
      Qué emite la flota, qué dice cada señal, y los cuatro números del mundo
      sano contra los que se lee todo lo demás: 13.8%, +0.8%, 88.7%, 8 de 192.
    minutos: 1
    notas: |
      **«Esta es la que hay que tener abierta el resto del sábado.»**
      - Su última página trae los cuatro números del mundo sano. Quien no los
        anotó, los tiene ahí.
      - Es la que rescata al que llegue tarde al reto 1.

  - id: s1-demo-ui
    tipo: demo
    titulo: La flota, de un vistazo
    entradilla: "Pestaña «La flota». Es la única de las cuatro que se abre hoy."
    minutos: 4
    pasos:
      - comando: docker compose up -d ui
        esperado: "abre http://localhost:8501 · pestaña «La flota»"
      - comando: docker compose ps
        esperado: plataforma y ui, corriendo. El agente no aparece.
    observar: >-
      **Pestaña «La flota», y nada más**: las otras tres están vacías hasta
      mañana. Arriba, «MAPE por categoria»; abajo, la tabla de 192 filas.
      **Ordenar por `mape` y ver que hay modelos malos que llevan meses siendo
      malos** sin que nadie los toque. Después **ordenar por `sesgo_pct`: no
      sale la misma lista.** Esa diferencia es el taller entero.
    respaldo: >-
      Si la interfaz no levanta, la misma información sale por la API:
      `curl -s localhost:8000/v1/metricas | head`. Y si tampoco, seguir con
      el diagrama: nada de lo que viene depende de haber visto esta
      pantalla.
    notas: |
      **5 min, no diez.** La tentación es analizar acá, y el análisis es el
      reto 1.
      - **Hacer el `docker compose ps` en vivo**: la ui y la plataforma están
        porque se levantaron con `up -d`; de los `run --rm` no queda rastro.
        **Uno deja algo vivo, el otro ejecuta y desaparece.**
      - Se apagan con `make abajo`. **Sin `-v`** — esa borra los volúmenes y
        con ellos los 192 modelos.

  - id: s1-ui-captura
    tipo: imagen
    titulo: Lo que se ve, si todo levantó
    entradilla: La misma pantalla, capturada. Sirve de respaldo y de referencia.
    archivo: img/ui-flota-sana.png
    pie: >-
      192 modelos, 17,472 días-modelo, MAPE medio 13.8%, sesgo +0.8%,
      cobertura 88.7%. Es el mundo sano, y es contra estos cuatro números
      que se van a leer todos los demás.
    minutos: 2
    notas: |
      **Respaldo de la demo anterior.** Si la ui no levantó, esta lámina es la
      clase.
      - **Que anoten: 13.8, +0.8, 88.7.** Todo lo que viene es «cómo se movió
        esto».
      - El gráfico plano es a propósito. **En el reto 5 vuelve, y no está
        plano.**

  - id: s1-inventario
    tipo: salida-anotada
    titulo: La misma flota, como la lee un agente
    entradilla: listar_modelos — el inventario, antes de cualquier diagnóstico
    comando: → listar_modelos()
    minutos: 4
    salida: |
      {
        "total_modelos": 192,
        "por_categoria": {
          "abarrotes": 24, "bebidas": 24, "carnes": 24, "congelados": 24,
          "cuidado-personal": 24, "lacteos": 24, "limpieza": 24,
          "panaderia": 24
        },
        "por_region": {
          "LIMA": 112, "NORTE": 32, "SUR": 32, "CENTRO": 8, "ORIENTE": 8
        },
        "entrenados_hasta": "2026-05-08",
        "mape_validacion_medio": 10.382
      }
    anotaciones:
      - texto: '"total_modelos": 192'
        explicacion: >-
          Ocho categorías por veinticuatro tiendas. Es **la misma pantalla de
          hace un minuto**, en el objeto que un agente sí puede leer: la
          interfaz tiene 192 filas y esto tiene doce líneas. Dicen lo mismo, y
          solo uno de los dos cabe en un prompt.
      - texto: '"LIMA": 112'
        explicacion: >-
          Las regiones no son parejas y no es un descuido: LIMA tiene 112
          modelos, CENTRO y ORIENTE tienen ocho cada una. Guardarlo — en el
          reto 2 esta desigualdad decide un umbral.
      - texto: '"entrenados_hasta": "2026-05-08"'
        explicacion: >-
          Tres meses. Ningún modelo de esta flota ha vuelto a entrenarse desde
          mayo, y así es como se ven casi todas las flotas reales. El modelo no
          se entera de que pasó el tiempo; la telemetría sí.
      - texto: '"mape_validacion_medio": 10.382'
        explicacion: >-
          **Acá está la brecha, en dos números.** El día que se entrenaron se
          equivocaban 10.4%. Hoy, en producción, 13.8% — el número de la
          lámina anterior. Nadie rompió nada: es el mundo alejándose del día
          del entrenamiento.
    notas: |
      **Primera herramienta del agente que ve la clase**, y todavía no hay
      agente: se lee como lo que es, una función. Mañana la llama un LLM y no
      cambia nada.
      - **La comparación en voz alta: 10.4 contra 13.8.**
      - Si preguntan «¿por qué no reentrenar y ya?»: reentrenar sobre datos que
        no se entienden repite el problema con números nuevos. **Es el freno
        del reto 5.**
      - `mape_validacion_medio` sale del registro, no de la telemetría.

  - id: s1-validacion
    tipo: codigo
    titulo: Y de dónde salía ese 10.4%
    entradilla: Las últimas cuatro semanas, apartadas antes de entrenar
    lenguaje: python
    ruta: plataforma/entrenar.py
    numeros: ["115", "119-125"]
    resaltar: ["3-6"]
    minutos: 3
    contenido: |2
              df = construir_features(serie).dropna(subset=COLUMNAS)

              # Ultimas 4 semanas como validacion.
              corte = len(df) - 28
              X_tr, y_tr = df[COLUMNAS].iloc[:corte], df["unidades"].iloc[:corte]
              X_va, y_va = df[COLUMNAS].iloc[corte:], df["unidades"].iloc[corte:]

              modelo = Ridge(alpha=alpha).fit(X_tr, y_tr)
              mape_val = _mape(y_va, pd.Series(modelo.predict(X_va), index=y_va.index))
    notas: |
      **El corte es por tiempo y no al azar. Esa es la lámina.** Repartir al
      azar una serie temporal entrena con días posteriores a los que evalúa: el
      modelo vio el futuro.
      - Por eso el **10.4% es honesto**: se equivocaba así en días que no había
        visto. Hoy va por 13.8%. **La diferencia son tres meses de mundo**, no
        un error de nadie.
      - `Ridge` penaliza coeficientes grandes: con doce features
        correlacionadas, una regresión pelada se vuelve inestable.
      - **Decirlo: se entrena con scikit-learn, con el `.fit()` de cualquier
        cuaderno.**

  - id: s1-pausa-fabrica
    tipo: pausa-preguntas
    titulo: Pausa · antes de ver cómo se fabrican
    minutos: 3
    disparadores:
      - ¿Quedó claro por qué el 10.4% y el 13.8% son comparables?
      - ¿Alguien aparta su conjunto de validación por tiempo, o lo reparte al azar?
      - ¿Cada cuánto se reentrena en donde trabajan? ¿Y quién lo decide?
    notas: |
      **3 min** · última ventana barata antes de cinco láminas seguidas sobre
      cómo se fabrica un modelo.
      - **La segunda es la que rinde**: repartir una serie temporal al azar. En
        una sala de veinte siempre hay dos o tres que lo hacen sin saberlo.
      - La tercera engancha con el reto 5: quien dice «cada mes» ya entendió
        que el modelo sirve contra un mundo que ya no existe.

  - id: s1-guardar
    tipo: codigo
    titulo: Y así se guarda un modelo entrenado
    entradilla: Una línea. Lo demás de esta lámina es el registro, que es lo que se vuelve caro.
    lenguaje: python
    ruta: plataforma/entrenar.py
    numeros: ["127-129", "146-154"]
    resaltar: ["4"]
    minutos: 4
    contenido: |2
              ruta = RUTA_MODELOS / f"{m['modelo_id']}.joblib"
              joblib.dump(modelo, ruta)

              registro.append(
                  {
                      **m,
                      "version": previo.get(m["modelo_id"], {}).get("version", 0) + 1,
                      "entrenado_hasta": hasta.isoformat(),
                      "mape_validacion": round(mape_val, 3),
                      "artefacto": str(ruta),
                  }
              )
    notas: |
      **`joblib.dump(modelo, ruta)` es toda la persistencia.** Decirlo despacio:
      «artefacto» suena mucho más ceremonioso de lo que es.
      - **La `version` no se pone: se hereda y se incrementa.** Es la línea que
        convierte una carpeta de archivos en un registro de modelos.
      - Los modelos que **no** se tocan conservan su versión y su fecha: un
        `--categoria bebidas` reentrena 24 y deja 168 con su edad. **Las flotas
        reales conviven con modelos de distinta edad.**
      - El `mape_validacion` de acá **es el 10.4% de hace dos láminas.**

  - id: s1-entrenar
    tipo: comando-anotado
    titulo: Reentrenar, y solo eso
    entradilla: La etapa 2/4 del seed, corrida sola. Es el único paso que cambia un artefacto.
    comando: docker compose run --rm plataforma python -m plataforma entrenar
    minutos: 4
    segmentos:
      - texto: entrenar
        explicacion: >-
          Uno de los seis subcomandos de la plataforma, y el único que
          **escribe en `modelos/`**. Los demás tocan el histórico o la
          telemetría; este toca los artefactos. `make entrenar` es su atajo.
        otrosValores: ["datos", "escenario", "pronosticar", "metricas", "seed"]
    notas: |
      **El único comando de las ocho horas que cambia un modelo.** Hasta acá
      solo se vio escondido dentro de `seed`, como el `2/4`.
      - Suelto enseña dos cosas: **cuánto tarda de verdad** (por eso `romper` y
        `reparar` no lo incluyen) y que **la `version` sube en uno**.
      - Acepta los filtros de `escenario`: `--categoria bebidas` toca 24 y deja
        168. **Es lo que el agente va a pedir el domingo.**

  - id: s1-entrenar-salida
    tipo: salida-anotada
    titulo: Y lo que deja
    entradilla: La misma flota, una versión más vieja
    comando: docker compose run --rm plataforma python -m plataforma entrenar
    minutos: 3
    salida: |2
        48/192 modelos entrenados...
        96/192 modelos entrenados...
        144/192 modelos entrenados...
        192/192 modelos entrenados...
      Flota entrenada: 192 modelos hasta 2026-05-08

      # y en el registro, antes y despues:
      "version": 1   ->   "version": 2
      "entrenado_hasta": "2026-05-08"   (igual)
    anotaciones:
      - texto: "Flota entrenada: 192 modelos hasta 2026-05-08"
        explicacion: >-
          **La fecha no se movió, y eso es lo raro de la lámina.** Reentrenar no
          adelanta el corte: el modelo se vuelve a ajustar contra el mismo
          histórico, que llega hasta el 8 de mayo porque los 91 días siguientes
          están apartados para evaluarlo. Reentrenar no es lo mismo que tener
          datos nuevos.
      - texto: '"version": 1   ->   "version": 2'
        explicacion: >-
          Lo único que cambió de verdad. Es la evidencia de que el comando hizo
          algo: los `.joblib` pesan lo mismo, se llaman igual y tienen otra
          marca de tiempo. **El registro es el que lleva la cuenta.**
    notas: |
      **La primera anotación es la que enseña, y sorprende**: se reentrena y el
      modelo sigue sin saber nada de julio.
      - **Un reentrenamiento arregla el ajuste, no la ignorancia.** Para eso
        hacen falta datos nuevos.
      - Para comprobarlo: `ls -l /datos/modelos | head` antes y después. Mismo
        nombre, mismo tamaño, otra hora.

  - id: s1-pregunta-reentrenar-arregla
    tipo: pregunta
    titulo: Y entonces, ¿qué arregla reentrenar?
    pregunta: >-
      Acabamos de reentrenar los 192 y `entrenado_hasta` sigue diciendo
      2026-05-08. Si hoy un modelo se está equivocando porque el mundo cambió
      en julio, ¿reentrenarlo así lo arregla?
    visibilidad: publica
    segundos: 45
    permiteOmitir: true
    respuesta: No, porque sigue sin ver julio
    minutos: 3
    opciones:
      - Sí, para eso está reentrenar
      - No, porque sigue sin ver julio
      - Solo si se cambia el algoritmo
      - Depende de cuántas veces se reentrene
    notas: |
      **30 s.** Va acá porque la lámina anterior dejó el dato raro en pantalla:
      la fecha no se movió.
      - **La consecuencia, al revelar**: el reto 5 va a recomendar reentrenar,
        y eso solo sirve si además llegan datos nuevos.
    solucion:
      explicacion: |
        **No, porque sigue sin ver julio.** El corte de entrenamiento está en
        el 8 de mayo y los 91 días siguientes están apartados a propósito: son
        contra lo que se evalúa la flota. Reentrenar vuelve a ajustar los
        coeficientes **contra el mismo histórico**.

        Reentrenar arregla el ajuste, no la ignorancia. Para que un
        reentrenamiento sirva de verdad hacen falta **datos nuevos** — y en
        producción esa es justo la parte que se olvida: se programa el
        reentrenamiento semanal y nadie comprueba que la ventana de datos
        avance con él.

        Guárdenlo para mañana. En el reto 5 el agente va a recomendar
        «reentrenar la categoría», y la pregunta que hay que hacerle a esa
        recomendación es siempre la misma: *¿contra qué datos?*
      descartes:
        - opcion: Sí, para eso está reentrenar
          razon: >-
            Es lo que todo el mundo asume, y por eso la lámina anterior deja la
            fecha a la vista. Reentrenar sin datos nuevos reajusta lo mismo.
        - opcion: Solo si se cambia el algoritmo
          razon: >-
            Cambiar de algoritmo es otra conversación, y tampoco resuelve
            ésta: un modelo mejor sobre los mismos datos sigue sin saber qué
            pasó en julio.
        - opcion: Depende de cuántas veces se reentrene
          razon: >-
            Reentrenar cien veces sobre el mismo histórico da cien veces el
            mismo modelo. Lo que falta no es repetición, son datos.

  # MLflow llevaba toda la tarde nombrándose —el diagrama, la tabla de capas,
  # la de atajos— y lo único que se decía de él era «el del Módulo 2». Eso no
  # es abrir el vocabulario (§18): quien no hizo ese módulo, o lo hizo hace
  # tres meses, llega a la demo sin saber qué está mirando. Estas tres láminas
  # son lo que faltaba: qué resuelve, cómo se llaman sus piezas, y cómo encajan.
  - id: s1-glosario-mlflow
    tipo: glosario
    titulo: Cuatro palabras antes de abrir MLflow
    entradilla: Son las que salen en pantalla dentro de dos láminas. Sin ellas la interfaz no se lee.
    minutos: 3
    terminos: [MLflow, experimento, run, parámetro contra métrica]
    nuevos: [MLflow, experimento, run, parámetro contra métrica]
    notas: |
      **Las dos que de verdad hay que dejar puestas son `run` y la última.**
      - **`run` = ejecución = una fila de la tabla que van a ver.** Y no es un
        modelo: es la ficha de haberlo entrenado.
      - **Parámetro contra métrica es la distinción que hace útil el registro.**
        Sin ella la interfaz es una tabla más.
      - Si alguien viene del Módulo 2: es exactamente lo mismo, con 192 runs.

  - id: s1-que-es-mlflow
    tipo: comparacion
    titulo: Qué es MLflow, y qué problema resuelve
    entradilla: El problema no es entrenar. Es acordarse, tres meses después, de con qué se entrenó.
    minutos: 4
    izquierda:
      titulo: Sin registro
      contenido: |
        Se entrena, sale un `.joblib`, y el archivo no sabe nada de sí mismo:

        ```
        /datos/modelos/dem-bebidas-miraflores.joblib
        ```

        ¿Con qué `alpha`? ¿Hasta qué fecha? ¿Qué error dio el día que se
        entrenó? **Está en la cabeza de quien lo corrió**, o en un Excel.

        Y cuando en agosto el modelo falla, la pregunta que no se puede
        responder es la única que importa: *¿venía fallando o lo rompimos
        nosotros?*
      titulo_alt: Sin él
    derecha:
      titulo: Con registro
      contenido: |
        Quince líneas dentro del mismo bucle de entrenamiento, y cada uno de
        los 192 queda con su ficha:

        ```
        alpha            1.0
        algoritmo        Ridge
        entrenado_hasta  2026-05-08
        mape_validacion  12.607
        ```

        **Ahora sí se puede ordenar por error, filtrar por categoría y
        comparar la corrida de hoy con la del mes pasado.**

        Cuesta quince líneas y no cambia el modelo en nada.
    notas: |
      **La idea que se llevan: un modelo sin su ficha es irreproducible**, y
      eso no se nota hasta que falla.
      - **Es la misma idea del `Makefile`**, aplicada al entrenamiento: la
        documentación que se escribe sola es la única que sobrevive.
      - Si sale «¿y no basta con un CSV?»: sí, y de hecho el laboratorio tiene
        uno —`registro.json`—. Lo que da MLflow encima es la **interfaz** para
        ordenar y comparar 192 filas sin escribir código.
      - No prometer más: **acá no se usa el Model Registry** (versiones,
        promoción a producción). Solo el seguimiento.

  - id: s1-mlflow-arbol
    tipo: codigo
    titulo: Cómo se ordena por dentro
    entradilla: No hay base de datos. Es una carpeta, y la jerarquía se ve tal cual.
    lenguaje: text
    minutos: 4
    contenido: |
      /datos/mlruns/
      └── 153427446901588698/            ← EXPERIMENTO · meta.yaml dice
          │                                 name: pronostico-demanda
          ├── meta.yaml
          ├── 003e2e01c1a44ae0.../        ← RUN · uno de 192, uno por modelo
          │   ├── meta.yaml                  start_time, end_time, run_id
          │   ├── params/                 ← ocho archivos, uno por parámetro
          │   │   ├── algoritmo              Ridge
          │   │   ├── alpha                  1.0
          │   │   └── entrenado_hasta        2026-05-08
          │   ├── metrics/
          │   │   └── mape_validacion     ← 1786210591427  12.607  0
          │   │                              (cuándo · cuánto · paso)
          │   ├── tags/
          │   │   └── mlflow.runName         dem-congelados-trujillo
          │   └── artifacts/              ← vacía, y a propósito: el .joblib
          │                                 se escribe en /datos/modelos
          └── … 191 más
    notas: |
      **Un experimento es una carpeta y un run es una subcarpeta.** Mirarlo
      cuesta menos que explicarlo.
      - **Un parámetro es un archivo con un valor dentro; una métrica, uno con
        fecha, valor y paso.** Por eso una métrica puede tener muchas líneas y
        un parámetro no: la distinción entera está en el formato.
      - **`artifacts/` vacía va a salir.** MLflow *puede* guardar el modelo
        dentro del run; acá manda `/datos/modelos` porque el job tiene que
        cargar los 192 sin MLflow levantado.
      - El número largo lo pone MLflow; el nombre vive en su `meta.yaml`.
      - Verlo en vivo: `make archivos ARGS="--ver mlruns"`.

  - id: s1-mlflow-registro
    tipo: codigo
    titulo: Y cada entrenamiento queda registrado
    entradilla: Ocho parámetros y una métrica, por modelo. Esto es MLflow, el del Módulo 2.
    lenguaje: python
    ruta: plataforma/entrenar.py
    numeros: ["130-144"]
    minutos: 3
    contenido: |2
              if mlflow is not None:
                  with mlflow.start_run(run_name=m["modelo_id"]):
                      mlflow.log_params(
                          {
                              "modelo_id": m["modelo_id"],
                              "categoria": m["categoria"],
                              "tienda": m["tienda"],
                              "region": m["region"],
                              "algoritmo": "Ridge",
                              "alpha": alpha,
                              "entrenado_hasta": hasta.isoformat(),
                              "n_entrenamiento": len(X_tr),
                          }
                      )
                      mlflow.log_metric("mape_validacion", mape_val)
    notas: |
      **Nombrarlo: acá vuelve el Módulo 2.** Misma herramienta, mismo trabajo,
      dentro de un caso que ya conocen.
      - **La distinción que vale: parámetro contra métrica.** Parámetro es lo
        que decidiste antes de entrenar; métrica es lo que salió. Los primeros
        se filtran, las segundas se comparan.
      - `log_metric("mape_validacion", ...)` **es el 10.4% otra vez**, tercera
        aparición y ya en su sitio.
      - El `if mlflow is not None`: **un registro no debe poder tumbar un
        entrenamiento.**

  # El tramo de MLflow son cinco láminas seguidas de exposición. Esta pregunta
  # es el respiro, y comprueba lo único que hay que llevarse: si `alpha` y el
  # MAPE parecen la misma clase de cosa, la interfaz de la lámina siguiente no
  # se va a poder leer.
  - id: s1-pregunta-mlflow
    tipo: pregunta
    titulo: Parámetro o métrica
    pregunta: >-
      De estos cuatro, ¿cuál es una MÉTRICA y no un parámetro?
    minutos: 3
    opciones:
      - alpha = 1.0
      - algoritmo = Ridge
      - mape_validacion = 12.607
      - entrenado_hasta = 2026-05-08
    respuesta: mape_validacion = 12.607
    solucion:
      explicacion: |
        **La regla de bolsillo: si lo escribiste tú antes de ejecutar, es
        parámetro; si lo escribió el programa después, es métrica.**

        Y de ahí sale para qué sirve cada uno. Por los parámetros se
        **filtra** —«enséñame los Ridge con alpha 1.0»—; por las métricas se
        **ordena y se compara**, que es lo que se va a hacer en la lámina
        siguiente con los 192 a la vez.
      razones:
        - opcion: alpha = 1.0
          razon: >-
            Lo elegiste **antes** de entrenar. Es una decisión, no un
            resultado: se filtra por él, no se compara.
        - opcion: algoritmo = Ridge
          razon: >-
            Igual: una decisión tomada antes. Podría haber sido otra, y el
            registro sirve justo para poder comparar las dos.
        - opcion: mape_validacion = 12.607
          razon: >-
            **Es lo único que no decidiste: salió.** Por eso lleva fecha y
            puede medirse muchas veces, y por eso se ordena por esta columna.
        - opcion: entrenado_hasta = 2026-05-08
          razon: >-
            Suena a resultado porque es una fecha, pero es el **corte que
            elegiste** para separar entrenamiento de validación.
    notas: |
      **La trampa es la última**, y es la que enseña: parece resultado por ser
      fecha, y es una decisión.
      - Si gana `mape_validacion` cómodo, seguir. **Si se reparten, volver una
        lámina**: la interfaz siguiente no se lee sin esto.
      - **La regla de bolsillo**: si lo escribiste tú antes de ejecutar, es
        parámetro; si lo escribió el programa después, es métrica.

  - id: s1-mlflow-compose
    tipo: codigo
    titulo: Cómo se levanta, y por qué no está levantado
    entradilla: El servicio de MLflow en docker-compose.yml. Es la primera vez que abrimos este archivo.
    lenguaje: yaml
    ruta: docker-compose.yml
    numeros: ["62-72"]
    resaltar: ["4", "5"]
    minutos: 3
    contenido: |2
        # Registro de modelos. Opcional: docker compose --profile mlflow up -d mlflow
        mlflow:
          build:
            context: .
            dockerfile: plataforma/Dockerfile
          profiles: ["mlflow"]
          command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///datos/mlruns
          ports:
            - "5000:5000"
          volumes:
            - datos:/datos
    notas: |
      **El archivo que lleva toda la tarde detrás de cada comando, sin
      abrirse.** De un bloque como este salen imagen, puertos y volúmenes.
      - **`profiles: ["mlflow"]` es por qué `make arriba` no lo levanta**: con
        perfil, solo arranca si se lo pides por su nombre. Igual que `ollama`.
      - **MLflow no tiene base de datos acá**: lee una carpeta del mismo volumen
        `datos`. Por eso ve todo lo entrenado antes.
      - Si preguntan por el Dockerfile: `mlflow` ya está en sus dependencias.

  # Acá ya se han nombrado los tres puertos por separado —:8000 en la API,
  # :8501 en la interfaz, :5000 recién—, y nunca juntos. Esta lámina cierra
  # ese hilo: qué escucha en cada uno, y de dónde lee. Es la otra mitad del
  # mapa: arriba los comandos de usar y tirar, acá lo que se queda encendido.
  - id: s1-servicios-puertos
    tipo: codigo
    titulo: Y lo que se queda encendido
    entradilla: Los de arriba corren y mueren. Estos tres se levantan y esperan, cada uno en su puerto.
    lenguaje: text
    minutos: 4
    contenido: |
      make arriba  →  docker compose build
                      docker compose up -d plataforma ui
      ─────────────────────────────────────────────────────────────────────

        plataforma   uvicorn plataforma.api:app              :8000
                     ← el UNICO que lee /datos en vivo

                     GET /v1/metricas ......... metricas.csv
                     GET /v1/modelos .......... modelos/registro.json
                     GET /v1/series/{id} ...... predicciones.csv + ventas.csv
                     GET /v1/job/ejecuciones .. ejecuciones_job.csv

        ui           streamlit                                :8501
                     ← no lee archivos: pide a :8000

        mlflow       mlflow ui                                :5000
                     --backend-store-uri file:///datos/mlruns
                     (make mlflow · perfil aparte: `make arriba` NO lo levanta)
    notas: |
      **La diferencia que ordena todo el laboratorio: `run --rm` corre y
      muere; `up -d` se queda escuchando.**
      - **Los cuatro `GET` vuelven en el reto 1**, con `curl`. Acá solo se
        señala que cada uno sale de un archivo concreto.
      - **La interfaz no abre ni un CSV.** Pide a `:8000` como cualquiera, y
        eso es lo que la hace sustituible.
      - Si preguntan por qué MLflow sí lee `/datos` directo: porque su almacén
        **es** una carpeta, no una base de datos. Lo vieron dos láminas atrás.

  - id: s1-mlflow-ui
    tipo: demo
    titulo: El registro de modelos, abierto
    entradilla: make mlflow. Es el mismo MLflow del Módulo 2, con 192 ejecuciones dentro.
    minutos: 4
    pasos:
      - comando: make mlflow
        esperado: "abre http://localhost:5000 · experimento «pronostico-demanda»"
      - comando: "# Columns → añadir mape_validacion, y ordenar por esa columna"
    observar: >-
      **Entrar al experimento `pronostico-demanda`**: 192 runs, uno por modelo,
      con el nombre del `modelo_id`. La columna `mape_validacion` **no sale
      sola** — se añade desde el botón **Columns**, y vale hacerlo en vivo.
      Ordenar por ella y ver la dispersión: **el mejor ronda el 6% y el peor
      pasa del 20%, el día en que se entrenaron.** Ese abanico es el que luego
      se desplaza entero, y es lo que estamos a punto de medir.
    respaldo: >-
      Si no levanta, `registro.json` tiene lo mismo sin interfaz:
      `docker compose run --rm plataforma head -c 400 /datos/modelos/registro.json`.
      Nada de lo que viene depende de haber visto esta pantalla.
    notas: |
      **4 min y no más.** No es un taller de MLflow: se abre, se ordena por
      `mape_validacion`, se dice que es el del Módulo 2 y se cierra.
      - **Lo que se llevan**: el 10.4% tiene dónde mirarse, y cada uno de los
        192 tiene ficha con algoritmo, `alpha` y fecha.
      - Si sale «¿no debería ser el registro de producción?»: sí, y en una
        cadena real lo sería. **Acá manda `registro.json` porque el job tiene
        que poder ejecutar sin MLflow arriba.** Simplificación consciente.

  - id: s1-glosario-herramientas
    tipo: glosario
    titulo: Y las tres herramientas que se ven, no se escriben
    entradilla: Las tres vienen dadas. Conviene saber cuál hace qué antes de abrirlas.
    minutos: 3
    terminos: [MLflow, LangGraph, Streamlit]
    nuevos: [LangGraph, Streamlit]
    notas: |
      Van juntas porque **ninguna de las tres se escribe en este taller, y las
      tres se abren.**
      - **Decirlo explícitamente ahorra ansiedad**: nadie tiene que aprender
        LangGraph hoy.
      - MLflow vuelve solo para cerrar el trío; ya se abrió hace cuatro
        láminas. **LangGraph es la única que aporta una idea y no solo
        comodidad.** Streamlit dibuja el razonamiento en 286 líneas.

  - id: s1-mlflow-captura
    tipo: imagen
    titulo: Lo que se ve dentro
    entradilla: Una fila por modelo, y las columnas son exactamente lo que registra el código
    archivo: img/mlflow-runs.png
    destacar: [61, 25, 12, 62]
