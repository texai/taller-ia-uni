  - id: s1-job-carga
    tipo: codigo
    titulo: Y esto es el job de madrugada
    entradilla: Cargar los 192 y predecir. Tres líneas, y una de ellas es la que abre los artefactos.
    lenguaje: python
    ruta: plataforma/pronosticar.py
    numeros: ["62-69"]
    resaltar: ["4-6"]
    minutos: 3
    contenido: |2
          """Simula una ejecucion diaria del job por cada fecha del rango."""
          inicio = time.time()
          ventas = pd.read_csv(RUTA_VENTAS, parse_dates=["fecha"])
          flota = _cargar_flota()

          modelos_cargados = {
              mid: joblib.load(r["artefacto"]) for mid, r in flota.items()
          }
    notas: |
      **Este es el job batch del caso, y son tres líneas.** Se lee el mundo, se
      lee el registro, y se abren los 192 artefactos de una vez con
      `joblib.load` — el reverso exacto del `joblib.dump` de hace dos láminas.

      Señalar que los modelos se cargan **todos juntos y una sola vez**, no uno
      por petición. Es la diferencia de la que hablaba la lámina «un modelo no
      es un contenedor»: un proceso, 192 modelos en memoria, un CSV de salida.
      856 KB caben de sobra.

      Y la ruta de cada artefacto sale del registro, no de armar el nombre a
      mano. Es lo que permite que un modelo reentrenado ayer y otro de mayo
      convivan sin que el job se entere.

