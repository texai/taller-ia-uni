  - id: s1-job-carga
    tipo: codigo
    titulo: Y esto es el job de madrugada
    entradilla: Cargar los 192 y predecir. Tres líneas, y una de ellas es la que abre los artefactos.
    lenguaje: python
    ruta: plataforma/pronosticar.py
    numeros: ["62-69"]
    resaltar: ["4-6"]
    minutos: 3
    contenido: |2
          """Simula una ejecucion diaria del job por cada fecha del rango."""
          inicio = time.time()
          ventas = pd.read_csv(RUTA_VENTAS, parse_dates=["fecha"])
          flota = _cargar_flota()

          modelos_cargados = {
