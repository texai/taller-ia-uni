id: s1-apertura
tipo: repaso
titulo: Dónde encaja esto
objetivos:
  - Situar el taller dentro del programa y ver qué se junta acá
requisitos:
  - Haber hecho el trabajo previo y llegar con las 24 comprobaciones en verde
items:
  - id: s1-caratula
    tipo: caratula
    qr: /contenido/img/qr.svg
    minutos: 1
    notas: |
      **La lámina con la que se abre la videollamada.** Dejarla puesta
      mientras entra la gente.
      - **Leer el subtítulo en voz alta**, que es la promesa del día.
      - **Señalar el QR**: quien no tenga el enlace, ahora. Después nadie
        vuelve a pedirlo y se pierde la clase entera.

  - id: s1-la-app
    tipo: criterios
    titulo: Esta pantalla no es solo para mirar
    entradilla: Seis cosas que solo funcionan si la siguen desde su propio dispositivo
    minutos: 3
    criterios:
      - texto: La lámina que estoy dictando aparece sola en su pantalla
        pista: >-
          No hay que buscar por dónde voy. Y si se adelantan o retroceden, un
          botón los devuelve a donde va la clase
      - texto: Cuando lance una pregunta, responden desde ahí y el resultado se ve en vivo
        pista: >-
          Anónimo entre ustedes: en pantalla salen los totales, nunca quién
          eligió qué
      - texto: Pueden preguntarme sin levantar la mano, y sin poner su nombre si no quieren
        pista: >-
          Llegan a mi otra pantalla, no a la proyectada. Nadie más las ve
      - texto: El glosario está siempre a un clic, abajo a la derecha
        pista: >-
          Cuarenta términos. A las 18:20 nadie se acuerda de qué era la
          cobertura, y no hay que preguntarlo
      - texto: Los archivos y las guías se bajan desde la propia lámina
        pista: >-
          Y cada ruta de código enlaza al repositorio, en la línea exacta
      - texto: En los ratos de trabajo, el reloj corre en su pantalla
        pista: >-
          Con los minutos propuestos a la vista, para saber cuánto queda sin
          preguntar
    notas: |
      **3 min, y pagan el día entero.** Una sala que no sabe que puede responder
      no responde, y las preguntas dejan de medir nada.
      - **Pedir que abran el enlace ahora**, no «cuando puedan». El QR de la
        carátula sigue a un paso atrás.
      - **Insistir en el anonimato de las dos direcciones**: sus respuestas
        salen como totales, y sus preguntas no llevan nombre si no quieren.
        Es lo que hace que pregunten de verdad.
      - Si alguien no puede abrirlo: que siga por la pantalla compartida y lo
        arregle en el receso. **No parar la clase por esto.**

  - id: s1-portada
    tipo: titulo
    titulo: Un agente que vigila 192 modelos
    entradilla: Arquitectura cognitiva para monitoreo de modelos en producción
    minutos: 2
    notas: |
      - **Preguntar a mano alzada: ¿quién hizo el trabajo previo?**
      - Muchas manos abajo → el rescate va en paralelo los próximos 15 min,
        sin parar la clase.

  - id: s1-que-es-esto
    tipo: criterios
    titulo: Ocho horas, y qué sale de ellas
    entradilla: Lo que vamos a hacer, dicho antes de empezar a hacerlo
    minutos: 2
    criterios:
      - texto: Cinco retos, todos sobre el mismo caso y el mismo laboratorio
        pista: Nada de ejemplos de juguete que cambian entre lámina y lámina
      - texto: El laboratorio viene completo. Se lee, se ejecuta, y se rompe a propósito
        pista: En cuatro horas no hay tiempo de depurar código; sí de entender qué hace cada pieza y por qué
      - texto: En cada reto hay un rato para abrir archivos concretos y ejecutar comandos
        pista: Con la lista en pantalla y el reloj a la vista. Nadie tiene que adivinar qué mirar
      - texto: Al final tienes un agente con arquitectura cognitiva vigilando 192 modelos
        pista: Percibe, recuerda, razona, se cuestiona a sí mismo, y actúa
      - texto: El taller se evalúa solo por asistencia
        pista: No hay entregable ni examen. Lo que te llevas es el repositorio y lo que entendiste
      - texto: Todo lo que veas hoy está en un repositorio público
        pista: La plataforma, el agente, el verificador y los cuatro escenarios para seguir rompiendo
    notas: |
      **3 min** · leerlos completos, los seis.
      - **Énfasis en el 2, sin disculparse**: el lab viene escrito. Con 20
        personas, un error de sintaxis ajeno se lleva el reto entero.
      - Corregir esa expectativa **ahora**, no en el reto 2.
      - Los que tranquilizan: el 5 (no hay examen) y el 6 (queda el repo, no
        hay que transcribir nada).
      - Si alguien quiere escribirlo igual: `make verificar ARGS="--reto 2"`.

  # La lámina de arriba es la versión hablada del taller; ésta es la oficial.
  # La coordinación del programa pide por escrito que en la primera sesión se
  # proyecte y se explique el sílabo, con énfasis en los criterios de
  # evaluación — y hasta ahora la palabra «sílabo» no aparecía en el curso.
  - id: s1-silabo
    tipo: criterios
    titulo: El sílabo, y cómo se evalúa
    entradilla: Lo que el programa firmó que este taller cubre. Es el documento del aula virtual.
    minutos: 3
    criterios:
      - texto: "Sesión 1 · El mundo y la percepción"
        pista: >-
          El caso y su flota de 192 modelos, la telemetría que emiten, y las
          tres primeras prácticas: encontrar el problema a mano, construir la
          percepción y ver un bucle ReAct por dentro
      - texto: "Sesión 2 · La arquitectura cognitiva"
        pista: >-
          Del bucle plano al grafo: memoria, reflexión, revisión y acción con
          frenos. Las dos últimas prácticas y el cierre sobre los errores
      - texto: "Evaluación: asistencia. No hay examen ni entregable"
        pista: >-
          Y por eso se toma cuatro veces, dos por sesión: al cuarto de hora de
          empezar y al volver del receso
      - texto: Se pide cámara encendida y micrófono para responder la lista
        pista: >-
          La asistencia no se registra por el chat. Cuando le toque su nombre,
          se contesta hablando
      - texto: Los materiales quedan en el aula virtual y en un repositorio público
        pista: >-
          Las seis guías en PDF, el laboratorio completo y estas láminas. No
          hay nada que transcribir
    notas: |
      **Requisito del programa, y son tres minutos.** No es relleno: es el
      contrato, y la parte que preguntan es siempre la misma.
      - **Abrir el PDF del aula virtual mientras se dice esto.** El sílabo
        oficial hay que proyectarlo, no solo resumirlo.
      - **El criterio 3 es el que escuchan.** Decirlo entero: sin examen, sin
        entregable, y la asistencia se toma cuatro veces.
      - Si preguntan por la nota: la del aula virtual sale de esas cuatro
        listas, y el acta se envía el lunes.

  - id: s1-docente
    tipo: markdown
    titulo: Quién les habla
    entradilla: Ernesto Anaya Ruiz · Ingeniero de Plataforma
    minutos: 2
    contenido: |
      **Ingeniero de Plataforma en iO / BCP**, como contratista de Globant.
      **16 años** de experiencia profesional: **11 en DevOps** y más de
      **6 en proyectos de datos**.

      Antes de esto, **Head of DevOps Architecture en BBVA Perú** durante
      **6 años y medio**.
      Llevar la integración continua a más de la mitad de las aplicaciones
      del banco, automatizar despliegues condicionados a la calidad del
      código, y **formar a más de trescientos ingenieros** en herramientas y
      prácticas que no conocían.

      **Más de 800 horas de docencia.**

      | | |
      |---|---|
      | GitHub | [github.com/texai](https://github.com/texai/) |
      | LinkedIn | [linkedin.com/in/texai](https://www.linkedin.com/in/texai/) |
      | Correo | ernestex@gmail.com |
      | WhatsApp | 976 324 488 |
      
    notas: |
      **2 min** · no es el currículum, es por qué el taller está armado así.
      - BBVA = este mismo problema a otra escala: herramienta nueva, gente que
        ya tiene trabajo, y adopción solo si sirve el lunes.
      - **Decir las 800 horas de docencia**: responde en silencio a «¿este
        sabrá explicarlo?».
      - El WhatsApp está a propósito. Siempre queda alguien sin preguntar.
      - **Si el reloj aprieta, este ítem es el primero que se cae.**

  - id: s1-prework
    tipo: archivo
    titulo: El trabajo previo
    entradilla: Está en el aula virtual desde hace una semana. Si no lo hiciste, todavía sirve.
    archivo: archivos/taller-ia-uni-prework.pdf
    descripcion: >-
      Instalar Docker, clonar el laboratorio y dejar el entorno probado.
      Cuarenta minutos, y terminan en un comando que dice si está todo en
      verde.
    minutos: 2
    notas: |
      **Contar las manos.** Es el dato que decide cómo va la primera hora.
      - Muchas abajo → los tres rescates de la unidad siguiente dejan de ser
        «por si acaso» y se dictan.
      - No hay que leerlo ahora. Lo que tienen que saber: **lo que se rompa en
        la próxima media hora está resuelto ahí dentro.**

  - id: s1-guias
    tipo: descargas
    titulo: Seis guías, de dos caras cada una
    entradilla: Bájenlas ahora, las seis. Durante el día vamos a volver a ellas por nombre.
    minutos: 3
    archivos:
      - archivo: archivos/guias/01-docker-en-siete-comandos.pdf
        titulo: 1 · Docker en siete comandos
        descripcion: Lo que hay que saber de Docker para hoy, y ni una línea más
      - archivo: archivos/guias/02-leer-la-telemetria.pdf
        titulo: 2 · Leer la telemetría
        descripcion: MAPE, sesgo y cobertura, y cómo se lee mal cada una
      - archivo: archivos/guias/03-romper-el-mundo.pdf
        titulo: 3 · Romper el mundo
        descripcion: Los cuatro escenarios, y cómo seguir rompiendo después
      - archivo: archivos/guias/04-las-siete-herramientas.pdf
        titulo: 4 · Las siete herramientas
        descripcion: Los ojos del agente, y las reglas de una herramienta de percepción
      - archivo: archivos/guias/05-anatomia-del-agente.pdf
        titulo: 5 · Anatomía del agente
        descripcion: Del bucle plano al grafo, y por qué esa diferencia importa
      - archivo: archivos/guias/06-si-algo-falla.pdf
        titulo: 6 · Si algo falla
        descripcion: Las trece cosas que se rompieron montando esto
    notas: |
      **3 min de verdad: callarse y esperar a que las bajen.** A las 17:30
      nadie vuelve a la lámina tres.
      - Decir para qué **no** son: no sustituyen la clase, no se leen ahora.
        Son para tener al lado, y para el lunes.
      - Las 1-3 se usan hoy; las 4-6, mañana. Cada una reaparece sola en su
        momento, pero es más cómodo tenerlas ya.
      - También en el aula virtual y en el repo, carpeta `guias/`.

  # Acá, y no en la lámina tres, porque el correo de coordinación fija la
  # primera asistencia **15 minutos después de iniciada la sesión**. Sumando
  # los minutos de arriba, este punto cae exactamente en el 15. Tomarla al
  # minuto cuatro marcaba ausente a quien entra a las 15:10, y el acta es lo
  # único con lo que se evalúa el taller.
  - id: s1-asistencia
    tipo: asistencia
    titulo: Tomar asistencia
    nota: >-
      Primera de las dos de hoy; la segunda es al volver del receso. Uno por
      uno y en voz alta, con micrófono: no vale el chat de Zoom.

  - id: s1-recap
    tipo: diagrama
    titulo: Lo que ya traen puesto
    entradilla: Cuatro cosas del programa se juntan hoy, y dejan una pregunta abierta
    clase: componentes
    minutos: 3
    contenido: |
      flowchart LR
        D["Docker<br/>empaquetar un modelo"] --> F
        G["GitHub Actions<br/>desplegarlo solo"] --> F
        K["Kubernetes<br/>operarlo"] --> F
        ML["MLflow<br/>anotar como se entreno"] --> F
        F[("la flota<br/>192 modelos<br/>en produccion")] --> Q{"y ahora,<br/>quien los mira?"}
        Q --> HOY["hoy: un Excel los lunes,<br/>5 de las 24 tiendas"]
        Q -.->|las proximas 8 horas| AG["un agente<br/>que los vigila"]
    notas: |
      **Es el repaso del programa, no del taller.** Nombrar cada caja y dejar
      que reconozcan lo suyo.
      - **La frase**: su taller de Docker/Actions/K8s cerró con «monitoreo
        básico». *Esto empieza donde lo básico deja de alcanzar.*
      - MLflow es el mismo del Módulo 2, y lo que anota acá es **cada
        entrenamiento**: con qué se hizo y qué error dio. Numerar versiones y
        promoverlas a producción es el *Model Registry*, y **no se usa**.
      - **Señalar el rombo con el dedo**: a la izquierda todo es construir y
        desplegar; a la derecha no hay nada. La flecha punteada es el taller.
      - No detenerse en las cajas. La del Excel engancha con el caso.

  - id: s1-donde-estamos
    tipo: transicion
    titulo: Dónde estamos
    vimos: >-
      Cómo se empaqueta un modelo, cómo se automatiza su despliegue, y qué
      es monitorear en producción
    viene: >-
      Los 192 modelos que ya están desplegados, y el problema de que nadie
      los mire
    minutos: 2
    notas: |
      - Media frase y pasar. El mapa lo dibuja la aplicación sola.
